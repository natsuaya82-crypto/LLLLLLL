   screen in a long language -- Russian on a 568pt phone -- the name was
   printed across the door. */
.obdoor{flex:0 1 auto;min-height:0;height:min(30vh, 224px);
        display:flex;align-items:center;justify-content:center;color:var(--gold);line-height:0}
.obdoor svg{height:100%;width:auto;max-width:min(40vw,148px);display:block}
.ob .obh1{font-family:var(--face-caps);font-size:clamp(1.35rem,5.6vw,1.8rem);
          letter-spacing:.2em;margin-top:clamp(10px,2vh,16px);font-weight:600;flex:0 0 auto}
.ob .obtag{margin-top:clamp(6px,1.4vh,10px);font-size:clamp(.9rem,3.6vw,1.05rem);flex:0 0 auto}
.ob .obfoot .btn.signin{margin-bottom:10px}
/* The door's faces are forms, so they are read down the left edge and they
   scroll. A sign-in screen on a 568pt phone does not fit -- crest, two
   fields, a button, a link, a rule, Apple, Google -- and it must not be the
   one screen in the app that quietly clips its last button off. */
.ob .mid.obform{justify-content:flex-start;align-items:stretch;text-align:left;
                overflow-y:auto;-webkit-overflow-scrolling:touch}
/* A column that scrolls gives nothing away: the register face has four
   children and the flex box handed the last one every pixel left over, so
   the button was two thirds of the screen. */
.ob .mid.obform>*{flex:0 0 auto}
/* .ob.center is what took the margin off the splash, which was centred in the
   whole screen. The forms that replaced it are read from the top and want it
   back, or the heading sits against the chevron. */
.ob.center .mid.obform{margin:clamp(8px,2.1vh,20px) 0 0}
/* この扉のたて方向のリズムは、画面の高さについていく。

   サインインの顔だけが背が高い ── ふたつの欄と、押すやつと、忘れたときと、
   「または」と、Apple と Google。それを固定の余白で積むと、iPhone SE で
   122px、13 mini で 51px、iPhone 15 でも 21px はみ出していた。ヘッドレスの
   ブラウザでは env(safe-area-inset-*) が 0 なので、ここは「収まっている」と
   見えていて、実機だけで起きる ── 測るときは inset を差し込むこと。

   直し方は媒体クエリではなく clamp で、下限・伸び・上限の三つ。背の高い
   端末は今までと同じ見た目のまま、短い端末だけが自動的に詰まる。分岐が
   増えないので、四番目の端末が出ても書き足すところがない。

   下限は飾りではない。.btn の中身の行は 20.4px なので、上下 12px を切ると
   ボタンが 44pt を割る ── 1.7vh をそのまま使って 43px になり、press が
   それを言った。clamp の第一引数はどれもそういう床。

   .field と .btn.signin は他の三十の画面も着ているので、この扉の中だけに
   閉じてある。 */
.ob .mid.obform .btn{width:100%;margin-top:clamp(2px,.7vh,6px);
                     padding:clamp(12px,1.7vh,15px) 12px}
.ob .mid.obform .field{margin-bottom:clamp(5px,1.2vh,11px)}
.ob .mid.obform .btn.signin{margin-bottom:clamp(4px,1vh,10px)}
.ob .obcrest{text-align:center;flex:0 0 auto;margin-bottom:clamp(9px,1.8vh,20px)}
.ob .obcrest .obtag{line-height:1.45}
.ob .obcrest .obdoor{height:clamp(44px,8vh,116px)}
/* 扉の絵は、残りをもらう。

   高さを vh で決めると、どの端末にも合わない ── 下に積むもの(欄、押すやつ、
   忘れたとき、または、Apple、Google)は端末が大きくなっても背が伸びないので、
   余る量は画面の高さに比例しない。SE で 21px、iPhone 15 で 65px 余っていて、
   その差を一本の vh では表せなかった。

   なので絵が伸び縮みする側になる。116px が上限(前からの大きさ)で、44px が
   下限。この扉のファイルの一番上にもう書いてあることでもある ──
   「箱が縮んで、絵はその中に収まる」。 */
/* The crest TAKES the slack, and that is what pushes Apple and Google down to
   the bar. 「Googleはアカウント登録はこちらのギリギリで貼り付けて欲しい。全部下に
   行けば扉もっとデカくできるでしょ」OWNER 2026-08-26, build #93.

   It was `0 1 auto` -- shrink but never grow -- and every other child of
   .mid.obform is `0 0 auto`, so on a tall phone 111px of nothing sat between
   the last button and the bar. One of them growing is the whole fix: no
   margin-top:auto anywhere, because there is no slack left to push with once
   the crest has eaten it.

   Measured at four sizes: 390x844 the door goes 77x116 -> 144x219 and the gap
   111 -> 8; 375x667 and 320x568 do not move at all, because they had 6-7px of
   slack and there was nothing to eat. */
.ob .mid.obform .obcrest{flex:1 1 auto;min-height:0;
                         display:flex;flex-direction:column;justify-content:flex-end}
/* 220 and not more: .obdoor svg is `max-width:min(40vw,148px)` and the drawing
   is about 0.66 as wide as it is tall, so at 220 it is 146 across -- one step
   short of that cap. Past here the width holds it and the picture stops
   growing. */
.ob .mid.obform .obcrest .obdoor{flex:1 1 auto;height:auto;min-height:44px;max-height:220px}
.ob .obcrest .obh1{margin-top:clamp(3px,1vh,10px)}
.obor{display:flex;align-items:center;gap:12px;margin:clamp(7px,1.6vh,20px) 0 clamp(5px,1.3vh,14px);
      color:var(--txm);font-size:.82rem;flex:0 0 auto}
.obor::before,.obor::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
/* Instagram's bar, and it is the whole reason there are two screens: the way
   from one to the other is a fixed line at the foot, not a link buried under
   the button that does the other thing. */
.obbar{flex:0 0 auto;margin:0 -24px;padding:clamp(6px,1.2vh,14px) 24px 0;border-top:1px solid var(--line);
       display:flex;justify-content:center;align-items:center;gap:7px;
       font-size:.86rem;color:var(--txm)}
.obbar button{background:none;border:0;padding:0;font:inherit;font-size:.86rem;
              font-weight:600;color:var(--gold);min-height:44px}
.obbar button:active{opacity:.55}
.obskip{display:block;width:100%;min-height:44px;margin-top:clamp(0px,.5vh,4px);background:none;border:0;
        color:var(--txs);font:inherit;font-size:.84rem;text-decoration:underline;
        text-underline-offset:3px;text-decoration-color:var(--line)}
.obskip:active{opacity:.55}

.obback{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:inherit;opacity:.75;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;flex-shrink:0;min-width:44px;min-height:44px}
.obback:hover{opacity:1}
.obback:active{transform:scale(.92)}
.obback.ph{pointer-events:none;opacity:0}
.btn.signin .mk{flex-shrink:0}

.psn{font-family:var(--face-mono);font-size:.82rem;color:var(--txm)}
.pkown{display:flex;gap:8px;align-items:center;margin-bottom:10px}
/* .btn is flex:1 so a row of them shares the width; one beside a field is
   not sharing anything and shrank to the width of its word and grew tall. */
.pkown .btn{flex:0 0 auto;min-width:88px}
.pkclear{width:100%;margin-bottom:12px;padding:8px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--txm);font:inherit;font-size:.86rem;cursor:pointer}
.pktabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px;
  border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.pktab{display:flex;align-items:center;gap:5px;flex-shrink:0;min-height:44px;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:transparent;color:var(--txm);font:inherit;font-size:.84rem;cursor:pointer;white-space:nowrap}
.pktab.on{border-color:var(--gold);color:var(--gold)}
.pkpv{font-size:.9rem;color:var(--gold)}
.pkchars{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;
  max-height:34dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pkch{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--tx);font-size:1.15rem;cursor:pointer;padding:0}
.pkch.had{opacity:.28}
.pkch.cur{border-color:var(--gold);color:var(--gold)}
.scin{width:100%;min-width:0;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  color:var(--tx);font:inherit;font-size:1rem;outline:none}
.scin:focus{border-color:var(--gold)}
.scin.own{text-align:left}
.scin{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 7px;
  color:var(--tx);font:inherit;font-size:1.05rem;text-align:center;outline:none}
.scin:focus{border-color:var(--gold)}
.capwarn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:2px 0 14px;padding:12px 14px;
  border:1px solid rgba(201,168,106,.3);border-radius:10px;background:transparent;color:var(--txm);font:inherit;font-size:.88rem;cursor:pointer}
.capgo{color:var(--gold);flex-shrink:0}
.set.lock .sv{color:var(--gold)}
/* ---------- the grammar, in stages ----------
   A list of stages, each with what it still needs; then one stage open, with
   its words as rows you can fill on the spot. */
.stlist{display:flex;flex-direction:column;gap:0}
.strow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:14px 2px;
  border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer}
/* The title takes the room that is left and wraps if it has to; the number,
   the count and the chevron never shrink. Fixed-width titles pushed the count
   off a 320px screen in the languages with longer words. */
.strow .stn{font-family:var(--face-ital);font-style:italic;color:var(--gold);
  font-size:1.05rem;min-width:20px;flex:0 0 auto}
.strow .stt{font-size:.98rem;flex:1 1 auto;min-width:0;line-height:1.4}
.strow .lead{display:none}
.strow .stv{font-size:.88rem;color:var(--txm);flex:0 0 auto;white-space:nowrap}
.strow .go{color:var(--txm);flex:0 0 auto}
.strow.done .stt{color:var(--txs)}
.strow.done .stv{color:var(--gold)}
.stslots{display:flex;flex-direction:column;gap:0}
.stslot{display:flex;align-items:baseline;gap:10px;width:100%;min-height:56px;padding:13px 2px;
  border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer;flex-wrap:wrap}
.stslot .psm{font-size:.95rem;flex:0 0 auto;min-width:78px}
.stslot .psw{font-family:var(--face-caps);font-size:1.06rem;color:var(--gold)}
.stslot .psi{font-family:var(--face-mono);font-size:.84rem;color:var(--txm)}
.stslot .psn{font-size:.88rem;color:var(--txm)}
.stslot .go{margin-left:auto;color:var(--txm);flex:0 0 auto;align-self:center}
.stslot.has .psn{display:none}

/* ---------- a word, opened ----------
   Its meanings are a list, because a word can mean more than one thing, and
   the words derived from it are listed under it as the entries they are. */
/* a derived word, set in from the margin under the one it came from */
.mnlist{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
.mnrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mnrow .mnv{flex:1;font-family:var(--face-ital);font-style:italic;font-size:1.02rem;color:var(--tx)}
.mnrow .mnx{min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
  display:flex;align-items:center;justify-content:center}
/* the forms a rule makes, on the sheet a word is coined on: what it is
   called, what it is spelled, and the way to say it is not wanted */
.fmmks{display:flex;flex-direction:column;gap:0}
.fmmk{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.fmmk .fmmkf{flex:0 0 auto;min-width:88px;font-size:.78rem;color:var(--txm);letter-spacing:.04em}
.fmmk .lnin{flex:1;min-width:0;border-bottom:0}
.fmmk .mnx{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;
  color:var(--txm);display:flex;align-items:center;justify-content:center}
.mnadd{display:flex;gap:8px;align-items:stretch}
.mnadd input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:12px 2px;color:var(--tx);font:inherit;font-size:.92rem;outline:none}
.mnadd input:focus{border-bottom-color:var(--goldln)}
.mnadd .btn{flex:0 0 auto}
/* A meaning being added wraps now, so the field in this row is a textarea.
   `.lnin` is display:block and brings its own gap below; in a flex row it
   takes the room the input had and nothing else. 「全部改行して画面内に文字が
   収まるようにして欲しい」 OWNER 2026-08-27. Nothing is added -- no frame,
   no corner; the line under it is `.lnin`'s own, one side. */
.mnadd .lnin{flex:1;min-width:0;margin-bottom:0}
/* the letter a sound wears, when it was borrowed rather than drawn */
.gborrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--pane)}
.gborrow .gbch{font-size:1.7rem;color:var(--gold);line-height:1}
.gborrow .gbl{font-size:.88rem;color:var(--txs)}
.gborrow .gbx{margin-left:auto;min-height:44px;padding:6px 12px;background:none;
  border:1px solid var(--line);border-radius:8px;color:var(--txm);font:inherit;font-size:.86rem}

/* ---------- notes ----------
   A notebook page: a heading and the first line of what is under it. */
.ntlist{display:flex;flex-direction:column;gap:10px}
.ntrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:14px 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--pane);color:inherit;font:inherit;cursor:pointer}
.ntrow:active{transform:scale(.995)}
.ntrow .nth{font-size:.95rem;color:var(--tx)}
.ntrow .ntb{font-size:.88rem;color:var(--txm);line-height:1.6}
.ntbody{min-height:180px;line-height:1.8}
/* A textarea outside a .field had no styling of its own, so a rule written
   straight onto a page came out as a white box on a dark screen. */
textarea.ntbody{width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
   padding:12px 2px;color:var(--tx);font-family:inherit;font-size:.94rem;outline:none;resize:vertical}
textarea.ntbody:focus{border-bottom-color:var(--goldln)}
/* A box that is written into is as tall as what is in it and no taller: no
   scrollbar of its own inside a page that already scrolls, and no field of
   empty grey where nothing has been written yet.
   `textarea.grow` and not `.grow`, and after `.ntbody` rather than before it,
   because `.ntbody` sets a floor of 180px and `textarea.ntbody` sets resize —
   a single class written earlier loses to both, which is what left every one
   of these boxes tall and half empty. */
textarea.ntbody.grow{min-height:0;height:auto;overflow:hidden;resize:none}

/* ---------- grammar: a decision, and what it does ----------
   A row of choices, then the piece of sound the choice is carried by, then
   one of your own words before and after it. The demonstration is the point,
   so the panel is built around it. */
.gorder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 2px}
.gor{font-size:.86rem;color:var(--tx)}
.gsep{display:flex;align-items:center;color:var(--gold);opacity:.8}
.gdemo{margin:12px 0 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--pane)}
.gside{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.gside:first-child{border-top:0}
.gside .gsl{flex:0 0 auto;font-size:.82rem;letter-spacing:.13em;text-transform:uppercase;color:var(--txm);min-width:50px}
.gside .gsw{font-family:var(--face-caps);font-size:1.04rem;color:var(--tx);word-break:break-word}
.gside .gsi{font-family:var(--face-mono);font-size:.84rem;color:var(--gold)}
.gside .gsg{font-family:var(--face-ital);font-style:italic;font-size:.88rem;color:var(--txs)}
.gside .gsp{margin-left:auto;flex:0 0 auto;min-width:38px;min-height:38px;background:none;border:0;
  color:var(--txs);display:flex;align-items:center;justify-content:center;align-self:center}
.gside .gsp:active{opacity:.5}
.gneed{margin:10px 0 2px}

/* ---------- nothing tappable smaller than a thumb ----------
   Apple's floor is 44px and a phone has nothing finer to point with. These
   are the buttons that were drawn to the size of their mark rather than to
   the size of the finger that has to find them. */
.play,.gside .gsp,.pkclear,.obskip{min-height:44px}
.gside .gsp{min-width:44px}

/* ---------- the marks, now that they are drawn ----------
   A typed character sat on the text baseline and took its size from whichever
   font answered. A drawn one does neither, so every place that used to hold
   one is told where to put it instead. */
.ic{vertical-align:-.12em}
.search .lens{display:flex;align-items:center;color:var(--txm);flex:0 0 auto}
.set .sv{display:flex;align-items:center;gap:6px}
.set .sv .go,.capgo .go{opacity:.75}
.capgo{display:inline-flex;align-items:center;gap:4px}
.lrow .lchk{flex:0 0 16px;display:flex;align-items:center;justify-content:flex-end}
</style>
</head>
<body>
<!-- The door. The app used to appear mid-flight: the first frame drawn was
     whatever screen you had left, arriving before the fonts, before the
     custom typeface had been built out of your own letters, and before the
     first paint had settled -- so opening it felt like being dropped rather
     than let in. This holds for a moment and goes. -->
<div id="splash"><div class="splbrand">LIN<span class="st">G</span>UA</div>
<div class="splrule"></div></div>
<div id="app"></div>
<!-- The tab bar lives out here, beside the screen rather than inside it.
     render() replaces #app whole on every navigation, so a bar written into
     the HTML of each screen was destroyed and rebuilt -- with its blur --
     every time you moved, and it was only written into five of the
     twenty-five screens at all. Out here it is built once and never again;
     render() only moves which tab is lit. The report is in www/shell.js,
     over tabBar(). -->
<div id="tabs"></div>

<div class="sbg" id="sbg" onclick="closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* Plain script, no module: it must run before anything heavy. The splash is
   dismissed on the later of "the app has drawn" and 900ms, so a fast phone
   still sees the name rather than a flash. */
(function(){
  var el=document.getElementById('splash'), t0=Date.now(), done=false;
  function shut(){
    if(done) return; done=true;
    el.className='off';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 420);
  }
  window.splashDone=function(){
    var w=900-(Date.now()-t0);
    setTimeout(shut, w>0? w : 0);
  };
  /* if anything at all goes wrong, the door still opens */
  setTimeout(shut, 4000);
})();
</script>

<!-- The app, in load order. It used to be one file; it is now several, because
     a file small enough to send is a file that can be changed. Nothing else
     changed: these are plain scripts, not modules, and they share one global
     scope exactly as the single <script> did.

     The order is the only thing here that matters:
       core.js      defines defLang(), so it comes before the ten languages
       ipa.js       the chart every sound is chosen from; data only
       voice.js     what a phoneme sounds like; reads ipa.js, so after it
       i18n/*.js    each registers itself; this order is the order they appear
                    in the language picker
       otf5.js      defines the font writer, so it comes before glyph.js
       glyph.js     ends with installScriptFont() and render() — the app starts
                    on its last two lines, so it goes last -->
<script src="core.js"></script>
<script src="ipa.js"></script>
<script src="voice.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/pt.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/ru.js"></script>
<script src="i18n/zh.js"></script>
<script src="i18n/ko.js"></script>
<script src="i18n/ja.js"></script>
<script src="act.js"></script>
<script src="reading.js"></script>
<script src="letters.js"></script>
<script src="shell.js"></script>
  <script src="net.js"></script>
  <script src="onboard.js"></script>
  <script src="home.js"></script>
  <script src="words.js"></script>
  <script src="sound.js"></script>
<script src="wsys.js"></script>
<script src="assist.js"></script>
<script src="grammar.js"></script>
<script src="grammar-engine/model.js"></script>
<script src="grammar-engine/morphology.js"></script>
<script src="grammar-engine/lexicon.js"></script>
<script src="grammar-engine/translate.js"></script>
<script src="grammar-engine/adapter.js"></script>
<script src="phases.js"></script>
<script src="notes.js"></script>
<script src="settings.js"></script>
  <script src="wordsheet.js"></script>
<script src="keyboard.js"></script>
<script src="share.js"></script>
<script src="import.js"></script>
<script src="numbers.js"></script>
<script src="cal.js"></script>
<script src="otf5.js"></script>
<script src="glyph.js"></script>
<script src="card.js"></script>
<script src="sns.js"></script>
<script src="post.js"></script>
<script src="mod.js"></script>
<script src="rec.js"></script>
<script src="me.js"></script>
<script src="store.js"></script>
<script src="backup.js"></script>
<script src="sync.js"></script>
<script src="sheet.js"></script>
<script src="route-map.js"></script>
  <script src="act-map.js"></script>
<script src="boot.js"></script>
</body>
</html>
