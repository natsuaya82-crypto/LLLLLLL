   languages. 51x31 and a 27 knob is iOS's own, so it reads as the thing it
   is on the phone this app runs on. */
/* One definition, and there is nowhere else. There were two -- this and a
   `.sw` further down the file, 50x30 against 51x31, one knob moved by `left`
   and the other by `transform`. Both were live at once and neither was whole:
   the later `.swk` won on the knob's size and its transition, so the switch
   up here moved by a property nothing was transitioning and JUMPED across
   instead of sliding. Two rules for one thing do not disagree loudly; they
   disagree in the half nobody looks at. */
.swt{margin-left:auto;flex:0 0 auto;width:51px;height:31px;border-radius:999px;
     background:var(--line);position:relative;transition:background .18s ease}
.swk{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
     background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .18s ease}
.swt.on{background:var(--gold)}
.swt.on .swk{transform:translateX(20px)}
/* One of a few, chosen. It was a rounded box with a rounded box sliding
   inside it, which is the one shape this app does not have -- everything a
   thumb chooses from sits on a rule and the chosen one is marked under it.
   The same look .seg already has, on the row of a keyboard's faces, because
   it is the same sentence. 「基本的に下直線なんだから角丸禁止」 */
.pick{display:flex;border-bottom:1px solid var(--line);margin:10px 0 4px}
.pick button{min-height:44px;flex:1;background:none;border:0;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  color:var(--txs);font-size:.85rem;padding:9px 0;font-family:inherit}
.pick button.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.lrow{justify-content:space-between;gap:10px}
.lrow .sl{flex:0 0 auto}
.lrow .lsam{margin-left:auto;font-size:.88rem;color:var(--gold);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lchk{flex:0 0 14px;text-align:right;color:var(--gold)}
.lrow.on .sl{font-weight:600}
/* The plans, side by side. Three pages that slide, with the next one showing
   at the edge. 「横並びにして。ページは上に三つあるんじゃなくてスライドで
   変わるタイプで隣のプランが少しはみ出して見える感じ」

   No card, no border, no corner. What separates one plan from the next is the
   gap and the edge of the screen -- which is also what tells somebody there
   is another one over there. The rail sits outside .body because .body's side
   padding would stop it short of the edge, and a rail that stops short cannot
   show the next page coming. */
.plrail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
        -webkit-overflow-scrolling:touch;padding:10px 24px 0}
.plpage{flex:0 0 80%;scroll-snap-align:center}
.plname{display:flex;align-items:center;gap:8px;min-height:34px}
.plname .pn{font-family:var(--face-caps);font-size:1.15rem}
.plname .badge{font-size:.72rem;letter-spacing:.16em;color:var(--gold);padding:2px 0}
/* The month and the year, beside each other, each one a button that buys that
   term. 「値段はマンスリー、イヤーを並べてイヤーは何パーオフかを書く」
   1.25rem and not the 1.9 a single price on a full-width card was: two of
   them share a page 80% of a phone wide, and 1.9 wraps `$4.9 / 9`. */
.plterms{display:flex;gap:14px;margin-top:8px}
.plterm{flex:1;display:block;text-align:left;padding:6px 0;min-height:44px}
.plterm .pp{display:block;font-size:1.25rem;font-weight:600;color:var(--tx);
            line-height:1.25;letter-spacing:-.01em}
.plterm .pper{display:block;font-size:.72rem;color:var(--txm)}
.plterm .plsave{display:block;font-size:.72rem;color:var(--gold)}
/* 1.25rem was 3px too wide for `$4.99 / month` to sit on one line inside the
   box the term buttons got, so 「4.99/月は一列にしろ」OWNER 2026-08-26 was not
   actually met -- and at 320 the amount broke mid-number (`$99.9` / `9`).
   Measured at 320 and 390, both currencies, both terms. `press` walks a 402pt
   phone and only that one, so neither showed there. The padding lives on the
   box rule below and NOT here: this file already had a `.btn.plterm` twenty
   lines down, so a second one of the same strength was simply overwritten --
   green everywhere, because box-check counts borders and corners and says
   nothing about a rule that lost. */
.plterm .pp{font-size:clamp(.78rem, 3.3vw, 1.1rem)}
/* An amount never breaks, and neither does its term: what may drop to a second
   line is the whole of `/ month`, and only on a 320 phone. */
.plterm .pp,.plterm .pper{white-space:nowrap}
/* Twelve months at the monthly price, struck through, on the line above what a
   year costs. Its own line: beside the price it pushes the amount onto a second
   line, which is the fault above. Muted and small -- it is the number being
   compared AGAINST, and the one being paid is the big one.
   「49.99は取り消し線＋17%OFF」OWNER 2026-08-26. */
.plterm .pwas{display:block;font-size:.72rem;color:var(--txm);line-height:1.35;
              white-space:nowrap}
/* The one box in the app. 「11は、角丸でいいから囲わないとボタンを押してるか
   わからん」OWNER 2026-08-26 -- the month and the year are the only thing on
   this page anybody presses, and with nothing round them they read as two
   prices printed side by side rather than as a choice. Rule 18 carries the
   exception and tools/box-baseline.txt holds it to this pair; nothing else
   may take it as permission.
   `.btn.plterm` and not `.plterm`: .btn says border:none 800 lines below, and
   one class cannot beat two. */
.btn.plterm{border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.btn.plterm:active{border-color:var(--gold)}
/* 「4.99/月は一列にしろ」OWNER 2026-08-26. The amount and the term were two
   blocks, so every price stood two lines high and the term read as a caption
   under it rather than as part of the price. The saving stays on its own
   line: it is a third thing and not part of what the year costs. */
.plterm .pp{display:inline}
.plterm .pper{display:inline;margin-left:2px;font-size:clamp(.6rem, 2.1vw, .72rem)}
/* Free carries its price too, and it is not a button: without it the four
   lines start higher than the paid pages' five do and the lists jump as
   somebody slides between them. */
.plterm.no{color:var(--txm)}
.plterm.no .pp{color:var(--txm)}
.pllines{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.pli{display:flex;align-items:flex-start;gap:8px;color:var(--txs);font-size:.85rem;
     line-height:1.45}
.pli svg{flex:0 0 auto;margin-top:3px;color:var(--gold)}
/* Restoring is the one Apple asks for and cancelling is Apple's own sheet.
   The second is smaller because it is the rarer road and not a thing to
   encourage; it is in a box of its own so that it is not a second row of a
   list wearing one class at two sizes, which is a thing `press` holds. */
.plfoot{padding:22px 24px 0;text-align:center}
.plfoot2{padding:2px 24px 0;text-align:center}
.plfoot2 button{font-size:.8rem;opacity:.7}

/* ---------- locked behind a paid plan ---------- */
.lock{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;
      border:1px dashed var(--line);border-radius:13px;padding:14px 16px;color:var(--txs);margin-top:10px}
.lock .lk{color:var(--txm);font-size:.86rem}
.lock .lt{font-size:.9rem;color:var(--txs)}
.lock .ld{font-size:.86rem;color:var(--txm)}
.lock .tag{margin-left:auto;font-size:.82rem;letter-spacing:.14em;color:var(--pur);
           border:1px solid var(--purln);border-radius:3px;padding:2px 8px;flex:0 0 auto}

/* ---------- the profile, above the three lists ----------
   The whole of it under a third of the phone, so the posts start on the first
   screen rather than the second. The language used to be a cover -- flex:1,
   the name set large in the middle, a bordered card each for the letters, the
   words and what it is for -- which was right when this screen WAS a cover and
   left eight tenths of the phone gone before the first post. */
/* Beside the face, the name and the handle and the language; under all of it,
   at the left margin and across the whole phone, the line about yourself. As
   one row -- face, words, button -- that line read in a column two thirds of
   the phone wide, indented from both sides, and on somebody else's page it is
   most of what there is to read. */
/* FULL WIDTH, like a post. 「なんでプロフィールの画面そんなに真ん中によってん
   の？ もっと画面全体に広げて欲しいんだけど」 OWNER 2026-09-01.

   `.body` already pads 24 each side and this added 24 MORE, so the card's
   contents began 48px in -- on the owner's SE2 that is 96 of 320, thirty per
   cent of the screen given to margin. `.post` has solved this since it was
   written: `margin:0 -24px` cancels the body's padding and the row carries
   its own 16. Same idiom, same number, so the card lines up with the posts
   underneath it instead of being indented past them.
   Measured: contents start at 48px -> 16px; usable width on 320 goes 224 ->
   288, and on 402 354 -> 370. */
.mecard{margin:0 -24px;padding:2px 16px 0}
/* position: the ... menu inside it hangs off `top:100%` and needs something
   to be 100% OF. Without this it took the page as its ancestor and opened at
   the bottom of the screen, over the tab bar. A post row is positioned for
   the same reason. */
.metop{display:flex;align-items:center;gap:12px;position:relative}
.mecard .pav{width:56px;height:56px;flex:none}
.mecard .pav canvas{width:36px;height:36px}
.mewho{flex:1 1 auto;min-width:0}
.mecard .pname{font-size:1.15rem}
/* The handle and the language on one line. The tag is small, so the button
   around it carries the height a thumb needs and the tag itself stays the
   size it is on a post. */
.mehr{display:flex;align-items:center;gap:8px;min-width:0}
/* The height a thumb needs is taken out of the margins rather than added to
   the line, so the tag sits beside the handle where it belongs and the hit
   area reaches above and below it over things nothing else is listening to. */
/* A person, as a row on the search. Your own is a button -- it opens your
   profile, which is the one profile this phone has. Anybody else's is a row,
   because there is nowhere for it to go and a button that goes nowhere is
   worse than no button. */
/* A person, found. Two controls in one row: the person, which opens their
   page, and Follow, which does the thing you came here to do and leaves you
   where you are. The row is the container and the rule underneath is its. */
.whrow{display:flex;align-items:center;gap:10px;width:100%;
       border-bottom:1px solid var(--line)}
.whgo{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;
      padding:12px 2px;border:0;background:none;color:var(--tx);
      text-align:left;font-family:inherit}
/* Outline, and filled with nothing until it is on -- Follow is the thing to
   press and Following is a state, which is the same shape the profile's own
   button already uses. */
.whfo{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;
      border:1px solid var(--goldln);background:none;color:var(--gold);
      font-family:inherit;font-size:.86rem;white-space:nowrap}
.whfo.on{background:var(--goldsf);color:var(--txm);border-color:var(--line)}
.whrow .pav{width:40px;height:40px;flex:0 0 auto}
.whb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.whb .pname,.whb .phandle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The handle and 「フォローされています」 on one line under the name, and the
   line about themselves under that -- the shape the owner named for the
   follows list. No corner, no border, no fill: rule 18, and the only box the
   owner asked for here is .whfo, which was already a box and is already in
   tools/box-baseline.txt. */
.whh{display:flex;align-items:baseline;gap:6px;min-width:0}
.whyou{flex:0 0 auto;font-size:.72rem;color:var(--txm);white-space:nowrap}
/* One line. .pbio is pre-wrap where a profile shows the whole of it; in a
   list a row is a row. */
.whb .pbio{margin-top:2px;font-size:.86rem;line-height:1.45;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whrow svg{flex:0 0 auto;color:var(--txm)}
/* A row to write in, at the top of the timeline. Not a field: pressing it
   opens the screen a post is written on, where the letters, the photographs
   and the voice are. 「ホームからもツイートできるように」 */
/* 44 exactly, and the face is what gives the height back. The row was 69 --
   a 40px face with 14 above and below -- and three lines of that put the
   timeline 44px further down the screen 「上の幅めちゃくちゃ広くなってる
   やんけ」. 32 + 6 + 6 is 44, which is the floor and not a pixel over it. */
.wrow{display:flex;align-items:center;gap:12px;width:100%;
      margin:0 -24px 0;width:calc(100% + 48px);padding:6px 16px;
      border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.wrow .pav{width:48px;height:48px;flex:0 0 auto}
.wrt{flex:1 1 auto;min-width:0;color:var(--txm);font-size:1rem;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow:active{opacity:.6}
/* The day's sentence over what you are asked to do with it, beside the face
   that fills both lines 「アイコンは2列分うめて その横からお題と自分の言語で
   入れるのは？」. The face is what gives this row its height, so two lines of
   type cost nothing over one.

   Each line is cut with an ellipsis, so the row is the same height whatever
   the day says. */
.dayrw{align-items:center}
.dayrb{flex:1 1 auto;min-width:0}
/* The two lines are TALLER than the face, so each sticks out half a step past
   it rather than both sitting inside it 「アイコンの内に収まるんじゃなくて
   半歩ずつ出して欲しい」. 24 and 24 against a 40px face is 4px over at each
   end, which is the half step.

   The sizes are the ones the two lines already had -- .95 for the sentence,
   1rem for what you are asked to do with it 「文字サイズもさっきと変えないで
   欲しい」. */
.dayline{display:block;font-size:.95rem;line-height:26px;color:var(--tx);
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrb .wrt{display:block;font-size:1rem;line-height:26px}
/* The label in front of the sentence. */
.dayk{color:var(--gold);font-weight:600;margin-right:8px}
/* And which day the sentence is for. On the second line, quiet, because it
   qualifies the label rather than competing with the sentence. */
.dayd{margin-left:10px;font-size:.82rem;color:var(--txs)}
/* And the gap over it. The bar's own 8 and the body's 10 stack into 18px of
   nothing between the name of the screen and the face under it. */
.dayrw{margin-top:-8px}
/* The post a reply is going into, above what you are writing. It is shaped
   the way every other row in this app is -- a hairline under it -- rather
   than as a filled 14px panel, which is the chip problem again and is what
   the rule at the head of this file is about. Its line is also the line over
   the field.

   SMALL, AND THE SAME SIZE ON EVERY PHONE. 「相手の投稿は小さく固定、その下
   から自分が打てるようにしてくれ」 OWNER 2026-08-28. The cap was a quarter of
   the visible part, which is a different number on every phone and the wrong
   one on the small one: 320x568 with the keyboard up leaves 308, a quarter of
   which is 77, and the floor under it (44) plus the composer's own floor
   (162) plus the row of pictures (53) came to more screen than there is. What
   overflowed went behind the row of pictures, and `.body` is overflow:hidden,
   so the field somebody types the MEANING into was on the phone and could not
   be reached. A quarter of a screen is not a size; 76px is.

   `flex:0 0 auto` is the 固定 half: it does not grow into the composer's room
   and does not shrink out of its own, so it is where it was whatever is
   happening below it. A line too long for 76 scrolls inside itself, so
   nothing is lost by it being small.

   And the row itself is smaller than a post in the timeline -- 26px of face,
   the type one step down, half the padding. It is what you are glancing at,
   not what you are reading. */
/* The gap is under it only, and it is 6. A margin over it was 2px that buys
   nothing -- the line saying who is being answered is already a grey line of
   its own -- and on the small phone this box is squeezed to nothing and its
   margins are not, so every pixel here is spent whether or not there is
   anything to look at. */
.pwqs{margin:0 0 6px;max-height:76px;overflow:auto}
.pwq{display:flex;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line)}
.pwq .pav{width:26px;height:26px}
.pwq .pname{font-size:.82rem}
.pwq .phandle{font-size:.78rem}
.pwq .pline{font-size:.88rem}
.pwq .pmn{margin-top:1px;font-size:.78rem;color:var(--txm)}
/* What money buys that anybody can see, beside a name. Plus is the star
   drawn, Studio is the star filled -- outline against solid, which is the one
   difference that survives being fifteen pixels wide.
   「plusとstudioでそれぞれTwitterの青バッチみたいなやつつけたい」 */
.bdgw{flex:0 0 auto;display:inline-flex;align-items:center;margin-left:1px;
      vertical-align:-2px}
/* The colour goes on the MARK, not on the wrapper, because the mark appears in
   three places and they are all the same statement: beside a name on a post,
   on the Pro row of the price list, and inside the button that offers it to
   somebody who has not bought it. Written on the wrapper it would have been
   three rules agreeing, and the third is the one that gets missed -- it is the
   only one nobody sees until they are about to pay. `.bdg` is the svg's own
   class and travels with it. */
.bdg{color:var(--verif)}
.bdgw.studio{color:var(--gold)}
.bdgw svg{display:block}
.pname .bdgw{margin-left:5px}
/* The way in, on the profile, where somebody is looking at the thing they
   would be buying -- the badge goes beside the name three lines up. It was at
   the bottom of a room inside the settings, and something you have to hunt
   for is something nobody buys.
   A row, not a gold pill. It was a 14px corner and a gold-tinted panel sitting
   two lines above `.wldrow`, which is a hairline and nothing else, so the one
   thing on the page that was trying to sell something was also the one thing
   shaped like a box. 「文字書いて四角で囲ったみたいなボタン全部やめてくれ」
   Same shape as `.wldrow` below it now -- said again rather than borrowed,
   for the reason `.wldrow` gives about `.set`. The gold is kept: a colour is
   not a box, and this is still the way in. */
.upsell{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;
        margin-top:6px;padding:13px 2px;background:none;
        border:0;border-bottom:1px solid var(--line);
        color:var(--gold);font-family:inherit;text-align:left}
.upsm{flex:0 0 auto;display:inline-flex}
.upst{flex:1 1 auto;min-width:0;font-size:.95rem;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upsell svg{flex:0 0 auto}
.upsell:active{opacity:.6}
/* The language, as a row of its own between what somebody says about
   themselves and how many people are reading them. It was a small tag beside
   the handle -- which is where a timeline puts an affiliation, and is exactly
   the wrong size for the thing this whole app is about.
   「フォローと自己紹介の間に」「linguaパッチの代わり。Lingua > みたいに」 */
/* A row, not a box. It was a gold-outlined rounded button sitting on a page
   whose every other line is flat text, and a bordered box among flat text
   floats. 「ボタンが浮いててダサい」 So it is what a row is everywhere else in
   this app: full width, a hairline under it, nothing around it. .set is that
   shape and this is that shape -- said again rather than borrowed, because
   .set lives on a settings screen and this lives on a profile, and the day
   one of them changes it must not drag the other with it.
   There was a SECOND `.wldrow` rule earlier in this sheet -- the cover's, a
   bordered box with a 10px corner. This one overrode its `border` and did not
   override its `border-radius`, so the corner outlived the box: a 10px radius
   on a rule that draws one hairline, curling the line up at both ends.
   「角丸みたいな下線がきもい」 The second rule is gone. This is the only
   `.wldrow`, and it is the cover's row as well as the profile's. */
.wldrow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;
        margin-top:6px;padding:13px 2px;background:none;
        border:0;border-bottom:1px solid var(--line);
        color:var(--gold);font-family:inherit;text-align:left}
.wldnm{flex:1 1 auto;min-width:0;font-size:1rem;letter-spacing:.06em;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wldoff{flex:0 0 auto;font-size:.78rem;color:var(--txm)}
.wldrow svg{flex:0 0 auto;color:var(--txm)}
.wldrow:active{opacity:.6}
/* The page itself. The language names itself, then what it is for, then the
   facts as rows, then what was written about it, then the letters drawn.
   The three tiles that used to sit here (.abtnums/.abtn) are gone with their
   rules: 「wikiの見た目にしろって言ってなんでそんなゴミができるの？」
   OWNER 2026-08-25. An article opens with a table of facts, not a row of
   cards, and `.abtn` carried a `border-radius:14px` besides. The rows are
   `.set` now, which every settings screen already wears.
   Deleted rather than left unworn: tools/css-baseline.txt says a line comes
   OUT as progress, and growing that list to keep a dead rule quiet is the
   opposite of what it is for. */
/* An article's headings. `.sec` is a SETTINGS label -- .82rem, grey, uppercase,
   tracked out -- and using it here was the whole reason this page read as a
   settings screen with a name on top instead of an article.
   「wikiの見た目にしろって言ってなんでそんなゴミができるの？」
   「wikiの見た目どうなってんの？お前の認識もゴミやんけ」 OWNER 2026-08-25.
   An encyclopedia heading is LARGER than the text under it, in the display
   face, with one rule across. That is the whole of the look, and this app
   already says a rule across is the shape it wants:
   「かくまるみたいなのでくくるのやめて欲しい。基本下線だけ」.
   No box, no corner, no fill -- one side, which rule 18 counts as a line and
   not as a box, and which tools/box-check.mjs does not count at all. */
.abth{font-family:var(--face-caps);font-size:1.7rem;line-height:1.2;color:var(--tx);
      margin:2px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
/* A section heading is the UI face and not the display one, and that is a
   cross-script fix rather than a taste: `--face-caps` is a Latin display face,
   so a Japanese heading fell through it to the system font and a Latin one did
   not. The same class came out visibly LARGER and heavier in Japanese --
   「セクション」 loud over 「The valley」 quiet -- which put a UI label above the
   title somebody wrote, the wrong way round on an article whose sections are
   theirs. One family both scripts have is one heading level in both.
   The title above keeps the display face: it is one line, it is the subject of
   the article, and it is the one place the book face belongs. */
.abtl{line-height:1.55;color:var(--tx);word-break:break-word;margin-top:10px}
/* ---- a section heading that folds ---------------------------------------
   Every section of the article is one of these: a marker, the name, one rule
   across, and -- where the section's content is a chapter elsewhere -- a way
   through on the right. The name is NOT repeated in a row underneath; that
   was two rows saying one thing. The shape is the one the owner drew
   (「概要▼」) and the one a mobile encyclopedia article has.
   Two buttons side by side rather than one inside another: a button cannot
   contain a button, and the fold and the way through are two different acts.
   Sides zeroed one at a time with the bottom left as a rule -- `border:0`
   would be four sides, which is a box. */
.abshd{display:flex;align-items:center;width:100%;margin:22px 0 0;
       border-bottom:1px solid var(--line)}
.abshf{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-height:44px;
       padding:8px 2px;background:none;border:0;text-align:left;
       font-family:var(--face-ui);font-size:1.22rem;font-weight:600;line-height:1.35;
       color:var(--tx)}
.abshl{flex:1 1 auto;font-size:1.22rem;line-height:1.35}
.abmk{flex:0 0 auto;color:var(--txm)}
/* The same heading with nothing to fold: one height with the button one,
   which is what keeps two neighbouring headings the same row. */
.abshp{font-family:var(--face-ui);font-size:1.22rem;font-weight:600;line-height:1.35;
       color:var(--tx)}
/* The second question is asked OF the row above it, so it is set in from the
   left and quieter. Eight rows all reading 「DL可」 down a flat list said
   nothing about which section each belonged to. */
/* A row of the overview being written: its name over what it says, the way
   the article shows them, with the two arrows and the way to take the row
   out beside them. */
/* A row of the overview: the name on a line with the way to take the row
   out, and under it what it says. No box and no corner -- 「角丸はゴミ」 --
   and no label over either field: a rule under each is what a field is here
   （「基本下線だけ」）. */
.ovrow{padding:0 0 6px}
.ovtop{display:flex;align-items:center;gap:6px;width:100%}
.ovk{flex:1 1 auto;min-width:0}
.ovx{flex:0 0 auto;width:44px;height:44px;display:flex;align-items:center;
     justify-content:center;background:none;border:0;color:var(--txm)}
.ovrow.lift{opacity:.9}
.ovlist.moving{touch-action:none}
/* The letters, in an article rather than in the alphabet: smaller, denser,
   and with neither the speaker nor the reading under them --
   「文字は音なくていいからもっと小さく並べて」. The corner on the tile itself
   stays; that one is the owner's and is the only rounding kept. */
.abtlt{grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;margin-top:12px}
.abtlt .ltc{min-height:58px;padding:6px 2px 5px;gap:3px}
.abtlt .ltcf{height:26px}
.abtlt .ltc canvas.tc{width:26px;height:26px}
.abtlt .ltcn{font-size:.72rem}
.abtlt .ltcr{display:none}
/* What this language is for: five rows, not five panels. One line for the
   name and one under it for what it means -- the same stacking the article's
   facts use, and no box around either. */
.abshd.shut .abmk{transform:rotate(-90deg)}
.abshg{flex:0 0 auto;min-width:44px;min-height:44px;display:flex;align-items:center;
       justify-content:center;background:none;border:0;color:var(--txm)}
/* ---- a fact of the overview --------------------------------------------
   The name on one line and the answer on the next, never side by side:
   「話してる場所　あああ みたいにやるのやめて」 OWNER 2026-08-25. Two columns
   made a settings row of a fact and put a hard left edge down the page. */
.abfx{padding:4px 0 2px}
.abfd{padding:8px 0}
.abfk{color:var(--txm);font-size:.85rem;line-height:1.4}
.abfv{color:var(--tx);font-size:1rem;line-height:1.5;word-break:break-word;margin-top:2px}
/* One answered stage per line, so a list of them is a list and not a
   paragraph that happens to have gaps in it. */
.abtline{margin-top:6px}
.mecard .pbio{margin-top:4px;line-height:1.45;word-break:break-word;
              display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
              overflow:hidden}
/* Who follows whom, inside the block about the person rather than in a strip
   of its own under it. */
.pfstats{display:flex;align-items:center;gap:20px}
.pfst{min-height:44px;padding:0;background:none;border:0;font-family:inherit;
      font-size:.86rem;color:var(--txm);white-space:nowrap;
      display:inline-flex;align-items:center;gap:5px}
.pfst b{color:var(--tx);font-weight:700;font-size:.92rem}
.pfst:active{color:var(--gold)}
/* And the rule under the three tabs runs the whole way, which is what every
   timeline does and what it could not do while the body's padding held it in
   24px short at each end. */
.pftabs{display:flex;margin:0 -24px;border-bottom:1px solid var(--line)}
.pftab{flex:1;min-height:46px;background:none;border:0;border-bottom:2px solid transparent;
       font-family:inherit;font-size:.9rem;font-weight:600;color:var(--txm);padding:12px 4px}
.pftab.on{color:var(--tx);border-bottom-color:var(--gold)}

.ppin{display:inline-flex;align-items:center;color:var(--gold);margin-left:2px}
.ppin svg{width:13px;height:13px}

/* ---------- a photograph on a post ----------
   Not cropped and not a fixed height: what was taken is what is shown, inside
   the width of the post. A tall photograph is tall. */
/* Capped, and CONTAINED rather than cropped. A portrait photograph is three
   screens tall at full width, and cropping it to fit would take a piece of
   somebody's picture away with nowhere to go and see it. Letterboxed, the
   whole photograph is there and the row stays a row. */
/* The pictures on a post. One fills the row; several are a strip that slides
   sideways, and it is the strip that scrolls, not the post.
   「画像だけ横スライドできる感じ」 */
/* ---------- which keyboard, and which one is on the phone ----------
   A row of up to three, and the tick is on the one that is APPLIED rather
   than the one you are looking at. They are different questions -- editing
   does not change what is under somebody's thumb in Messages -- and this row
   is where a person finds that out. */
/* The chapter is a list: one keyboard is a row, and pressing it opens that
   keyboard's own page. It was a row of tabs above the editor, so the thing
   being chosen and the thing being changed were on the same screen and
   neither had room. 「キーボード一覧→編集の形のほうがいい」 */
/* Held, the way a phone's home screen is held: every key wobbling with a ⊖ on
   its corner. The wobble is what says the keyboard is in a state it can be
   left, and Done in the bar is how it is left. */
@keyframes kbwob{0%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}100%{transform:rotate(-.7deg)}}
.kbk.wob{animation:kbwob .28s linear infinite}
.kbk.wob:nth-child(2n){animation-delay:.09s}
.kbk.wob:nth-child(3n){animation-delay:.05s}
/* There is no mark on a held key any more. It was a ⊖ on the corner, the way
   a home screen marks an icon, and it was one of two ways to take a key away
   -- the other being the key's own page, which is still there. What takes
   things away on a sheet is the edge: the row's number and the column's
   letter. 「マイナスボタンもなくそう」 */
.navdone{font-family:inherit;font-size:.9rem;color:var(--gold);padding:0 6px}
@media (prefers-reduced-motion:reduce){.kbk.wob{animation:none}}
/* Three widths to put on the keyboard: press one, then press where it goes.
   The tile IS the width -- a row of the numbers 1 2 3 says how wide in a unit
   nobody has been told. */
/* Three widths to put on the keyboard, drawn as the KEYS they make: a tile is
   one cell of the sheet, or two, or three, at the sheet's own cell and the
   sheet's own height. It used to be a fixed 22/48/74 pill with a grey bar in
   it, which is a picture of a width rather than the width.
   「1マスとキーボードの1マスのサイズが一緒じゃないから分かりにくいよ」
   kbNewHTML() gives each its width in calc() over --kbw, because how many
   columns the sheet has is the layout's answer and changes with it. */
/* The three widths, ACROSS the sheet rather than piled at its left corner --
   they are the size of the cells they make and were sitting shoulder to
   shoulder with 4 between them, which reads as one lump rather than three
   things. 「つまりすぎだから幅いっぱいに使ってすきまあっちいから」 */
/* A width being carried onto the sheet: the tile stays where it is -- a
   palette does not empty when you take from it -- and this is what follows
   the finger. It is under the finger rather than beside it, because that is
   where the thing being carried is. */
.kbghost{position:fixed;height:44px;margin:-22px 0 0 0;transform:translateX(-50%);
         background:var(--gold);opacity:.45;
         pointer-events:none;z-index:60}
/* and the cell it would land on says so */
.kbk.drop{border-color:var(--gold);background:var(--goldsf)}
/* The keyboard's name, at the head of its own page: a line, like every other
   field. */
.kbnm{font-size:1.05rem;margin-bottom:14px}
.kblist{display:flex;flex-direction:column;margin-top:4px}
/* Under .kblist, because a row of the LIST and a row of the KEYBOARD are two
   different things wearing one class name, and this rule comes later in the
   file. Unscoped, every row of every keyboard drawn anywhere in the app was
   64 tall with a line under it and 10 of padding -- the free plan's board,
   the editor's, the one on this list. Nothing threw and nothing looked
   broken; the keyboard was simply a keyboard with rules ruled across it.

   Renaming one of the two is the other fix and is a bigger one: .kbrow is
   what kbHTML() writes for every row and what kbDragTo() moves keys between.
   Scoping the newer of the two is the whole of what was wrong. */
.kblist .kbrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;
       padding:10px 2px;border:0;border-bottom:1px solid var(--line);
       background:none;color:var(--tx);font-family:inherit;text-align:left}
.kbrowk{flex:0 0 96px;width:96px}
.kbrown{flex:1 1 auto;min-width:0;font-size:.95rem;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
.kblist .kbrow .kbon{flex:0 0 auto}
.kblist .kbrow svg.go{flex:0 0 auto;color:var(--txm)}
.kbadd{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;
       padding:10px 2px;border:0;background:none;color:var(--gold);
       font-family:inherit;font-size:.92rem;text-align:left}
/* The keyboard itself, shrunk: the real keys with the real letters on them,
   so what is being chosen between is what will be typed on. The glyphs are
   canvases and scale down with the box; `overflow:hidden` on the key is what
   stops a wide letter from spilling into its neighbour at this size. */
/* Every preview is the same box. The rows divide its height rather than each
   being a fixed number of pixels tall, so a keyboard of three rows and one of
   seven are the same rectangle -- a list where the pictures are different
   sizes is a list you read as ragged rather than as three keyboards. */
.kbshot2{display:flex;flex-direction:column;gap:1.5px;width:100%;height:46px}
/* The same keyboard on the article, at a size somebody can look at rather
   than pick out of a list. No corner and no border: it is the keys that are
   drawn, and the block around them is nothing. */
/* The mark on a section anybody may take away. Beside the heading, where the
   way through sits on the sections that have one -- not a badge and not a
   panel: the arrow, in the muted colour every mark on this page is. */
.abdlm{flex:0 0 auto;display:flex;align-items:center;color:var(--txm)}
.abkb{width:100%;margin-top:6px}
.abkb .kbshot2{height:132px;gap:3px}
.abkb .kbsr{gap:3px}
.abkb .kbsk .kbl{font-size:9px}
.kbsr{display:flex;gap:1.5px;flex:1;min-height:0}
.kbsk{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
      border-radius:2px;background:var(--sf);overflow:hidden}
.kbsk.fn{background:var(--line)}
.kbsk.gap{background:none}
.kbsk canvas{width:100%;height:100%;object-fit:contain}
.kbsk .kbl{font-size:5px;line-height:1;color:var(--txm)}
.kbsk .bch{font-size:6px;line-height:1}
.kbsk svg{width:6px;height:6px}
.kbsk .kbrm,.kbsk .kbf{display:none}
/* The picture at the top of the plans screen: the keyboard this phone
   actually has, wearing the letters this person actually drew.
   「絵なんでもいいよ 君のキーボードとか載せる？」 -- OWNER DECISION,
   2026-08-23.

   It is kbShotHTML(), the same one the keyboard list is drawn with, and not a
   second function that draws a keyboard -- a second one is a second keyboard
   to keep in step, and this file already carries the argument. What is added
   here is ROOM: the list's thumbnail is 46px because it sits on a row beside
   a name, and here the picture is the point.

   No corner is set. A key keeps the 2px it has, which is nearly square at
   this size, because a bigger radius would be a new pair in
   tools/box-baseline.txt and that file is the owner's. */
.plkb{margin:2px 24px 22px}
.plkb .kbshot2{height:112px;gap:3px}
.plkb .kbsr{gap:3px}
.plkb .kbsk .kbl{font-size:12px;line-height:1}
.plkb .kbsk .bch{font-size:15px;line-height:1}
.plkb .kbsk svg{width:15px;height:15px}
.kbon{display:inline-flex;color:var(--gold)}
.kbon svg{width:14px;height:14px}
/* ---------- choosing what shape a keyboard is ----------
   Two to a row, each drawing its own layout. The card is the picture and the
   name is a caption under it -- the other way round is a list with a
   decoration, which is what this screen was. */
.kbpats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kbpat{display:flex;flex-direction:column;gap:8px;padding:12px 10px 10px;
       min-height:44px;border-radius:16px;border:1px solid var(--line);
       background:var(--sf);font-family:inherit;justify-content:space-between}
.kbpat:active{border-color:var(--goldln);background:var(--goldsf)}
.kbpn{font-size:.86rem;color:var(--tx);text-align:left;margin-top:auto}
.kbmini{display:flex;flex-direction:column;gap:3px;width:100%}
.kbmr{display:flex;gap:3px;height:13px}
.kbmk{flex:1;border-radius:3px;background:var(--tx);opacity:.22}
.kbmk.fn{opacity:.10}
/* A key that carries a flick has more than one letter on it, and one dot is
   all that reads at thirteen pixels. Four marks round the edge was tried and
   is what the first version of this card had: at this size they meet in the
   middle and the key comes out looking like a bracket. */
.kbmk.fl{opacity:.30;
         background:radial-gradient(circle at 50% 50%, var(--bg) 20%, transparent 21%),
                    var(--tx)}
.kbapply{margin-top:14px}
/* A key being carried, and the keyboard it is being carried around. The same
   two classes the alphabet uses, said again here because the elements are
   different -- `.ltc.lift` cannot reach a `.kbk`. */
.kb.moving{touch-action:none}
.kbk.lift{position:relative;z-index:3;border-color:var(--gold);box-shadow:var(--shadow)}
/* ---------- a photograph in the timeline ----------
   One box, the same for every photograph on every post, filled.
   「xと同じって言ってるやんずっと」

   Three shapes were possible and only one of them is X's. A box that every
   picture fits INSIDE leaves the box showing around anything that is not
   square, which is a wide photograph presented as a square one. No box at all
   -- one height, width from the picture's own shape -- keeps every pixel and
   makes every photograph a different size on the screen. The third is this:
   the box is the same, the picture fills it, and what does not fit is off the
   edges. The picture is never stretched and never squeezed; it is the same
   picture, and you are looking at the middle of it. Tapping it opens the whole
   thing, which is where the edges are.

   A third of the screen's width, square. 「何があっても画面の33パーに収めたい」
   `--picpct` is the one number, and it is a plain 33 rather than `33vw` so
   that tools/press.mjs can read the same number this does. A size written
   twice is a size that will disagree with itself.

   What was here before, and each was its own bug: `width:100%`, which blew a
   900-pixel photograph up to the 1000 pixels of a phone column and is what
   "the quality dropped" looks like; `max-height:60vh`, which let one post fill
   a phone; and a strip where only the several-photograph case had a box, so
   one picture and four were two different rules. */
:root{--picpct:33}
/* One row, always, whether there is one photograph or four. `align-items` has
   to be said even with the box fixed: a flex row stretches its items by
   default, and an <img> pulled to a height it did not ask for is a photograph
   squashed sideways -- which looks like a photograph, which is why the check
   measures the box rather than trusting the rule above it. */
.ppics{margin-top:8px;display:flex;gap:8px;align-items:flex-start;
       overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.ppics::-webkit-scrollbar{display:none}
.ppic{flex:0 0 auto;display:block;
      width:calc(var(--picpct) * 1vw);height:calc(var(--picpct) * 1vw);
      object-fit:cover;
      margin:0;border-radius:14px;border:1px solid var(--glassrim)}
/* ---------- and the whole of it ----------
   Opened from the timeline, on its own screen, as big as the phone will show
   it and not one pixel bigger. `contain` here is doing what it is for: the box
   is the screen and the picture is inside it, whole. */
.pview{display:flex;align-items:center;justify-content:center;
       min-height:70vh;margin:0 -24px}
.pvimg{display:block;max-width:100%;max-height:80vh;width:auto;height:auto;
       object-fit:contain}
/* ---------- letters placed on the photograph ----------
   The picture is the screen and everything else floats on it, which is what
   putting a sticker on a photograph looks like on a phone. As a page -- the
   picture in a box, a row of controls under it, a grid of letters under that
   -- it read as a settings screen about a photograph.
   「インスタみたいにしろよ なんでそんなパソコンと同じような配置なんや」

   Over the tab bar, deliberately: this screen is one thing and there is
   nowhere else to be while it is open. z-index 60 against the bar's 25.

   The stage is the PICTURE's box, not the phone's. A letter is placed as a
   fraction of the picture and those fractions have to mean the same here and
   in the bake at 900px, so the stage shrink-wraps the image. */
.mkfull{position:fixed;inset:0;z-index:60;background:#000;
        display:flex;align-items:center;justify-content:center;
        -webkit-user-select:none;user-select:none}
.mkstage{position:relative;line-height:0;touch-action:none}
/* The picture does NOT get out of the keyboard's way, and that is on purpose:
   subtracting the keyboard from its height leaves a postage stamp in the
   middle of a black screen, and it is the picture somebody is working on. It
   stays where it is and the keyboard covers its foot, which is what every
   phone's own photo editor does. The controls are what moves -- the colours
   and the size, below. */
.mkpic{display:block;max-width:100vw;
       max-height:calc(100dvh - 190px);width:auto;height:auto}
.mkc{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mkc.on{outline:1px dashed rgba(255,255,255,.7);outline-offset:3px}
/* The row across the top of the picture: the way out, the two tools, and
   done. Round buttons, because that is what every phone puts over a
   photograph -- a pill with a word in it belongs under one, on a settings
   screen. */
.mkbar{position:absolute;top:calc(env(safe-area-inset-top,0) + 8px);left:10px;right:10px;
       display:flex;align-items:center;gap:8px}
.mkr{width:44px;height:44px;flex:none;padding:0;border:0;border-radius:50%;
     background:rgba(0,0,0,.45);color:#fff;
     display:inline-flex;align-items:center;justify-content:center}
.mkr.on{background:rgba(255,255,255,.94);color:#111}
.mkr svg{width:19px;height:19px}
.mkdone{margin-left:auto;min-width:44px;min-height:44px;padding:0 16px;border:0;
        border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-family:inherit;
        font-size:.95rem;font-weight:600;
        display:inline-flex;align-items:center;justify-content:center}
/* The letter's colour, along the foot above the alphabet, where a phone puts
   a colour picker. */
.mkcols{position:absolute;left:0;right:0;
        bottom:calc(env(safe-area-inset-bottom,0) + 12px + var(--kb));
        display:flex;align-items:center;gap:6px;padding:0 12px;
        overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mkcols::-webkit-scrollbar{display:none}
.mkcol{flex:none;width:44px;height:44px;padding:0;border:0;background:none;color:#fff;
       display:inline-flex;align-items:center;justify-content:center}
/* The eight a letter on a photograph may be, and the only place they are
   written. White and black first: those are what a caption on a photograph
   has always been, and one of the two works on almost any picture. They do
   not follow the theme -- a letter drawn into a JPEG keeps its colour on
   somebody else's phone whatever their theme is. */
/* How much of the screen the phone's keyboard is covering. vpKbWire() in
   shell.js writes it; anything pinned to the bottom of the screen adds it. */
:root{--kb:0px}
:root{--mk0:#ffffff;--mk1:#000000;--mk2:#e5484d;--mk3:#f5a524;
      --mk4:#30a46c;--mk5:#3b82f6;--mk6:#a855f7;--mk7:#c9a86a}
.mksw{width:26px;height:26px;border-radius:50%;
      box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.mksw.c0{background:var(--mk0)} .mksw.c1{background:var(--mk1)}
.mksw.c2{background:var(--mk2)} .mksw.c3{background:var(--mk3)}
.mksw.c4{background:var(--mk4)} .mksw.c5{background:var(--mk5)}
.mksw.c6{background:var(--mk6)} .mksw.c7{background:var(--mk7)}
.mkcol.on .mksw{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), 0 0 0 3px #fff}
.mkcol svg{width:17px;height:17px}
/* The size, down the left edge. A range input is horizontal and there is no
   way to say otherwise that every webview this has to run in agrees about, so
   it is a horizontal one turned on its side -- which is what the width being
   the height means. */
.mkslide{position:absolute;left:0;top:calc(50% - var(--kb) / 2);
         width:44px;height:200px;
         transform:translateY(-50%);display:flex;align-items:center;
         justify-content:center}
/* 180 long and 44 across, and then turned -- so the thing a thumb has to hit
   is 44 wide on the screen. Without the height it is the track's three pixels,
   which press-check measures and refuses, and rightly. */
.mkrng{width:180px;height:44px;transform:rotate(-90deg);background:none;
       -webkit-appearance:none;appearance:none}
.mkrng::-webkit-slider-runnable-track{height:3px;border-radius:3px;
       background:rgba(255,255,255,.45)}
.mkrng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
       width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-10px}
/* What can be done to the one that is selected, at the right, clear of the
   thumb that is dragging it. */
.mktools{position:absolute;right:12px;top:50%;transform:translateY(-50%);
         display:flex;flex-direction:column;gap:10px}
.mkt{min-width:44px;min-height:44px;padding:0 12px;border:0;border-radius:999px;
     background:rgba(0,0,0,.42);color:#fff;font-family:inherit;font-size:.82rem;
     display:inline-flex;align-items:center;gap:7px}
/* The field the line is typed into, and it IS the line: it sits on the
   picture, in the letters and the colour the line will be in, at the size it
   will be. There was a grey box at the foot of the screen as well, which said
   the same thing twice and only one of the two looked like the answer.

   No background and no border: the dotted outline is the only frame, and it
   is the same outline a mark that is not being typed into wears.

   44 in both directions even when the line is one small letter -- the frame
   is what a thumb presses to get back into a line, and a 40x16 target on a
   photograph is one somebody has to aim at. The text of a one-line input is
   centred in its box, so the line still sits where its canvas drew it. */
/* A textarea now, and centred: a line on a photograph wraps inside the
   picture rather than leaving it 「インスタと同じようにやって」 OWNER
   2026-08-28. `pwMarkFit()` gives it the width the canvas wraps at and the
   height what is in it comes to, so it never scrolls -- which is why the
   overflow is hidden and the corner is not draggable. */
.mktx{position:absolute;transform:translate(-50%,-50%);
      min-width:44px;min-height:44px;
      background:var(--mkplate);border:0;padding:0;outline:1px dashed rgba(255,255,255,.7);
      outline-offset:3px;line-height:1.25;font-family:inherit;text-align:center;
      resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:break-word;
      -webkit-appearance:none;appearance:none}
.mktx::placeholder{color:rgba(255,255,255,.5)}
.mktx:focus{outline:1px dashed rgba(255,255,255,.9)}
/* The eight again, on the field the line is typed into, so what is being
   typed is the colour it is about to be on the picture. One class per colour rather than a style
   attribute: a colour in the markup is what act-check refuses. */
.mkink.c0{color:var(--mk0)} .mkink.c1{color:var(--mk1)}
.mkink.c2{color:var(--mk2)} .mkink.c3{color:var(--mk3)}
.mkink.c4{color:var(--mk4)} .mkink.c5{color:var(--mk5)}
.mkink.c6{color:var(--mk6)} .mkink.c7{color:var(--mk7)}

/* The crop. Everything outside it goes dark, which is one enormous shadow
   rather than four rectangles to keep in step with the box. The corners are
   drawn, not pressed: pwCutHit() decides what the finger has, because a
   finger that leaves a small box mid-drag would be dropped by a listener on
   that box. */
.mkstage.cut .mkc{opacity:.45}
.mkcut{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);
       outline:1px solid rgba(255,255,255,.9);pointer-events:none}
.mkh{position:absolute;width:22px;height:22px;border:3px solid #fff}
.mkh.tl{left:-3px;top:-3px;border-right:0;border-bottom:0}
.mkh.tr{right:-3px;top:-3px;border-left:0;border-bottom:0}
.mkh.bl{left:-3px;bottom:-3px;border-right:0;border-top:0}
.mkh.br{right:-3px;bottom:-3px;border-left:0;border-top:0}
/* A photograph on the composer: the picture, a red minus hung over its corner,
   and a plus beside it.

   It was three buttons in a row -- Change photo, Letters, Remove photo -- and
   `.btn` is flex:1 with word-break:break-word, which is right for two buttons
   filling a sheet and is what turned the third into "Rem / ove / phot / o" on
   a phone. 「下の文字終わってるだろw」 There is no button now: the picture is
   what you press. */
/* The pictures slide sideways and the plus stands beside them, centred
   against their height. 「画像だけ横スライドできる感じ」「+が真ん中に来ると最高」

   The plus is OUTSIDE the strip: inside it, four pictures push it off the
   edge and adding a fifth means scrolling to a button that is not there.
   `align-items:center` on the row is the whole of the centring.

   One picture fills the row, because one picture is what most posts have and
   a thumbnail of it would be a downgrade. Several become a strip of equal
   boxes -- a row of mixed heights is what a page of pasted images looks
   like, not what a phone shows. */
/* The pictures, and under them the row that adds things. A column, not a row:
   there are three buttons now rather than one plus, and a strip of four
   photographs beside three buttons leaves neither of them room. */
.pwpics{display:block;margin-top:10px}
.pwstrip{flex:1 1 auto;min-width:0;display:flex;gap:8px;padding:11px 0;
         overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pwstrip::-webkit-scrollbar{display:none}
.pwpicw{position:relative;flex:0 0 auto;width:100%;display:block}
.pwstrip.many .pwpicw{width:150px}
.pwstrip.many .pwpic{height:190px;min-height:0;object-fit:cover}
.pwpicb{display:block;width:100%;padding:0;border:0;background:none}
/* A floor under the picture, because the picture is the button now: a photo
   one pixel tall would otherwise be a two-pixel target, and object-fit letter-
   boxes a small one rather than stretching it. */
.pwpic{display:block;width:100%;min-height:120px;max-height:40vh;height:auto;
       object-fit:contain;background:var(--sink);border-radius:14px;
       border:1px solid var(--glassrim)}
/* The hit area is 44 and the red circle inside it is 26. Inside the picture's
   corner rather than hung over it: the strip scrolls, and anything sticking
   out of a scrolling box is cut off by it -- which took the minus off every
   picture but the first. */
.pwpicx{position:absolute;top:0;right:0;width:44px;height:44px;padding:0;
        border:0;background:none;display:inline-flex;align-items:center;
        justify-content:center}
.pwpicx::before{content:'';position:absolute;width:26px;height:26px;border-radius:50%;
        background:var(--bad);box-shadow:0 1px 4px var(--glassdrop)}
.pwpicx svg{position:relative;width:15px;height:15px;color:#fff}
/* How many letters are on it, so the picture says it has some without being
   opened. */
.pwpicn{position:absolute;left:8px;bottom:8px;min-width:22px;height:22px;padding:0 6px;
        border-radius:11px;background:rgba(0,0,0,.55);color:#fff;font-size:.74rem;
        display:inline-flex;align-items:center;justify-content:center}
/* With nothing in it the strip is 22px of nothing above the buttons. */
.pwstrip:empty{padding:0}
/* What a post can be given: the camera, the pictures already on the phone,
   and the microphone. One plus stood for all three and only ever meant the
   second. 「photoボタンやめて。📷 ライブラリ マイクボタンにして」 */
/* The camera, the library and the microphone. They were 12px-cornered outlined
   squares -- three little boxes in a row under the line you are writing, which
   is the shape the owner named 「文字書いて四角で囲ったみたいなボタン全部やめて
   くれ」 and the one this file's rule 18 exists to stop growing back.
   The mark is the button now, the way `.pmore` and `.pact` already are on
   every post.

   46 across and not 44 is KEPT, and the reason it gives has changed: it was
   "a 44 square with a 1px border gives a 42 target" and there is no border
   any more, so 46 is now simply 46 -- comfortably over the 44 press measures
   and worth nothing to shrink. */
.pwab{flex:0 0 auto;position:relative;min-width:46px;height:46px;padding:0;
      border:0;background:none;
      color:var(--txs);overflow:hidden;font-family:inherit;font-size:.88rem;
      display:inline-flex;align-items:center;justify-content:center;gap:7px}
.pwab input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
/* How many drafts there are, beside the mark. A count is a state, not a
   sentence about the app, so it may sit in a row of marks -- and it is what
   the words used to carry before the drafts control became a mark like the
   camera and the microphone beside it.
   「下書きマーク作ったのにないけど？文字で書けなんか言ってねえよ」2026-08-26.
   `.pwab.wide` -- the rule that made a button as wide as the words on it --
   went with them: nothing wears it now. */
.pwabn{font-size:.78rem;font-weight:600;color:var(--txs)}
/* The drafts control is drawn only when it has something to say -- nothing
   typed means no draft to save, and none saved means nowhere to go back to.
   Collapsing when empty is what stops the row's gap being spent on it. */
.pwside{display:flex;flex:0 0 auto}
.pwside:empty{display:none}
.pwab:active{border-color:var(--goldln);color:var(--gold)}
/* Recording. The dot is the one place in this app where something blinks, and
   it is the one place where something is happening that cannot be seen. */
.pwab.rec{padding:0 14px;border-color:var(--bad);color:var(--bad)}
.vodot{width:9px;height:9px;border-radius:50%;background:var(--bad);
       animation:vopulse 1s ease-in-out infinite}
@keyframes vopulse{0%,100%{opacity:1}50%{opacity:.25}}
.vot{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pwvo{display:inline-flex;align-items:center;gap:6px}
.pwvox{position:relative;width:44px;height:44px;flex:0 0 auto;padding:0;border:0;
       background:none;color:var(--txs);
       display:inline-flex;align-items:center;justify-content:center}
.pwvox:active{color:var(--bad)}
/* And on a post: a pill under the line, because a voice is a thing to press
   and not a thing to read. */
.povo{min-height:44px;margin:8px 0 0;padding:0 14px;border-radius:999px;
      border:1px solid var(--line);background:none;color:var(--tx);
      font-family:inherit;font-size:.88rem;
      display:inline-flex;align-items:center;gap:8px}
.povo.on{border-color:var(--goldln);color:var(--gold)}
/* A notice: what happened, who did it, and which post it was about. */
/* A NOTICE, IN THE SHAPE THE OWNER SENT. 「見た目はこれに合わせて。文字の位置
   違うやん」 OWNER 2026-09-01, with a picture of Instagram's.

   Left to right: the mark, the faces, the sentence with the time inside it,
   and the post's photograph on the right. Full width like a post -- the same
   `margin:0 -24px` -- so the row is not indented past the ones above it.

   `align-items:center`, not `flex-start`: the faces and the photograph are
   both 40-44 tall and the sentence is one or two lines, so hanging everything
   from the top left the short rows looking broken.

   ONE HEIGHT. CLAUDE.md: rows in one list are one height, and these were 132
   on a 402 and 210 on a 320 -- the sentence had 46px of width left on the
   small phone and wrapped to six lines. What fixed it is not this rule but
   the two below: two faces instead of three, overlapped, and the time moved
   off the end of the row into the sentence.

   93 is the tallest a row can be and is therefore the floor for all of them:
   two lines of the sentence (`.ntfw` reserves them whether or not they are
   used), the post's own line under it, and this padding. Measured on both of
   the owner's phones -- 402x874 and 320x568 -- and the five faces of the
   notices come out 93 on each. A FOLLOW is the one with no post line, so
   without the floor it sat 5px short of the four around it. */
.ntf{display:flex;align-items:center;gap:10px;margin:0 -24px;padding:12px 16px;
     min-height:93px;border-bottom:1px solid var(--line)}
.ntfi{flex:0 0 auto;width:26px;display:inline-flex;justify-content:center;color:var(--txm)}
.ntfi.like{color:var(--bad)} .ntfi.follow{color:var(--gold)}
/* Up to three faces, side by side. More than one person did the same thing to
   the same post, and the row says so with their faces the way the owner's
   picture does. */
/* Two circles, overlapping, the way the picture has them. They were three in
   a row with a gap, which is 128px of a 320 screen spent on faces -- and it
   was what left the sentence 46px to wrap in. The ring is a shadow rather
   than a border so the two read apart where they overlap; rule 18 counts
   `border` and `border-radius`, and this adds neither. `.pav` has been a
   circle since it was written. */
.ntffs{flex:0 0 auto;display:flex;align-items:center}
.ntffs .pav + .pav{margin-left:-14px}
.ntffs .pav{box-shadow:0 0 0 2px var(--bg)}
.ntfb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
/* Which post, without reading the row. No corner and no border -- rule 18 --
   so it is the photograph itself, cut to a square. */
.ntfpic{flex:0 0 auto;width:44px;height:44px;overflow:hidden}
.ntfpic img{width:100%;height:100%;object-fit:cover;display:block}
/* Two lines at most, and the heads of them line up because the whole block
   is one column. A notice that ran to six lines pushed the rows either side
   of it out of step. */
.ntfw{color:var(--tx);font-size:.95rem;line-height:1.4;
      display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
      overflow:hidden;min-height:2.8em}
/* The time, inside the sentence rather than off the end of the row.
   「Tommy_hirorin and チーデリ liked your post · 1週間」 */
.ntfwh{color:var(--txm)}
.ntfp{color:var(--txm);font-size:.88rem;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* A post kept to yourself, beside the time. */
.ppv{display:inline-flex;align-items:center;color:var(--txm)}
/* The button that sends, while what it sends is private. */
.navdo.pv{display:inline-flex;align-items:center;gap:6px;
          background:var(--sf);color:var(--tx)}
/* Saving a draft, and the ones already saved, at the foot of the composer. */
.dfrow{display:flex;align-items:center;gap:6px;
       border-bottom:1px solid var(--line)}
.dfb{flex:1 1 auto;min-width:0;min-height:48px;display:flex;align-items:center;gap:10px;
     padding:0 2px;border:0;background:none;color:var(--tx);
     font-family:inherit;text-align:left}
.dfl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfw{flex:0 0 auto;font-size:.82rem;color:var(--txm)}
.dfx{flex:0 0 auto;width:44px;height:44px;padding:0;border:0;background:none;
     color:var(--txs);display:inline-flex;align-items:center;justify-content:center}
.dfx:active{color:var(--bad)}
/* A post that was put right says so, beside the time. */
.ped{color:var(--txs);font-size:.8rem}
/* Beside it, and the one mark in this row that is not grey. Same size and same
   line as "edited", because it is the same kind of thing: what state the post
   is in, in as few words as the state can be said in. */
.pdown{color:var(--bad);font-size:.8rem}
/* A post that is not there any more, in a conversation that is. It sits
   where the post sat and is quieter than one -- there is nothing in it to
   read, and it is not a thing to press. */
.ptomb{padding:14px 16px;color:var(--txm);font-size:.9rem;
       border-bottom:1px solid var(--line)}


/* ---------- bottom bar, sheet, toast ---------- */
/* On top of the tab bar, not under it. 「下タブを画面1番下に固定して、その上
   からボタンいくようにしてね」 */
.barfix{position:fixed;left:0;right:0;bottom:var(--tabh);z-index:20;max-width:480px;margin:0 auto;
        padding:12px 24px 12px;
        background:linear-gradient(180deg,transparent,var(--bg) 34%);display:flex;gap:10px}
/* A flex item will not shrink below its content by default, so two long
   labels side by side pushed the bar off a 320px screen in Russian. */
/* 44 across, always. A button whose whole word became a `+` is as wide as the
   `+` is, which on the narrower of two columns came to 38 points.
   「追加とかそういう日本語はなるべく消したいのよ」 */
/* THE button. There used to be two: this one, a gold pill with a corner, on
   21 places -- Save, Draft, and every other thing you press to finish
   something -- and `.btn.ghost`, the words on their own, on 20. The app was
   split down the middle. 「セーブとかドラフトみたいなボタンの角丸は直して。
   一本化して欲しい。他と同じボタンに」

   So this IS the ghost now, and `.ghost` is left below as the name the twenty
   already wear rather than as a second look. The padding stays: 44pt under a
   thumb is not a matter of taste and press measures it. */
.btn{flex:1;min-width:44px;padding:15px 12px;border:none;background:none;
     color:var(--gold);font-weight:600;font-size:.98rem;line-height:1.3;word-break:break-word}
.btn:active{opacity:.82}
.btn:disabled{opacity:.3}
/* The second kind of button, and it is not a box. It was a rectangle with a
   hairline round it and grey text inside -- 「文字書いて四角で囲ったみたいな
   ボタン全部やめてくれ。ダサすぎる」 -- which is a shape a phone stopped drawing
   about ten years ago, and there are twenty of them in this app.

   One class, so one change. What is left is the thing itself: the words, in
   the colour everything pressable is. The padding stays, because 44pt under a
   thumb is not a matter of taste and press measures it. */
.btn.ghost{background:none;border:none;color:var(--gold);font-weight:600}
.btn.ghost:active{opacity:.55}
.sbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.24s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:var(--pane);
       border-top:1px solid var(--line);border-radius:22px 22px 0 0;
       padding:8px 22px calc(env(safe-area-inset-bottom,0) + 20px);transform:translateY(101%);
       transition:.27s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow:auto}
.sheet.on{transform:none}
.sheet h3{font-size:1.05rem;margin:0 2px 6px;font-weight:700}
.field{margin-bottom:11px}

   Eight rules say it because eight kinds of field grew up in different
   chapters -- .lnin, .field, .field.at, .exadd, .mnadd, .ntbody, .search and
   the one name typed in the onboarding -- and a ninth added later has to say
   it too. What a field is NOT is decided here; a button is still a button and
   keeps its shape, because a thing you press has to look pressable. */

/* A field that WRAPS is a textarea, and an ordinary one-line field is one
   too now -- an <input> is a single row that scrolls sideways forever and

   written in, and a name or a handle is not one. Its height is what is in
   it, which lnGrow() sets. Nothing is added here -- no frame, no corner. */

             margin-bottom:0}

   あとはリンクと同じ並びにして欲しい。」 OWNER 2026-08-28: this is the row
