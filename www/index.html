<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0e">
<title>Lingua</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0e;--pane:#101017;--sf:#15151d;--sf2:#1e1e29;--line:rgba(255,255,255,.09);--tx:#ece9e3;--txs:#a9a6b3;--txm:#6f6c7a;--gold:#c9a86a;--pur:#8c7eff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
  .serif{font-family:'Cinzel',serif}.cor{font-family:'Cormorant Garamond',serif}
  #app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
  /* view transition */
  .view{animation:vin .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes vin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
  .view.back{animation:vback .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes vback{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

  /* ---------- HOME ---------- */
  .top{display:flex;align-items:center;padding:calc(env(safe-area-inset-top,0) + 16px) 24px 0}
  .brand{font-family:'Cinzel',serif;letter-spacing:.22em;font-size:.9rem;color:var(--txs)}
  .brand .st{color:var(--gold)}
  .av{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold)}
  .title{padding:30px 30px 22px;text-align:center}
  .tkick{font-size:.6rem;letter-spacing:.34em;color:var(--txm);text-transform:uppercase;margin-bottom:14px}
  .tname{font-family:'Cinzel',serif;font-weight:600;font-size:2.3rem;line-height:1.1;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
  .tname .pen{font-size:.72rem;color:var(--txm)}
  .tnative{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--pur);margin-top:6px}
  .rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0}
  .hbody{padding:6px 30px 120px}
  .clabel{font-size:.6rem;letter-spacing:.3em;color:var(--txm);text-transform:uppercase;text-align:center;margin:8px 0 6px}
  .toc{margin-top:8px}
  .trow{display:flex;align-items:baseline;gap:12px;padding:17px 2px;cursor:pointer}
  .trow:active{opacity:.6}
  .trow .rn{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1rem;width:26px;flex-shrink:0}
  .trow .rt{font-size:1.12rem;font-weight:500}
  .trow .rt.flag{color:var(--pur)}
  .trow .tag{font-size:.54rem;letter-spacing:.06em;color:var(--pur);border:1px solid rgba(140,126,255,.4);border-radius:10px;padding:1px 7px;margin-left:8px;vertical-align:middle}
  .trow .lead{flex:1;border-bottom:1px dotted rgba(255,255,255,.18);transform:translateY(-3px)}
  .trow .rv{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--txs);flex-shrink:0}
  .trow .rv.mk{color:var(--pur)}
  .recent{margin-top:26px;background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:20px 22px;cursor:pointer}
  .recent .rh{font-size:.58rem;letter-spacing:.24em;color:var(--txm);text-transform:uppercase;margin-bottom:12px}
  .recent .line{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--tx);letter-spacing:.02em}
  .recent .tr{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--txs);margin-top:4px}

  /* ---------- CHAPTER (words) ---------- */
  .chead{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 78%,transparent);padding:calc(env(safe-area-inset-top,0) + 14px) 24px 8px}
  .back{background:none;border:none;color:var(--txs);font-size:.9rem;font-family:inherit;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:5px}
  .back:active{opacity:.5}
  .chap{display:flex;align-items:baseline;gap:12px;margin-top:12px}
  .chap .rn{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.3rem}
  .chap .ct{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:600}
  .chap .cn{margin-left:auto;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--txm);font-size:1.05rem}
  .search{margin:14px 24px 4px;display:flex;align-items:center;gap:10px;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  .search input{flex:1;background:none;border:none;color:var(--tx);font-family:inherit;font-size:.9rem;outline:none}
  .search svg{color:var(--txm)}
  .lex{padding:8px 24px 130px}
  .gl{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:1.15rem;margin:20px 0 2px;opacity:.85}
  .entry{padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .entry:active{opacity:.6}
  .hwrow{display:flex;align-items:baseline;gap:10px}
  .hw{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--tx);letter-spacing:.02em}
  .rd{font-size:.72rem;color:var(--txm)}
  .pos{margin-left:auto;font-size:.6rem;color:var(--txm);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
  .mn{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.12rem;color:var(--txs);margin-top:1px}

  /* ---------- placeholder chapter ---------- */
  .soon{padding:60px 40px;text-align:center}
  .soon .big{font-family:'Cinzel',serif;font-size:1.5rem;margin-bottom:10px}
  .soon .sub{color:var(--txm);font-size:.9rem}
  .soon .badge{display:inline-block;margin-top:22px;font-size:.6rem;letter-spacing:.2em;color:var(--pur);border:1px solid rgba(140,126,255,.4);border-radius:20px;padding:6px 16px}

  /* ---------- floating buttons ---------- */
  .fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0) + 22px);z-index:20;display:flex;align-items:center;gap:8px;background:linear-gradient(120deg,var(--gold),#e6cf9a);color:#241d10;font-weight:700;font-size:.95rem;padding:14px 22px;border-radius:28px;border:none;box-shadow:0 10px 26px rgba(201,168,106,.32);cursor:pointer}
  .fab:active{transform:scale(.96)}
  .ai{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0) + 22px);z-index:20;display:flex;align-items:center;gap:8px;background:rgba(140,126,255,.14);border:1px solid rgba(140,126,255,.45);color:var(--pur);font-weight:600;font-size:.86rem;padding:11px 18px;border-radius:26px;cursor:pointer;backdrop-filter:blur(6px)}
  .ai:active{transform:scale(.96)}

  /* ---------- add sheet ---------- */
  .sbg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s}
  .sbg.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;background:#101017;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 22px calc(env(safe-area-inset-bottom,0) + 22px);transform:translateY(100%);transition:.28s cubic-bezier(.2,.8,.2,1)}
  .sheet.on{transform:none}
  .grip{width:40px;height:4px;border-radius:3px;background:rgba(255,255,255,.2);margin:6px auto 14px}
  .sheet h3{font-size:1.1rem;margin:0 2px 14px;font-weight:700}
  .field{margin-bottom:11px}
  .field label{font-size:.66rem;color:var(--txm);letter-spacing:.04em;display:block;margin-bottom:5px}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:12px 13px;font-family:inherit;font-size:.95rem;outline:none}
  .field input.hwf{font-family:'Cinzel',serif}
  .row2{display:flex;gap:10px}.row2 .field{flex:1}
  .aihint{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:11px;border:1px dashed rgba(140,126,255,.5);background:rgba(140,126,255,.07);color:var(--pur);font-family:inherit;font-size:.86rem;font-weight:600;cursor:pointer;margin:2px 0 14px}
  .aihint:active{opacity:.6}
  .add{width:100%;padding:15px;border-radius:12px;border:none;background:linear-gradient(120deg,var(--gold),#e6cf9a);color:#241d10;font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  .add:active{opacity:.85}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0) + 96px);transform:translateX(-50%) translateY(10px);background:rgba(30,30,41,.96);border:1px solid var(--line);color:var(--tx);font-size:.82rem;padding:10px 18px;border-radius:20px;z-index:60;opacity:0;pointer-events:none;transition:.25s}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .mock{position:fixed;top:0;left:50%;transform:translateX(-50%);background:rgba(140,126,255,.85);color:#100e1c;font-size:.54rem;letter-spacing:.2em;padding:3px 13px;border-radius:0 0 8px 8px;z-index:99;font-weight:700;pointer-events:none}
</style>
</head>
<body>
<div class="mock" id="mock">NOTEBOOK</div>
<div id="app"></div>

<!-- add sheet (shared) -->
<div class="sbg" id="sbg" onclick="closeS(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()">
    <div class="grip"></div>
    <h3>ことばを加える</h3>
    <div class="aihint" onclick="aiFill()">✦ AIに提案してもらう（意味だけ入れてもOK）</div>
    <div class="field"><label>コンラング語形</label><input class="hwf" id="f-hw" placeholder="Aelin" autocomplete="off"></div>
    <div class="row2">
      <div class="field"><label>意味</label><input id="f-mn" placeholder="星"></div>
      <div class="field"><label>読み（任意）</label><input id="f-rd" placeholder="エリン"></div>
    </div>
    <div class="field"><label>品詞</label><select id="f-pos"><option>名詞</option><option>動詞</option><option>形容詞</option><option>副詞</option><option>その他</option></select></div>
    <button class="add" onclick="addWord()">辞書に加える</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- state ---------------- */
let langName='Elyrra語';
let WORDS=[
  {hw:'Aelin',rd:'エリン',mn:'星',pos:'名詞'},
  {hw:'Elora',rd:'エローラ',mn:'光',pos:'名詞'},
  {hw:'Lsuna',rd:'ルーナ',mn:'月',pos:'名詞'},
  {hw:'Mirae',rd:'ミラエ',mn:'愛する',pos:'動詞'},
  {hw:'Naeth',rd:'ナイス',mn:'水',pos:'名詞'},
  {hw:'Silva',rd:'シルヴァ',mn:'森',pos:'名詞'},
  {hw:'Vaera',rd:'ヴァエラ',mn:'空',pos:'名詞'},
  {hw:'Ythe',rd:'イーゼ',mn:'風',pos:'名詞'},
];
const TOC=[
  {n:'I', t:'ことば', v:()=>WORDS.length+'', k:'words', route:'words'},
  {n:'II', t:'文字', v:()=>'つくる', flag:true, k:'文字体系', route:'soon'},
  {n:'III', t:'音', v:()=>'11', k:'音韻', route:'soon'},
  {n:'IV', t:'文法', v:()=>'3 / 6', k:'文法', route:'soon'},
  {n:'V', t:'例文', v:()=>'2', k:'例文', route:'soon'},
  {n:'VI', t:'世界', v:()=>'—', k:'世界観', route:'soon'},
];
const S={sparkle:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.7 6.1L20 10l-6.3 1.9L12 18l-1.7-6.1L4 10l6.3-1.9z"/></svg>'};
const ICON_S='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const app=document.getElementById('app');
let current='home';

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),1600);}

/* ---------------- nav ---------------- */
function go(route,dir){
  current=route;
  document.getElementById('mock').textContent = route==='home'?'NOTEBOOK':(route==='words'?'NOTEBOOK · ことば':'NOTEBOOK · '+route);
  if(route==='home') renderHome(dir);
  else if(route==='words') renderWords();
  else renderSoon(route);
  window.scrollTo(0,0);
}
function editName(){const v=prompt('言語名',langName);if(v&&v.trim()){langName=v.trim();renderHome();}}

/* ---------------- HOME ---------------- */
function renderHome(dir){
  app.innerHTML=`<div class="view ${dir==='back'?'back':''}">
  <div class="top"><div class="brand">LINGUA <span class="st">✦</span></div><div class="av">${S.sparkle}</div></div>
  <div class="title">
    <div class="tkick">Your language</div>
    <div class="tname serif" onclick="editName()">${langName} <span class="pen">✎</span></div>
    <div class="tnative">Elyrra</div>
    <div class="rule"></div>
  </div>
  <div class="hbody">
    <div class="clabel">— 目次 —</div>
    <div class="toc">
      ${TOC.map(r=>`<div class="trow" onclick="tocTap('${r.route}','${r.k}')">
        <span class="rn">${r.n}</span>
        <span class="rt ${r.flag?'flag':''}">${r.t}${r.flag?'<span class="tag">看板</span>':''}</span>
        <span class="lead"></span>
        <span class="rv ${r.flag?'mk':''}">${r.v()}</span>
      </div>`).join('')}
    </div>
    <div class="recent" onclick="toast('（例文ページは準備中）')">
      <div class="rh">最近書いた一文</div>
      <div class="line">Aelin Mirae</div>
      <div class="tr cor">「星を、愛する。」</div>
    </div>
  </div></div>
  <button class="ai" onclick="toast('（AIに聞く — 準備中）')">${S.sparkle} AIに聞く</button>`;
}
function tocTap(route,k){ if(route==='words') go('words'); else go('soon-'+k); }

/* ---------------- WORDS ---------------- */
function renderWords(){
  const sorted=[...WORDS].sort((a,b)=>a.hw.localeCompare(b.hw));
  app.innerHTML=`<div class="view">
  <div class="chead">
    <button class="back" onclick="go('home','back')">‹ 目次</button>
    <div class="chap"><span class="rn">I</span><span class="ct">ことば</span><span class="cn">${WORDS.length} words</span></div>
  </div>
  <div class="search">${ICON_S}<input placeholder="ことば・意味をさがす" oninput="filter(this.value)"></div>
  <div class="lex" id="lex">${lexHTML(sorted,true)}</div>
  </div>
  <button class="fab" onclick="openS()">＋ ことば</button>`;
}
function lexHTML(items,clickable){
  let html='',letter='';
  items.forEach(w=>{const L=w.hw[0].toUpperCase();if(L!==letter){letter=L;html+=`<div class="gl">${L}</div>`;}
    const onc=clickable?`onclick="toast('${w.hw} — 編集は次のステップ')"`:'';
    html+=`<div class="entry" ${onc}><div class="hwrow"><span class="hw">${w.hw}</span><span class="rd">${w.rd||''}</span><span class="pos">${w.pos}</span></div><div class="mn">${w.mn}</div></div>`;});
  return html;
}
function filter(q){q=q.trim().toLowerCase();const lex=document.getElementById('lex');
  const items=WORDS.filter(w=>!q||w.hw.toLowerCase().includes(q)||w.mn.includes(q)).sort((a,b)=>a.hw.localeCompare(b.hw));
  lex.innerHTML=lexHTML(items,true)||'<div style="color:var(--txm);text-align:center;padding:30px">見つかりません</div>';
}

/* ---------------- SOON ---------------- */
function renderSoon(route){
  const name=route.replace('soon-','');
  app.innerHTML=`<div class="view">
  <div class="chead"><button class="back" onclick="go('home','back')">‹ 目次</button></div>
  <div class="soon">
    <div class="big">${name}</div>
    <div class="sub">この章はこれから作ります。<br>「ことば」と同じ"章を開く"型で、<br>${name}に合った画面にします。</div>
    <div class="badge">NEXT — ここを一緒に設計</div>
  </div></div>`;
}

/* ---------------- add sheet ---------------- */
function openS(){document.getElementById('sbg').classList.add('on');document.getElementById('sheet').classList.add('on');}
function closeS(e){document.getElementById('sbg').classList.remove('on');document.getElementById('sheet').classList.remove('on');}
function aiFill(){
  const mn=document.getElementById('f-mn').value.trim()||'星';
  document.getElementById('f-mn').value=mn;
  const syl=['ae','li','na','sil','ve','ry','lo','en','tha','ith','mi','ra'];
  let w='';const n=2+ (mn.length%2);for(let i=0;i<n;i++)w+=syl[(mn.charCodeAt(i%mn.length)+i)%syl.length];
  document.getElementById('f-hw').value=w.charAt(0).toUpperCase()+w.slice(1);
}
function addWord(){
  const hw=document.getElementById('f-hw').value.trim(),mn=document.getElementById('f-mn').value.trim();
  if(!hw||!mn){toast('語形と意味を入れてください');return;}
  WORDS.unshift({hw:hw.charAt(0).toUpperCase()+hw.slice(1),rd:document.getElementById('f-rd').value.trim(),mn,pos:document.getElementById('f-pos').value});
  document.getElementById('f-hw').value='';document.getElementById('f-mn').value='';document.getElementById('f-rd').value='';
  closeS();
  if(current==='words')renderWords();
  toast('「'+hw+'」を辞書に加えました');
}

/* ---------------- boot ---------------- */
go('home');
</script>
</body>
</html>
