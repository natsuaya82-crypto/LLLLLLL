<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0e" id="tcolor">
<title>Lingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Theme. Dark is the default (the black-and-gold of v1). Light is the same
   skeleton printed on paper instead. Every colour lives in these two blocks
   and nowhere else; the views only ever touch the variables.
   ========================================================================= */
html[data-theme="dark"]{
  --bg:#0a0a0e; --pane:#101017; --sf:#15151d; --sf2:#1e1e29;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.05);
  --tx:#ece9e3; --txs:#a9a6b3; --txm:#6f6c7a;
  --gold:#c9a86a; --goldsf:rgba(201,168,106,.10); --goldln:rgba(201,168,106,.34);
  --bad:#d9705c;
  --pur:#8c7eff; --pursf:rgba(140,126,255,.10); --purln:rgba(140,126,255,.42);
  --onGold:#241d10; --dot:rgba(255,255,255,.42); --shadow:0 10px 26px rgba(0,0,0,.5);
  /* glass: what the tab bar is made of. --glassop is the same surface for a
     webview too old to blur, so the bar is never a transparent smear. */
  /* the two the card is built out of: a surface that sits above --bg, and
     the ground falling away behind it */
  --raise:#191922; --sink:#06060a;
  --glass:rgba(30,30,41,.58); --glassop:#1a1a24;
  --glassrim:rgba(255,255,255,.13); --glassspec:rgba(255,255,255,.22);
  --glassdrop:rgba(0,0,0,.46);
}
html[data-theme="light"]{
  --bg:#faf8f3; --pane:#ffffff; --sf:#f3efe6; --sf2:#eae5da;
  --line:rgba(26,23,18,.12); --line2:rgba(26,23,18,.06);
  --tx:#1b1814; --txs:#5c574e; --txm:#8e887c;
  --gold:#8a6a22; --goldsf:rgba(138,106,34,.07); --goldln:rgba(138,106,34,.30);
  --bad:#c9553f;
  --pur:#5546c8; --pursf:rgba(85,70,200,.07); --purln:rgba(85,70,200,.34);
  --onGold:#fffdf6; --dot:rgba(26,23,18,.46); --shadow:0 8px 22px rgba(60,50,30,.10);
  --raise:#ffffff; --sink:#efeade;
  --glass:rgba(255,255,255,.62); --glassop:#f6f2ea;
  --glassrim:rgba(26,23,18,.10); --glassspec:rgba(255,255,255,.9);
  --glassdrop:rgba(60,50,30,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,system-ui,'Noto Sans JP',sans-serif;
     line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
/* iOS treats a page as a document until told otherwise: press and hold and it
   selects a word and raises the magnifier; tap twice quickly and it takes the
   second tap for a zoom gesture and swallows it. On a screen whose whole job
   is tapping and dragging, both are faults. Selection is turned off for the
   chrome and turned back on for the two places text is genuinely read or
   written. */
body,#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],.mn,.rd,.wordmean,.sentline{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* manipulation keeps scroll and pinch but drops the double-tap-to-zoom that
   was eating every second tap. */
button,select,a,.trow,.entry,.set,.obsrow,.obchb,.obsnd,.obescb{touch-action:manipulation}
.cz{font-family:'Cinzel',Georgia,serif}
.cor{font-family:'Cormorant Garamond',Georgia,serif}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
/* A screen slides in when you arrive at it. It must NOT slide in again every
   time something on it is tapped -- but every tap redraws the whole view, so
   it did: choose a writing system and the entire screen jumped twelve pixels
   and faded back, which on a phone reads as a shudder. The animation is now
   attached to the arrival, not to the redraw: render() marks the app fresh
   only when the screen it is drawing is a different one. */
/* Opacity only, and no transform -- this is not taste, it is the fix for a
   bug that has been in the app since the animation was written. A transform
   on an element makes it the containing block for every position:fixed thing
   inside it. The bottom button bar is position:fixed and lives inside .view,
   so for the third of a second the slide was running, the bar was positioned
   against the whole page instead of against the screen: it sat wherever the
   content ended, and then snapped to the bottom of the screen when the
   animation finished. That snap is the "the button is somewhere else and then
   drops down the moment it opens" that has been reported three times. */
#app[data-fresh="1"] .view{animation:vin .26s ease-out}
@keyframes vin{from{opacity:0}to{opacity:1}}
button{font-family:inherit;cursor:pointer}

/* ---------- shared parts ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0) + 16px) 24px 0}
.brand{font-family:'Cinzel',Georgia,serif;letter-spacing:.22em;font-size:.86rem;color:var(--txs)}
.brand .st{color:var(--gold)}
.iconb{margin-left:auto;width:44px;height:44px;border-radius:0;border:0;background:none;
       color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.iconb:active{opacity:.5}
.gtile .bch{font-size:1.5rem;color:var(--gold);line-height:1}
.gtile .nol{font-size:1.2rem;color:var(--txm);line-height:1}
/* --- a word being built out of its sounds ----------------------------- */
.seqbox{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;
        border:1px solid var(--line);background:var(--pane);border-radius:12px}
.seqbox .seq{flex:1;font-size:1.5rem;letter-spacing:.02em;min-height:1.5rem;color:var(--tx)}
.seqdel{min-width:44px;min-height:44px;background:none;border:0;color:var(--txs);
        display:inline-flex;align-items:center;justify-content:center}
.seqdel:disabled{opacity:.25}
.phkeys{display:flex;flex-wrap:wrap;gap:6px}
.phk{min-width:56px;min-height:62px;border:1px solid var(--line);background:var(--sf);
     border-radius:9px;color:var(--tx);font-size:1.05rem;padding:8px 10px}
.phk:active{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
/* A key with a letter on it. The letter you drew is the face of the key --
   large, and the only thing on it that is yours -- and the sound symbol sits
   small underneath so two letters that look alike can still be told apart.
   The other way round, with the symbol large, the keyboard was a chart of the
   IPA and your own letters were a footnote on it, which is backwards for
   somebody who has just spent an hour drawing them. */
.phk.hasg{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:3px;padding:6px 8px}
canvas.pkc{width:34px;height:34px;display:block}
.phk .pkb{font-size:1.5rem;line-height:34px;height:34px;display:block;color:var(--tx)}
/* A sound with no letter yet has nothing else to show, so the symbol is the
   face of the key at full size. Once a letter exists the symbol steps back
   and becomes the small line under it. */
.phk .pks{font-size:1.05rem;color:var(--tx);line-height:1}
.phk.hasg .pks{font-size:.82rem;color:var(--txm);letter-spacing:.02em}
.phk.hasg:active .pks{color:var(--gold)}
/* --- the IPA chart ---------------------------------------------------- */
.ipascroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
.ipascroll table{width:734px}
.ipatab{border-collapse:collapse;width:100%;table-layout:fixed}
/* The row heading is the name of a manner or a height, and some of those are
   long words in some of the ten. Fixed at 44px and told not to wrap, they were
   cut off mid-word. Widening to 58px and adding word-break:break-word stopped
   the cutting and started the breaking -- "approximant" came out as approxi /
   mant, and Russian broke ten of its labels that way. English broke two, which
   is why it read as fixed.
   108px is the widest single word any of the ten has, measured rather than
   guessed: полуоткрытый at 102px plus the padding. Nothing may break inside a
   word now; the chart is wider and it was already a horizontal scroller. */
.ipatab th{font-size:.82rem;color:var(--txm);font-weight:400;text-align:left;
           padding:2px 6px 4px 0;white-space:normal;line-height:1.25;width:108px;
           word-break:normal;overflow-wrap:normal}
.ipatab td{padding:1px;vertical-align:top}
.ph2{width:100%;min-height:44px;border:1px solid var(--line);background:var(--sf);
     border-radius:8px;color:var(--txs);font-size:.95rem;padding:6px 0;margin-bottom:2px;display:block}
.ph2.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.ph2:active{opacity:.55}
.ipafree{display:flex;flex-wrap:wrap;gap:6px}
.ipafree .ph2{width:auto;min-width:48px;padding:8px 11px}
.ipamine{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px;min-height:44px}
.ipamine b{border:1px solid var(--goldln);background:var(--goldsf);color:var(--gold);
           border-radius:8px;padding:8px 12px;font-weight:400;font-size:1rem}
.ipamine .none{color:var(--txm);font-size:.88rem;align-self:center}
/* Buttons whose mark is drawn rather than typed line it up with the word. */
.back.nb,.play,.rr2,.wctl button,.pvbox button{display:inline-flex;align-items:center;gap:6px}
.back.nb svg,.play svg,.rr2 svg,.wctl button svg,.pvbox button svg{flex:0 0 auto}
.set.signin .sl{display:flex;align-items:center;gap:10px}
.set.signin .sl svg{width:18px;height:18px;flex:0 0 auto}
.back{background:none;border:none;color:var(--txs);font-size:.88rem;padding:10px 0;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.back:active{opacity:.5}
/* The back button is a bar of its own, directly under .view, so it can stick
   to the top of the screen for the whole of the scroll instead of leaving with
   the first swipe. Its parent has to be the tall element -- a sticky thing
   only sticks inside its own parent's box -- which is why it is no longer
   inside .chead. */
/* Back, and where you are, on one line: 「←目次　Ⅰ 単語」. The chapter used to
   be a second heading below this bar, which meant the name of the page you
   were on was the third thing down and the bar itself said only where you
   would go if you left. */
.navtop{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:baseline;
        gap:9px;padding:calc(env(safe-area-inset-top,0) + 8px) 24px 8px}
.navtop .back{flex:0 0 auto;margin-right:3px}
.navn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold);font-size:1.06rem}
.navt{font-family:'Cinzel',Georgia,serif;font-size:1.12rem;font-weight:600;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navc{margin-left:auto;flex:0 0 auto;font-family:'Cormorant Garamond',Georgia,serif;
      font-style:italic;color:var(--txm);font-size:.98rem}
.navtop:after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;
              background:linear-gradient(180deg,var(--bg),transparent)}
.chead{padding:0 24px 6px}
.chap{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.chap .rn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold);font-size:1.3rem}
.chap .ct{font-family:'Cinzel',Georgia,serif;font-size:1.6rem;font-weight:600}
.chap .cn{margin-left:auto;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--txm);font-size:1.02rem}
.body{padding:10px 24px calc(env(safe-area-inset-bottom,0) + 120px)}
/* ---------- a post ----------
   The row everybody's thumb already knows: face, a bold name with the handle
   and the time in grey beside it, the post, four things spread along the
   bottom, dividers running the whole width. Deliberately NOT the app's serif
   and gold -- those belong to the book side, and a feed that looks like a
   book looks like something you have to learn.

   What is inside it is this app's: three layers, and a word the dictionary
   has never heard of standing in the colour of a problem. */
.post{display:flex;gap:12px;margin:0 -24px;padding:12px 16px;
      border-bottom:1px solid var(--line)}
.pav{flex:0 0 auto;width:40px;height:40px;border-radius:50%;overflow:hidden;
     background:var(--sf);display:flex;align-items:center;justify-content:center}
.pav canvas{width:26px;height:26px}
.pav .bch{font-size:1.05rem;color:var(--txs);line-height:1}
.pbody{flex:1 1 auto;min-width:0}
.phead{display:flex;align-items:center;gap:5px;line-height:1.3}
.pname{font-weight:700;font-size:.95rem;color:var(--tx);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* What it is written in, beside who wrote it -- the place a timeline puts an
   affiliation, small and quiet, because it is not the name. */
.plangtag{flex:0 0 auto;font-size:.72rem;letter-spacing:.08em;color:var(--gold);
          border:1px solid var(--goldln);border-radius:5px;padding:1px 6px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.phandle,.pdot,.pwhen{flex:0 0 auto;font-size:.9rem;color:var(--txm)}
/* Who you are, at the top of your own page. */
/* The profile screen does not scroll and has no body padding of its own, so
   this carries its own margins -- without them the face was cut off by the
   left edge of the phone. */
.mecard{display:flex;align-items:center;gap:12px;padding:2px 24px 8px}
.mecard .pav{width:52px;height:52px}
.mecard .pav canvas{width:34px;height:34px}
.mewho{flex:1 1 auto;min-width:0}
.mewho .pname{font-size:1.1rem}
.meedit{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;
        border:1px solid var(--line);background:none;color:var(--tx);
        font-family:inherit;font-size:.88rem}
.meedit:active{border-color:var(--goldln);color:var(--gold)}
.phandle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pmore{margin-left:auto;flex:0 0 auto;min-width:44px;min-height:44px;margin-right:-12px;
       background:none;border:0;color:var(--txm);
       display:inline-flex;align-items:center;justify-content:center}
.pmore:active{color:var(--bad)}
.pline{font-size:1.06rem;line-height:1.45;color:var(--tx);
       margin-top:2px;word-break:break-word}
.pmn{font-size:1.0rem;line-height:1.45;color:var(--txs);margin-top:2px}
.pgl,.pwgl{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px}
.pwg{font-size:.76rem;color:var(--txm)}
.pwg.none{color:var(--bad)}
/* Spread edge to edge under the post, the way a thumb expects to find them. */
/* Edge to edge under the post, the way a thumb expects to find them. */
.pacts{display:flex;justify-content:space-between;margin:2px -8px -10px -10px}
.pact{min-width:44px;min-height:44px;padding:0 6px;background:none;border:0;
      color:var(--txm);display:inline-flex;align-items:center;gap:5px}
.pact .pn{font-size:.8rem;min-width:8px;text-align:left}
.pact:active{color:var(--gold)}
.pact.on{color:var(--gold)}
/* Writing one wears the same face and the same type as the things around it. */
/* The button that finishes it, filled, at the end of the bar. */
.navdo{margin-left:auto;align-self:center;flex:0 0 auto;min-height:44px;min-width:44px;
       padding:0 20px;border:0;border-radius:999px;background:var(--gold);
       color:var(--onGold);font-family:inherit;font-size:.92rem;font-weight:700}
.navdo:active{opacity:.75}
.pwto{font-size:.86rem;color:var(--txm);margin-bottom:8px}
.pwtop{display:flex;gap:12px;margin-bottom:6px}
.pwfield{flex:1 1 auto;min-width:0}
.pwfield input{width:100%;background:none;border:0;color:var(--tx);
               font-family:inherit;font-size:1.2rem;line-height:1.5;min-height:44px;padding:0}
.pwfield input:focus{outline:none}
.pwmn{margin-top:10px;font-size:1.02rem !important;color:var(--txs) !important}
/* Over the feed, above the bar, under the thumb already holding the phone. */
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0) + 92px);
     z-index:26;width:56px;height:56px;border-radius:50%;border:0;
     background:var(--gold);color:var(--onGold);
     box-shadow:0 10px 26px var(--glassdrop);
     display:flex;align-items:center;justify-content:center}
.fab:active{opacity:.75}
.fab .ic{width:22px;height:22px}
/* ---------- a list being read in ----------
   The table scrolls sideways rather than the page: a spreadsheet has as many
   columns as it has, and a phone has one width. */
/* A shadow at whichever edge has more table behind it, and none when the
   whole sheet already fits. A spreadsheet's fourth column sitting silently
   off the right of a phone is how a column nobody looked at gets imported.
   The `local` layers scroll with the content and cover the `scroll` ones at
   the ends, so this needs no measuring and no JavaScript. */
.imptab{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
        border-radius:12px;margin-bottom:12px;
        background:
          linear-gradient(to right, var(--pane) 40%, transparent) left/34px 100% no-repeat local,
          linear-gradient(to left,  var(--pane) 40%, transparent) right/34px 100% no-repeat local,
          radial-gradient(farthest-side at 0 50%,   var(--glassdrop), transparent) left/13px 100% no-repeat scroll,
          radial-gradient(farthest-side at 100% 50%, var(--glassdrop), transparent) right/13px 100% no-repeat scroll,
          var(--pane)}
.imptab table{border-collapse:collapse;font-size:.88rem;white-space:nowrap}
.imptab th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.imptab th select{min-height:44px;background:var(--sf);border:1px solid var(--goldln);
                  border-radius:8px;color:var(--gold);font-family:inherit;font-size:.88rem;padding:0 8px}
.imptab .impcap{font-size:.76rem;color:var(--txm);margin-top:4px;max-width:150px;
                overflow:hidden;text-overflow:ellipsis}
.imptab td{padding:7px 10px;color:var(--txs);border-bottom:1px solid var(--line2);
           max-width:190px;overflow:hidden;text-overflow:ellipsis}
/* A page's signs side by side, at a size you can judge. */
.numsm{flex:0 0 auto;width:26px;height:26px;margin-right:2px}
span.numsm{font-size:1.1rem;line-height:26px;text-align:center;color:var(--tx)}
.ltstrip{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}
.ltstrip canvas{width:40px;height:40px}
.ltstrip .bch{font-size:1.7rem;line-height:40px;color:var(--tx)}
.impsum{display:flex;flex-wrap:wrap;gap:16px;margin:2px 2px 12px}
/* What to do about the words that are already here, beside how many there
   are, because the choice is about those and about nothing else. */
.impdup{display:flex;align-items:center;gap:14px;margin:0 2px 4px}
.impdup .impn{flex:0 0 auto;font-size:.92rem;color:var(--txs)}
.impdup .segs{margin:0;flex:1 1 auto;justify-content:flex-end}
.impsum span{font-size:.92rem;color:var(--txs)}
.impsum b, .impdup b{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;
          color:var(--gold);font-weight:600;margin-right:6px}
/* The file button holds the input on top of itself, invisible and the whole
   size of it, because a native file control cannot be styled and a hidden one
   cannot be pressed. */
.impfile{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
         width:100%;min-height:52px;margin-top:10px;border:1px solid var(--goldln);
         border-radius:11px;background:var(--goldsf);color:var(--gold);font-size:.94rem}
.impfile input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
.impbig{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.6rem;text-align:center;
        padding:26px 0 4px;color:var(--tx)}
/* ---------- the card ----------
   The picture is 1080 square whatever the phone is; the preview is however
   wide the sheet is. Nothing here says what is drawn on it -- that is
   www/card.js -- and nothing there says how big it looks. */
/* No border and no ground of its own: the picture already has both, and a
   box drawn round it was a fourth frame inside three. */
.cardbox{border-radius:14px;overflow:hidden}
.cardc{display:block;width:100%;height:auto}
/* ---------- the door ----------
   The name, a rule under it, and then the app. Nothing moves except the
   rule drawing itself, because a spinner says "this is slow" and this is
   not slow -- it is a moment on purpose. */
#splash{position:fixed;inset:0;z-index:900;background:var(--bg);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        transition:opacity .38s ease}
#splash.off{opacity:0;pointer-events:none}
.splbrand{font-family:'Cinzel',Georgia,serif;font-size:1.5rem;letter-spacing:.42em;
          text-indent:.42em;color:var(--tx)}
.splbrand .st{color:var(--gold)}
.splrule{width:0;height:1px;background:var(--goldln);animation:splr .85s ease-out forwards}
@keyframes splr{from{width:0}to{width:132px}}
/* ---------- the three tabs ----------
   Only the three roots carry this. On an inner page the thing at the bottom
   of the screen is that page's own button, and a tab bar under it would be
   two bars competing for the same thumb.

   It floats clear of the bottom edge rather than sitting on it, because the
   page has to run underneath for the glass to have anything to refract. The
   blur is behind an @supports: a webview that cannot blur gets --glassop, a
   solid surface, instead of a transparent bar with the text showing through. */
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0) + 10px);
        z-index:25;max-width:420px;margin:0 auto;display:flex;gap:4px;padding:5px;
        border-radius:999px;background:var(--glassop);border:1px solid var(--glassrim);
        box-shadow:inset 0 1px 0 var(--glassspec), 0 12px 32px var(--glassdrop)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .tabbar{background:var(--glass);
          -webkit-backdrop-filter:blur(22px) saturate(180%);
          backdrop-filter:blur(22px) saturate(180%)}
}
/* An icon over its name, which is what a phone's bottom bar is, and all five
   say their name rather than only the one you are on. 「下タブの横に文字つける
   のやめて」 -- side by side, the label pushed the icon off centre and the
   pill had to grow to hold both. Stacked, every tab is the same width and
   the longest label in ten languages (Уведомления) still fits. */
.tab{flex:1 1 0;min-width:0;min-height:52px;background:none;border:0;color:var(--txm);
     border-radius:999px;display:flex;flex-direction:column;align-items:center;
     justify-content:center;gap:3px;
     font-family:inherit;padding:5px 2px;transition:color .18s,background .18s}
.tab .tabl{display:block;font-size:.62rem;letter-spacing:.01em;white-space:nowrap;
           max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* the lens: the one tab you are on is a solid pill inside the glass */
.tab.on{color:var(--gold);background:var(--goldsf);
        box-shadow:inset 0 0 0 1px var(--goldln), inset 0 1px 0 var(--glassspec)}
/* The cover does not scroll. 「ホームもスクロールさせるな固定させてくれ」 */
.view.fixed{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.cover{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
       padding:0 30px calc(84px + env(safe-area-inset-bottom,0));text-align:center}
/* What the language is for, on the cover, because that is where what a book
   is about belongs. */
.wldrow{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;
        min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
        background:none;color:var(--txs);font-family:inherit;font-size:.88rem}
.wldrow:active{border-color:var(--goldln)}
.wldl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wldl.none{color:var(--txm)}
.cvrow{display:flex;gap:8px;margin:16px 0 6px}
.cvst{flex:1;min-height:56px;background:none;border:1px solid var(--line);border-radius:10px;
      padding:9px 4px;color:var(--tx);font-family:inherit;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cvst:active{border-color:var(--goldln);color:var(--gold)}
.cvv{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.14rem}
.cvl{font-size:.82rem;color:var(--txm);letter-spacing:.06em}
/* ---------- I. sounds, II. letters ----------
   A sound is a row: the sound itself, the letters that write it, and the two
   ways to add one. A letter is a row: its face, its name, what it reads. The
   same face component in both, because it is the same letter. */
.sndlist,.ltlist{border-top:1px solid var(--line)}
.sndrow,.ltrow{display:flex;align-items:center;gap:9px;padding:9px 0;
               border-bottom:1px solid var(--line)}
.ltrow.on{background:var(--goldsf)}
.sndp{flex:0 0 auto;min-width:56px;min-height:48px;border:1px solid var(--line);border-radius:9px;
      background:var(--sf);color:var(--tx);font-size:1.06rem}
.sndp:active{border-color:var(--goldln);color:var(--gold)}
.sndls{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ltf{width:48px;height:48px;flex:0 0 auto;border:1px solid var(--line);border-radius:9px;
     background:var(--pane);color:var(--tx);
     display:inline-flex;align-items:center;justify-content:center;padding:0}
.ltf:active{border-color:var(--goldln)}
.ltf canvas.tc{width:34px;height:34px;display:block}
.ltf .bch{font-size:1.4rem;line-height:1}
.ltf .nol{color:var(--txm);display:inline-flex}
.sndadd{width:44px;height:44px;flex:0 0 auto;border:1px dashed var(--line);border-radius:9px;
        background:none;color:var(--txm);
        display:inline-flex;align-items:center;justify-content:center}
.sndadd:active{border-color:var(--goldln);color:var(--gold)}
.sndx{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
      display:inline-flex;align-items:center;justify-content:center}
.sndx:active{color:var(--gold)}
.ltmid{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;
       justify-content:center;background:none;border:0;text-align:left;color:var(--tx);
       font-family:inherit;padding:4px 0}
.ltnm{display:block;font-family:'Cinzel',Georgia,serif;font-size:1rem}
.ltsn{display:block;font-size:.84rem;color:var(--txm);margin-top:2px}
/* A clash, said where it happens. Two letters reading the same unit is not an
   error -- the font takes the first and the second is simply never drawn --
   but nothing on the screen said which was which. */
.ltdup{display:block;font-size:.84rem;color:var(--bad);margin-top:2px}
/* What the server said, where it was asked. */
.obmsg{color:var(--bad);font-size:.9rem;margin-top:10px}
/* What this letter is in the alphabet, when another letter already says
   the same. Shown, not refused. */
.field input.dup{color:var(--bad);border-color:var(--bad)}
/* One sound, so a speaker rather than the play triangle a whole word gets. */
.ltsay{flex:0 0 auto;width:44px;height:44px;display:inline-flex;align-items:center;
       justify-content:center;background:none;border:0;color:var(--txm)}
.ltsay:active{color:var(--gold)}
.ltck{flex:0 0 auto;width:40px;text-align:center;color:var(--gold)}
.phk.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
/* ---------- a word, spelled ----------
   Each position is the letter and, under it, what it says here. A position
   saying something other than the letter's own reading is marked, because a
   sound change is the one thing on this row worth noticing. */
.spellrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:60px;
          padding:8px 10px;border:1px solid var(--line);background:var(--pane);border-radius:12px}
.spc{min-width:48px;min-height:52px;border:1px solid var(--line);border-radius:9px;
     background:var(--sf);color:var(--tx);padding:5px 6px;
     display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.spc.odd{border-color:var(--purln);background:var(--pursf)}
.spf{display:inline-flex;align-items:center;justify-content:center;height:26px;font-size:1.2rem}
.spf canvas.tc{width:26px;height:26px;display:block}
.spf .bch{font-size:1.2rem;line-height:1}
.spu{font-size:.82rem;color:var(--txm);line-height:1}
.spc.odd .spu{color:var(--pur)}
.spnone{flex:1;color:var(--txm);font-size:.88rem}
.spellrow .seqdel{margin-left:auto}
.spbig{display:flex;align-items:center;justify-content:center;height:96px;font-size:2.4rem;
       margin-bottom:14px;color:var(--tx)}
.spbig canvas.tc{width:80px;height:80px;display:block}
.phk.own{border-color:var(--goldln)}
/* A label on an example, so a pair reads as a comparison. */
.exlb{display:inline-block;font-size:.82rem;letter-spacing:.08em;color:var(--gold);
      border:1px solid var(--goldln);border-radius:5px;padding:2px 6px;margin-bottom:5px}
.exadd .exsm{flex:0 0 96px;min-height:44px}
/* ---------- what an entry still had not got ----------
   A synonym or an opposite, as a word you can walk to. An example, as a line
   with its meaning under it. */
.rels{display:flex;flex-wrap:wrap;gap:7px}
.rel{border:1px solid var(--line);border-radius:9px;background:var(--pane);
     padding:8px 11px;min-height:44px;color:var(--tx);text-align:left;font-family:inherit}
.rel:active{border-color:var(--goldln)}
.relw{display:block;font-family:'Cinzel',Georgia,serif;font-size:.96rem}
.relm{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
      font-size:.88rem;color:var(--txm);margin-top:1px}
.exlist{border-top:1px solid var(--line);margin-bottom:10px}
.exrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.exb{flex:1;min-width:0}
.exl{display:block;font-family:'Cinzel',Georgia,serif;font-size:1rem}
.exg{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
     font-size:.88rem;color:var(--txs);margin-top:2px}
.exadd{display:flex;flex-wrap:wrap;gap:7px}
.exadd input{flex:1 1 100%;min-width:0;min-height:44px;background:var(--bg);border:1px solid var(--line);
             border-radius:10px;padding:11px 13px;color:var(--tx);font-family:inherit;
             font-size:.92rem;outline:none}
.exadd .btn{flex:0 0 auto}
.entry.on{background:var(--goldsf)}
/* ---------- the abugida bench ----------
   Every consonant wearing one vowel, at a size you can judge. Three across
   at 320px and four above it: fewer and you cannot compare, more and each is
   too small to see what the mark is doing. */
.abmark{border:1px solid var(--goldln);background:var(--goldsf);border-radius:12px;
        padding:12px 13px;margin-top:10px}
.abmh{font-size:.84rem;color:var(--gold);letter-spacing:.06em;margin-bottom:9px}
.abctl{display:flex;flex-wrap:wrap;gap:6px}
.abctl button{min-width:46px;min-height:44px;border:1px solid var(--line);border-radius:9px;
              background:var(--pane);color:var(--txs);font-family:inherit;font-size:.86rem;
              display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 10px}
.abctl button:active{border-color:var(--goldln);color:var(--gold)}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.abcell{border:1px solid var(--line);border-radius:10px;background:var(--pane);
        padding:8px 4px 6px;color:var(--tx);
        display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.abcell.own{border-color:var(--goldln)}
.abcell canvas.tc{width:60px;height:60px;display:block}
.abu{font-size:.82rem;color:var(--txm);letter-spacing:.03em}
.abcell.own .abu{color:var(--gold)}
/* ---------- search, the tab ---------- */
.fcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.fcard.soon{border-style:dashed;opacity:.62}
.fch{font-family:'Cinzel',Georgia,serif;font-size:1rem;margin-bottom:6px}
.note{color:var(--txm);font-size:.86rem;line-height:1.75}
.sec{font-size:.82rem;letter-spacing:.28em;color:var(--txm);text-transform:uppercase;margin:28px 0 10px}
/* The wide tracking is what makes a Latin small-caps heading read as a
   heading. Han and hangul are already square and evenly set; tracking them
   just pulls the word apart, so those three languages get none, and a size
   that carries without the capitals trick. */
html[lang="ja"] .sec, html[lang="zh"] .sec, html[lang="ko"] .sec{letter-spacing:.02em;font-size:.86rem}
.card{background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0}

/* ---------- the title page (home) ---------- */
.title{padding:34px 30px 20px;text-align:center}
.tkick{font-size:.82rem;letter-spacing:.34em;color:var(--txm);text-transform:uppercase;margin-bottom:14px}
/* An inline-flex button inside a centred column is only as wide as its own
   text and sits at the left edge of it. 「作成中の言語（左寄せになってるから真ん中
   寄せに。）」 -- it is the one thing on this screen the eye lands on first. */
.tname{font-family:'Cinzel',Georgia,serif;font-weight:600;font-size:2.2rem;line-height:1.15;
       display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
       background:none;border:none;color:var(--tx);min-height:44px}
.tname .pen{font-size:.84rem;color:var(--txm);display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px}
/* The reading under the language name was purple, and purple means two
   other things here -- the PLUS tag, and a sound that changed in one word.
   It means neither on the cover, so it was a colour saying something untrue
   on the first screen you see. */
.tsub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.1rem;color:var(--txs);margin-top:6px}
.toc{margin-top:14px}
.trow{display:flex;align-items:baseline;gap:12px;padding:16px 2px;width:100%;background:none;border:none;color:var(--tx);text-align:left}
.trow:active{opacity:.55}
.trow .rn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold);font-size:1rem;width:26px;flex:0 0 auto}
.trow .rt{font-size:1.1rem;font-weight:500}
.trow .lead{flex:1;border-bottom:1px dotted var(--dot);transform:translateY(-3px)}
.trow .rv{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.02rem;color:var(--txs);flex:0 0 auto}
.recent{margin-top:24px;background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:18px 20px;width:100%;text-align:left;color:var(--tx)}
.recent .rh{font-size:.82rem;letter-spacing:.24em;color:var(--txm);text-transform:uppercase;margin-bottom:10px}
.recent .line{font-family:'Cinzel',Georgia,serif;font-size:1.25rem;letter-spacing:.02em}
.recent .tr{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.02rem;color:var(--txs);margin-top:2px}

/* ---------- the empty state ---------- */
.empty{padding:54px 30px;text-align:center}
.empty .eb{font-family:'Cinzel',Georgia,serif;font-size:1.3rem;margin-bottom:8px}
.empty .es{color:var(--txm);font-size:.86rem;line-height:1.9}

/* ---------- the dictionary ---------- */
/* The box is as tall as the field inside it and no taller. It carried ten
   pixels of padding above and below a 44px input, which made a 66px bar
   across the top of two screens. 「検索バー縦長すぎる」 */
.search{display:flex;align-items:center;gap:9px;background:var(--pane);border:1px solid var(--line);border-radius:12px;padding:0 13px;margin:8px 0 2px}
.search input{flex:1;min-height:44px;background:none;border:none;color:var(--tx);font-family:inherit;font-size:.92rem;outline:none}
.gl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold);font-size:1.1rem;margin:20px 0 2px;opacity:.9}
/* An entry is two controls now -- the word, which says itself, and the
   chevron, which opens it -- so the row is a container and the padding and
   the rule under it stay on the row while the touch targets sit inside. */
.entry{display:flex;align-items:center;gap:4px;padding:13px 2px;
       border-bottom:1px solid var(--line);width:100%;color:var(--tx)}
.ebody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font-family:inherit}
.ebody:active{opacity:.55}
.eopen{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
       display:inline-flex;align-items:center;justify-content:center}
.eopen:active{color:var(--gold)}
/* How many are on screen, what order they are in, and the way to hear them
   all. One row, because they are all answers to "what am I looking at". */
.wmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.wct{font-size:.86rem;color:var(--txm);letter-spacing:.04em;margin-right:auto}
.wsrt,.wsay{display:inline-flex;align-items:center;gap:7px;min-height:44px;
      padding:8px 13px;border:1px solid var(--line);border-radius:10px;
      background:none;color:var(--txs);font-family:inherit;font-size:.88rem}
.wsay.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.wsrt:active{border-color:var(--goldln);color:var(--gold)}
/* Six ways to narrow the list will not fit across 320px, so the rail slides
   sideways rather than wrapping into a second row that pushes the words off
   the screen. */
/* touch-action pins it to one axis. Without it a thumb sliding along the
   rail is read as a drag in whichever direction it drifted, so aiming at
   「動詞」 scrolled the dictionary away underneath. 「横にスライドだけにして」 */
.segs.scrollx{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;touch-action:pan-x;
      margin:0 -24px;padding:0 24px;scrollbar-width:none}
.segs.scrollx::-webkit-scrollbar{display:none}
.segs.scrollx .seg{flex:0 0 auto;white-space:nowrap}
/* Clearing the search. It is only there when there is something to clear. */
.search .sx{flex:0 0 auto;min-width:40px;min-height:40px;margin:-8px -8px -8px 0;
      background:none;border:0;color:var(--txm);
      display:inline-flex;align-items:center;justify-content:center}
.search .sx:active{color:var(--gold)}
.search .sx[hidden]{display:none}
/* A sense number, and a word with no sense yet. */
.mn .sn{font-family:'Cinzel',Georgia,serif;font-style:normal;font-size:.82rem;
      color:var(--gold);margin-right:3px;vertical-align:.15em}
.mn .sn + span{margin-right:0}
.mn .nomn{opacity:.42}
/* Where a word came from, and how many have come from it. */
.erel{display:flex;flex-wrap:wrap;gap:10px;margin-top:3px}
.efrom,.ekids{font-size:.84rem;color:var(--txm);letter-spacing:.02em}
.ekids{color:var(--gold);opacity:.75}
/* A sentence this word is used in. */
.useln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.useln:last-child{border-bottom:0}
.usew{font-family:'Cinzel',Georgia,serif;font-size:.95rem;flex:0 0 auto;max-width:45%;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usem{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
      font-size:.9rem;color:var(--txs);flex:1;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usep{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
      display:inline-flex;align-items:center;justify-content:center}
.usep:active{color:var(--gold)}
.hwrow{display:flex;align-items:baseline;gap:10px}
.hw{font-family:'Cinzel',Georgia,serif;font-size:1.26rem;letter-spacing:.02em}
.rd{font-size:.86rem;color:var(--txm)}
.pos{margin-left:auto;font-size:.82rem;color:var(--txm);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.mn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.08rem;color:var(--txs);margin-top:1px}

/* ---------- sound ---------- */
.ph{display:inline-flex;flex-direction:column;align-items:center;font-family:'Cinzel',Georgia,serif;
    font-size:.92rem;border:1px solid var(--line);line-height:1.15;
    border-radius:9px;padding:5px 10px;margin:0 6px 8px 0;color:var(--tx);background:var(--sf);min-width:34px}
.ph i{font-style:normal;font-family:'Cormorant Garamond',Georgia,serif;font-size:.84rem;color:var(--gold);margin-top:2px}
.ph.off{color:var(--txm);border-style:dashed;background:none;opacity:.6}
.ph.off i{color:var(--txm)}
.link{background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
.link .src{font-family:'Cinzel',Georgia,serif;font-size:1.16rem;letter-spacing:.03em}
.link .arw{color:var(--txm);font-size:.86rem;margin:9px 0 7px}
.link .out{font-size:1.34rem;color:var(--gold);letter-spacing:.06em}
.play{margin-top:14px;background:var(--goldsf);border:1px solid var(--goldln);color:var(--gold);
      border-radius:9px;padding:9px 18px;font-size:.86rem;font-weight:600}
.play:active{opacity:.6}

/* ---------- rules ---------- */
.find{padding:16px 0;border-bottom:1px solid var(--line)}
.ft{font-size:1rem;font-weight:500;line-height:1.6}
.ft em{font-style:normal;color:var(--gold);font-family:'Cinzel',Georgia,serif}
.fd{color:var(--txm);font-size:.88rem;margin-top:5px;line-height:1.8}
.bar{height:2px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}

/* ---------- make ---------- */
/* Not pills. A pill is a rounded box with a word shut inside it, and this
   app has been told more than once that it does not want those anywhere. A
   choice between a few named things is a rail: the words sit on a line, the
   chosen one is gold and underscored, and nothing is enclosed. */
.segs{display:flex;gap:0;flex-wrap:wrap;margin-bottom:8px;border-bottom:1px solid var(--line)}
.seg{min-height:44px;min-width:44px;background:none;border:0;border-bottom:2px solid transparent;
     color:var(--txs);padding:9px 14px;font-size:.84rem;margin-bottom:-1px}
.seg.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.cand{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.cand .ck{width:44px;height:44px;margin-left:-11px;border:0;background:none;flex:0 0 auto;
          display:flex;align-items:center;justify-content:center}
.cand .ck .ckb{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);
          display:flex;align-items:center;justify-content:center;color:var(--onGold)}
.cand .ck.on .ckb{background:var(--gold);border-color:var(--gold)}
.cand .cw{font-family:'Cinzel',Georgia,serif;font-size:1.1rem}
.cand .crd{font-size:.86rem;color:var(--txm);margin-left:2px}
.cand .cm{margin-left:auto;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--txs);font-size:1rem}
/* 44 is Apple's floor for anything a thumb has to hit, and this said so --
   then a second .cand .rr three hundred lines further down, in a batch of
   fixes made when characters became drawings, repeated three of these four
   declarations and set min-width to 26. A later rule undoing an earlier one
   about the same thing, so the row's two controls were half a target wide for
   as long as nobody measured them. There is one rule. */
.cand .rr{background:none;border:none;color:var(--txm);min-width:44px;min-height:44px;
          display:flex;align-items:center;justify-content:center}

/* ---------- settings ---------- */
.set{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--tx)}
.set .sl{font-size:.95rem}
/* Deleting something, wherever it is offered. It was written out as

.obscripts{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.obsrow{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
        gap:3px;width:100%;text-align:left;
        border:1px solid var(--line);background:var(--pane);border-radius:12px;
        padding:9px 12px;color:var(--tx);min-height:56px}
.obsrow.on{border-color:var(--goldln);background:var(--goldsf)}
.obpv{font-size:.94rem;color:var(--gold);line-height:1.2;letter-spacing:.06em;opacity:.9}
.obnm{font-size:.86rem}
/* The five kinds of writing are one column, not two: each carries a line of
   explanation, and a name like "Abugida" tells nobody anything without it. */
.obws{font-size:.86rem;color:var(--txm);line-height:1.5}
.ob .obscripts.one{grid-template-columns:1fr}
/* A step is one screen and does not scroll; this is the one part of it that
   does. Whatever a step puts inside takes the height it needs, however many
   things that is. */
.ob .obscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
              align-self:stretch}
/* the name, which is the only thing typed in the whole of onboarding */
.obnamebox{width:100%;margin-top:20px}
.obnamebox input{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:12px;
  padding:16px 16px;color:var(--tx);font-family:'Cinzel',Georgia,serif;font-size:1.25rem;
  text-align:center;outline:none}
.obnamebox input:focus{border-color:var(--goldln)}
/* a letter the app worked out rather than one anybody drew */
.gtile.made{border-style:dashed}
.obchars{margin-top:12px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
         display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-content:start}
.obchb{border:1px solid var(--line);background:var(--sf);border-radius:9px;
       padding:0;font-size:1.05rem;color:var(--tx);min-width:44px;min-height:48px}
.obsndgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;flex:0 0 auto}
.obsnd{border:1px solid var(--line);background:var(--sf);border-radius:10px;
       padding:12px 16px;font-size:1.05rem;color:var(--tx);min-width:52px;min-height:52px}
.obsnd.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.obgl{color:var(--gold);display:block;margin:0 auto}
.obch{color:var(--gold);line-height:1;text-align:center}
/* The door is drawn, not built out of a box with rounded corners. A CSS
   arch inherits its radius into the panel inside it, needs a different fill
   in each theme, and turns into a pale slab on a light background. One
   stroked path in the app's own line weight is the same door in both. */
/* Allowed to shrink, and capped against the height as well as the width:
   on a 568pt screen a door sized off the width alone pushed the name and
   the buttons into each other. */
/* The box is what shrinks; the drawing fits inside whatever is left of it.
   Sized off the width alone the arch could not give ground, so on a short
   screen in a long language -- Russian on a 568pt phone -- the name was
   printed across the door. */
.obdoor{flex:0 1 auto;min-height:0;height:min(30vh, 224px);
        display:flex;align-items:center;justify-content:center;color:var(--gold);line-height:0}
.obdoor svg{height:100%;width:auto;max-width:min(40vw,148px);display:block}
.obrule{width:56px;height:1px;margin:clamp(12px,2.4vh,20px) auto 0;flex:0 0 auto;
        background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ob .obh1{font-family:'Cinzel',Georgia,serif;font-size:clamp(1.35rem,5.6vw,1.8rem);
          letter-spacing:.2em;margin-top:clamp(10px,2vh,16px);font-weight:600;flex:0 0 auto}
.ob .obtag{margin-top:clamp(6px,1.4vh,10px);font-size:clamp(.9rem,3.6vw,1.05rem);flex:0 0 auto}
.ob .obfoot .btn.signin{margin-bottom:10px}
/* The door's faces are forms, so they are read down the left edge and they
   scroll. A sign-in screen on a 568pt phone does not fit -- crest, two
   fields, a button, a link, a rule, Apple, Google -- and it must not be the
   one screen in the app that quietly clips its last button off. */
.ob .mid.obform{justify-content:flex-start;align-items:stretch;text-align:left;
                overflow-y:auto;-webkit-overflow-scrolling:touch}
/* A column that scrolls gives nothing away: the register face has four
   children and the flex box handed the last one every pixel left over, so
   the button was two thirds of the screen. */
.ob .mid.obform>*{flex:0 0 auto}
/* .ob.center is what took the margin off the splash, which was centred in the
   whole screen. The forms that replaced it are read from the top and want it
   back, or the heading sits against the chevron. */
.ob.center .mid.obform{margin:20px 0 0}
.ob .mid.obform .btn{width:100%;margin-top:6px}
.ob .obcrest{text-align:center;flex:0 0 auto;margin-bottom:20px}
.ob .obcrest .obdoor{height:min(16vh,116px)}
.ob .obcrest .obh1{margin-top:10px}
.obor{display:flex;align-items:center;gap:12px;margin:20px 0 14px;
      color:var(--txm);font-size:.82rem;flex:0 0 auto}
.obor::before,.obor::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
/* Instagram's bar, and it is the whole reason there are two screens: the way
   from one to the other is a fixed line at the foot, not a link buried under
   the button that does the other thing. */
.obbar{flex:0 0 auto;margin:0 -24px;padding:14px 24px 0;border-top:1px solid var(--line);
       display:flex;justify-content:center;align-items:center;gap:7px;
       font-size:.86rem;color:var(--txm)}
.obbar button{background:none;border:0;padding:0;font:inherit;font-size:.86rem;
              font-weight:600;color:var(--gold);min-height:44px}
.obbar button:active{opacity:.55}
.obskip{display:block;width:100%;min-height:44px;margin-top:4px;background:none;border:0;
        color:var(--txs);font:inherit;font-size:.84rem;text-decoration:underline;
        text-underline-offset:3px;text-decoration-color:var(--line)}
.obskip:active{opacity:.55}

.obback{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:inherit;opacity:.75;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;flex-shrink:0;min-width:44px;min-height:44px}
.obback:hover{opacity:1}
.obback:active{transform:scale(.92)}
.obback.ph{pointer-events:none;opacity:0}
.btn.signin .mk{flex-shrink:0}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;margin-bottom:10px}
.ptile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:58px;padding:4px;border:1px solid var(--line);border-radius:10px;background:transparent;
  color:var(--tx);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ptile.has{border-color:rgba(201,168,106,.45)}
.ptile:active{transform:scale(.96)}
.pch{font-size:1.4rem;line-height:1.1}
.ptile:not(.has) .pch{font-size:.95rem;color:var(--txm)}
.psn{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;color:var(--txm)}
.pdel{position:absolute;top:0;right:3px;font-size:.88rem;color:var(--txm);line-height:1}
.pkown{display:flex;gap:8px;align-items:center;margin-bottom:10px}
/* .btn is flex:1 so a row of them shares the width; one beside a field is
   not sharing anything and shrank to the width of its word and grew tall. */
.pkown .btn{flex:0 0 auto;min-width:88px}
.pkclear{width:100%;margin-bottom:12px;padding:8px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--txm);font:inherit;font-size:.86rem;cursor:pointer}
.pktabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:9px;
  border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.pktab{display:flex;align-items:center;gap:5px;flex-shrink:0;min-height:44px;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:transparent;color:var(--txm);font:inherit;font-size:.84rem;cursor:pointer;white-space:nowrap}
.pktab.on{border-color:var(--gold);color:var(--gold)}
.pkpv{font-size:.9rem;color:var(--gold)}
.pkchars{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;
  max-height:34dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pkch{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--tx);font-size:1.15rem;cursor:pointer;padding:0}
.pkch.had{opacity:.28}
.pkch.cur{border-color:var(--gold);color:var(--gold)}
.sndgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;max-height:46dvh;overflow-y:auto}
.sndchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px;
  border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.sc1{font-family:ui-monospace,Menlo,monospace;font-size:.86rem}
.sc2{font-size:.82rem;color:var(--txm)}
.scrpv{display:flex;flex-direction:column;gap:4px;padding:13px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px}
.scrpvw{font-size:1.5rem;line-height:1.4;word-break:break-all}
.scrpvr{font-size:.86rem;color:var(--txm);font-family:ui-monospace,Menlo,monospace}
.scin{width:100%;min-width:0;min-height:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  color:var(--tx);font:inherit;font-size:1rem;outline:none}
.scin:focus{border-color:var(--gold)}
.scin.own{text-align:left}
.scin{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 7px;
  color:var(--tx);font:inherit;font-size:1.05rem;text-align:center;outline:none}
.scin:focus{border-color:var(--gold)}
.scrpv{display:flex;flex-direction:column;gap:5px;padding:15px;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.scrpvw{font-size:1.7rem;line-height:1.4;word-break:break-all}
.scrpvr{font-size:.86rem;color:var(--txm);font-family:ui-monospace,Menlo,monospace}
.sugask{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:2px 0 12px;
  padding:11px 13px;border:1px dashed var(--line);border-radius:11px;background:transparent;color:var(--txm);
  font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
.sugask:active{transform:scale(.99)}
.sual{display:flex;flex-direction:column;gap:2px;min-width:0}
.sut{font-size:.82rem;color:var(--tx)}
.sud{font-size:.84rem;color:var(--txm);line-height:1.5}
.sugn{color:var(--gold);font-size:.86rem;flex-shrink:0}
.sugbox{margin:2px 0 12px;padding:11px;border:1px solid var(--line);border-radius:11px}
.sugchips{display:flex;flex-wrap:wrap;gap:7px}
.sugchip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sugchip:active{transform:scale(.97)}
.sugchip .sw{font-size:.92rem}
.sugchip .sr{font-size:.84rem;color:var(--txm)}
.sugfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.sughint{font-size:.84rem;color:var(--txm);line-height:1.5}
.sugmore{background:none;border:0;color:var(--gold);font:inherit;font-size:.86rem;cursor:pointer;
         min-height:44px;padding:0 2px;flex-shrink:0;text-decoration:underline}
.sugout{display:block;width:100%;margin:2px 0 12px;padding:11px 13px;border:1px solid rgba(201,168,106,.34);border-radius:11px;
  background:transparent;color:var(--txm);font:inherit;font-size:.88rem;line-height:1.6;text-align:left;cursor:pointer}
.sugout b{color:var(--gold);font-weight:600;white-space:nowrap}
.capwarn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:2px 0 14px;padding:12px 14px;
  border:1px solid rgba(201,168,106,.3);border-radius:10px;background:transparent;color:var(--txm);font:inherit;font-size:.88rem;cursor:pointer}
.capgo{color:var(--gold);flex-shrink:0}
.sh2{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--txm);margin:26px 0 10px}
.set.lock .sv{color:var(--gold)}
.nextcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:2px 0 18px;padding:14px 16px;
  border:1px solid rgba(201,168,106,.34);border-radius:12px;background:rgba(201,168,106,.09);color:inherit;
  font:inherit;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.nextcard:hover{border-color:rgba(201,168,106,.6)}
.nextcard:active{transform:scale(.99)}
.nextcard .nk{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);flex-shrink:0}
.nextcard .nl{flex:1;font-size:.92rem;line-height:1.5}
.nextcard .na{color:var(--gold);flex-shrink:0;display:flex;align-items:center}

/* ---------- the grammar, in stages ----------
   A list of stages, each with what it still needs; then one stage open, with
   its words as rows you can fill on the spot. */
.stlist{display:flex;flex-direction:column;gap:0}
.strow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:14px 2px;
  border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer}
/* The title takes the room that is left and wraps if it has to; the number,
   the count and the chevron never shrink. Fixed-width titles pushed the count
   off a 320px screen in the languages with longer words. */
.strow .stn{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:var(--gold);
  font-size:1.05rem;min-width:20px;flex:0 0 auto}
.strow .stt{font-size:.98rem;flex:1 1 auto;min-width:0;line-height:1.4}
.strow .lead{display:none}
.strow .stv{font-size:.88rem;color:var(--txm);flex:0 0 auto;white-space:nowrap}
.strow .go{color:var(--txm);flex:0 0 auto}
.strow.done .stt{color:var(--txs)}
.strow.done .stv{color:var(--gold)}
.sth{font-family:'Cinzel',Georgia,serif;font-size:1.35rem;margin:6px 0 8px}
.stslots{display:flex;flex-direction:column;gap:0}
.stslot{display:flex;align-items:baseline;gap:10px;width:100%;min-height:56px;padding:13px 2px;
  border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;
  text-align:left;cursor:pointer;flex-wrap:wrap}
.stslot .psm{font-size:.95rem;flex:0 0 auto;min-width:78px}
.stslot .psw{font-family:'Cinzel',Georgia,serif;font-size:1.06rem;color:var(--gold)}
.stslot .psi{font-family:ui-monospace,Menlo,monospace;font-size:.84rem;color:var(--txm)}
.stslot .psn{font-size:.88rem;color:var(--txm)}
.stslot .go{margin-left:auto;color:var(--txm);flex:0 0 auto;align-self:center}
.stslot.has .psn{display:none}

/* ---------- what the app proposes ----------
   The inventory it drew, laid out so every sound in it can be heard on its
   own before the whole thing is accepted. */
.obheard{margin-top:14px;padding:14px;border:1px solid var(--goldln);border-radius:12px;
  background:var(--goldsf)}
.obheard .obhl{font-size:.86rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.obhs{display:flex;flex-wrap:wrap;gap:6px}
/* Consonants and vowels on their own rows, each with its name to the side.
   The name is quiet and small: it is there to be read once, and after that it
   is only a marker for which row is which. */
.obhr{margin-bottom:10px}
.obhr:last-child{margin-bottom:0}
.obhk{display:block;font-size:.84rem;letter-spacing:.06em;color:var(--txm);margin-bottom:5px}
/* A sound and the way to take it back out, joined as one block so it reads
   as one thing. The sound says itself; the cross removes it. Both are full
   height, because a target you have to aim at is a target you will miss. */
.obhp{display:inline-flex;align-items:stretch;border:1px solid var(--goldln);border-radius:8px;
  background:var(--pane);overflow:hidden}
.obhb{min-width:44px;min-height:44px;border:0;border-radius:0;
  background:none;color:var(--tx);font-size:1.02rem;padding:8px 4px 8px 11px}
.obhb:active{opacity:.55}
.obhx{min-width:44px;min-height:44px;border:0;background:none;color:var(--txm);
  display:inline-flex;align-items:center;justify-content:center;padding:0 8px 0 4px}
.obhx:active{color:var(--gold)}
/* And the way to lengthen the row. Dashed, because it is not one of the
   sounds -- it is the space where the next one would go. */
.obhadd{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;
  border:1px dashed var(--line);border-radius:8px;background:none;
  color:var(--txs);font-family:inherit;font-size:.88rem}
.obhadd:active{border-color:var(--goldln);color:var(--gold)}

/* ---------- a word, opened ----------
   Its meanings are a list, because a word can mean more than one thing, and
   the words derived from it are listed under it as the entries they are. */
/* a derived word, set in from the margin under the one it came from */
.entry.kid{padding-left:20px;border-left:1px solid var(--goldln);margin-left:2px}
.entry.kid .hw{font-size:1.02rem}
.mnlist{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
.mnrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mnrow .mnv{flex:1;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:1.02rem;color:var(--tx)}
.mnrow .mnx{min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
  display:flex;align-items:center;justify-content:center}
.mnadd{display:flex;gap:8px;align-items:stretch}
.mnadd input{flex:1;min-width:0;background:var(--sf);border:1px solid var(--line);border-radius:9px;
  padding:12px 13px;color:var(--tx);font:inherit;font-size:.92rem;outline:none}
.mnadd .btn{flex:0 0 auto}
/* the letter a sound wears, when it was borrowed rather than drawn */
.gborrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;background:var(--pane)}
.gborrow .gbch{font-size:1.7rem;color:var(--gold);line-height:1}
.gborrow .gbl{font-size:.88rem;color:var(--txs)}
.gborrow .gbx{margin-left:auto;min-height:44px;padding:6px 12px;background:none;
  border:1px solid var(--line);border-radius:8px;color:var(--txm);font:inherit;font-size:.86rem}

/* ---------- notes ----------
   A notebook page: a heading and the first line of what is under it. */
.ntlist{display:flex;flex-direction:column;gap:10px}
.ntrow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:14px 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--pane);color:inherit;font:inherit;cursor:pointer}
.ntrow:active{transform:scale(.995)}
.ntrow .nth{font-size:.95rem;color:var(--tx)}
.ntrow .ntb{font-size:.88rem;color:var(--txm);line-height:1.6}
.ntbody{min-height:180px;line-height:1.8}
/* A textarea outside a .field had no styling of its own, so a rule written
   straight onto a page came out as a white box on a dark screen. */
textarea.ntbody{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;
   padding:12px 14px;color:var(--tx);font-family:inherit;font-size:.94rem;outline:none;resize:vertical}
textarea.ntbody:focus{border-color:var(--goldln)}

/* ---------- the conversation ----------
   Its turns sit against the left margin, yours against the right, and every
   one carries what it means underneath because you are still learning to
   read this. */
.tkthread{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.tk{position:relative;max-width:88%;align-self:flex-start;padding:12px 44px 12px 14px;
  border:1px solid var(--line);border-radius:14px 14px 14px 4px;background:var(--pane)}
.tk.me{align-self:flex-end;border-radius:14px 14px 4px 14px;
  border-color:var(--goldln);background:var(--goldsf)}
.tk .tkw{font-family:'Cinzel',Georgia,serif;font-size:1.06rem;color:var(--tx);word-break:break-word}
.tk .tki{font-family:ui-monospace,Menlo,monospace;font-size:.84rem;color:var(--gold);margin-top:3px}
.tk .tkg{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:.9rem;
  color:var(--txs);margin-top:4px;line-height:1.5}
.tk .tkp{position:absolute;top:8px;right:6px;min-width:44px;min-height:44px;background:none;border:0;
  color:var(--txm);display:flex;align-items:center;justify-content:center}
.tk .tkp:active{opacity:.5}
.tsend{display:flex;gap:10px;margin-top:12px}
.tmks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.tmk{min-height:44px;padding:8px 14px;border:1px solid var(--goldln);border-radius:8px;
  background:var(--goldsf);color:var(--gold);font:inherit;font-size:.82rem;cursor:pointer}
.tmk:disabled{opacity:.35;border-color:var(--line);background:none;color:var(--txm)}

/* ---------- grammar: a decision, and what it does ----------
   A row of choices, then the piece of sound the choice is carried by, then
   one of your own words before and after it. The demonstration is the point,
   so the panel is built around it. */
.gorder{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 2px}
.gor{font-size:.86rem;color:var(--tx)}
.gsep{display:flex;align-items:center;color:var(--gold);opacity:.8}
.gpiece{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 0;padding:12px 14px;
  border:1px solid var(--line);border-radius:11px;background:var(--pane);color:inherit;font:inherit;
  text-align:left;cursor:pointer;min-height:48px}
.gpiece.has{border-color:var(--goldln)}
.gpiece .gpl{font-size:.88rem;color:var(--txs)}
.gpiece .gpv{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;color:var(--gold)}
.gpiece:not(.has) .gpv{color:var(--txm);font-family:inherit;font-size:.88rem}
.gdemo{margin:12px 0 2px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--pane)}
.gside{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);flex-wrap:wrap}
.gside:first-child{border-top:0}
.gside .gsl{flex:0 0 auto;font-size:.82rem;letter-spacing:.13em;text-transform:uppercase;color:var(--txm);min-width:50px}

  color:var(--txs);display:flex;align-items:center;justify-content:center;align-self:center}
.gside .gsp:active{opacity:.5}
.gneed{margin:10px 0 2px}

/* ---------- nothing tappable smaller than a thumb ----------
   Apple's floor is 44px and a phone has nothing finer to point with. These
   are the buttons that were drawn to the size of their mark rather than to
   the size of the finger that has to find them. */
.wctl button,.wctl2 button,.play,.rr2,.tkp,.gside .gsp,.pkclear,.obskip{min-height:44px}
.tkp{min-width:44px}
.gside .gsp{min-width:44px}
.sylrow .syk{min-width:44px;min-height:44px;background:none;border:0;color:var(--txs);
  display:flex;align-items:center;justify-content:center}

/* ---------- the marks, now that they are drawn ----------
   A typed character sat on the text baseline and took its size from whichever
   font answered. A drawn one does neither, so every place that used to hold
   one is told where to put it instead. */
.ic{vertical-align:-.12em}
.search .lens{display:flex;align-items:center;color:var(--txm);flex:0 0 auto}
.set .sv{display:flex;align-items:center;gap:6px}
.set .sv .go,.capgo .go,.sugout .go{opacity:.75}
.capgo,.sugout b{display:inline-flex;align-items:center;gap:4px}
.lrow .lchk{flex:0 0 16px;display:flex;align-items:center;justify-content:flex-end}
.cand .ck svg,.pdel svg{display:block}
.pdel{position:absolute;top:2px;right:2px;color:var(--txm);line-height:1;
      display:flex;align-items:center;justify-content:center;width:15px;height:15px}

<!-- The door. The app used to appear mid-flight: the first frame drawn was
     whatever screen you had left, arriving before the fonts, before the
     custom typeface had been built out of your own letters, and before the
     first paint had settled -- so opening it felt like being dropped rather
     than let in. This holds for a moment and goes. -->
<div id="splash"><div class="splbrand">LIN<span class="st">G</span>UA</div>
<div class="splrule"></div></div>
<div id="app"></div>

<div class="sbg" id="sbg" onclick="closeSheet(event)">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* Plain script, no module: it must run before anything heavy. The splash is
   dismissed on the later of "the app has drawn" and 900ms, so a fast phone
   still sees the name rather than a flash. */
(function(){
  var el=document.getElementById('splash'), t0=Date.now(), done=false;
  function shut(){
    if(done) return; done=true;
    el.className='off';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 420);
  }
  window.splashDone=function(){
    var w=900-(Date.now()-t0);
    setTimeout(shut, w>0? w : 0);
  };
  /* if anything at all goes wrong, the door still opens */
  setTimeout(shut, 4000);
})();
</script>

<!-- The app, in load order. It used to be one file; it is now several, because
     a file small enough to send is a file that can be changed. Nothing else
     changed: these are plain scripts, not modules, and they share one global
     scope exactly as the single <script> did.

     The order is the only thing here that matters:
       core.js      defines defLang(), so it comes before the ten languages
       ipa.js       the chart every sound is chosen from; data only
       voice.js     what a phoneme sounds like; reads ipa.js, so after it
       i18n/*.js    each registers itself; this order is the order they appear
                    in the language picker
       otf5.js      defines the font writer, so it comes before glyph.js
       glyph.js     ends with installScriptFont() and render() — the app starts
                    on its last two lines, so it goes last -->
<script src="core.js"></script>
