<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0e" id="tcolor">
<title>Lingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Theme. Dark is the default (the black-and-gold of v1). Light is the same
   skeleton printed on paper instead. Every colour lives in these two blocks
   and nowhere else; the views only ever touch the variables.
   ========================================================================= */
html[data-theme="dark"]{
  --bg:#0a0a0e; --pane:#101017; --sf:#15151d; --sf2:#1e1e29;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.05);
  --tx:#ece9e3; --txs:#a9a6b3; --txm:#6f6c7a;
  --gold:#c9a86a; --goldsf:rgba(201,168,106,.10); --goldln:rgba(201,168,106,.34);
  --bad:#d9705c;
  /* An area, while it is being drawn. The editor's only, and never a letter's:
     what is filled is the letter's own colour everywhere it is read. */
  --fill:#5fbf7a;
  --pur:#8c7eff; --pursf:rgba(140,126,255,.10); --purln:rgba(140,126,255,.42);
  --onGold:#241d10; --dot:rgba(255,255,255,.42); --shadow:0 10px 26px rgba(0,0,0,.5);
  /* glass: what the tab bar is made of. --glassop is the same surface for a
     webview too old to blur, so the bar is never a transparent smear. */
  /* the two the card is built out of: a surface that sits above --bg, and
     the ground falling away behind it */
  --raise:#191922; --sink:#06060a;
  --glass:rgba(30,30,41,.16); --glassop:#1a1a24;
  --glassrim:rgba(255,255,255,.13); --glassspec:rgba(255,255,255,.22);
  --glassdrop:rgba(0,0,0,.46);
}
html[data-theme="light"]{
  --bg:#faf8f3; --pane:#ffffff; --sf:#f3efe6; --sf2:#eae5da;
  --line:rgba(26,23,18,.12); --line2:rgba(26,23,18,.06);
  --tx:#1b1814; --txs:#5c574e; --txm:#8e887c;
  --gold:#8a6a22; --goldsf:rgba(138,106,34,.07); --goldln:rgba(138,106,34,.30);
  --bad:#c9553f;
  --fill:#2f8f4e;
  --pur:#5546c8; --pursf:rgba(85,70,200,.07); --purln:rgba(85,70,200,.34);
  --onGold:#fffdf6; --dot:rgba(26,23,18,.46); --shadow:0 8px 22px rgba(60,50,30,.10);
  --raise:#ffffff; --sink:#efeade;
  --glass:rgba(255,255,255,.20); --glassop:#f6f2ea;
  --glassrim:rgba(26,23,18,.10); --glassspec:rgba(255,255,255,.9);
  --glassdrop:rgba(60,50,30,.16);
}
/* How much of the bottom of the screen the tab bar has. It is on every screen
   now, so everything that used to sit at the bottom sits on top of it, and
   every one of them measures from here rather than carrying its own number:
   the bar's own offset, its padding, and the 52px a tab is tall. */
/* =========================================================================
   The faces. Same rule as the two theme blocks above, for type instead of
   colour: every face lives here and nowhere else, and everything that sets one
   names a variable.

   It was not that way, and the count is the argument. 'Cinzel',Georgia,serif
   was written out 37 times in this stylesheet and 'Cormorant
   Garamond',Georgia,serif 33 times, with both again in card.js because a
   canvas cannot inherit a font. Seventy-nine places restating five facts.
   Changing a face meant finding all of them, and finding 78 of 79 looks
   exactly like finding 79 until somebody opens the screen that was missed.

   --face-script is the one the person drew. It is set on .sfont with
   !important, because a great many container rules in this file say
   font-family:inherit on the input inside them and every one of those is two
   selectors where .sfont is one. See the .sfont rule itself.

   tools/face-check.mjs holds this: a family may be named on :root and in no
   other rule, and never in www/*.js at all.
   ========================================================================= */
:root{
  --face-caps:'Cinzel',Georgia,serif;
  --face-ital:'Cormorant Garamond',Georgia,serif;
  --face-mono:ui-monospace,Menlo,monospace;
  --face-ui:-apple-system,BlinkMacSystemFont,system-ui,'Noto Sans JP',sans-serif;
  --face-script:'LinguaScript',serif;
  /* A field you type into. LinguaType holds only the private use area, so
     what the Lingua keyboard inserted is drawn and everything else falls
     through to the ordinary face below it. */
  --face-type:'LinguaType',var(--face-ui);
}
:root{--tabh:calc(env(safe-area-inset-bottom,0) + 66px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--face-ui);
     line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
/* iOS treats a page as a document until told otherwise: press and hold and it
   selects a word and raises the magnifier; tap twice quickly and it takes the
   second tap for a zoom gesture and swallows it. On a screen whose whole job
   is tapping and dragging, both are faults. Selection is turned off for the
   chrome and turned back on for the two places text is genuinely read or
   written. */
body,#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable],.mn,.rd,.wordmean,.sentline{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* manipulation keeps scroll and pinch but drops the double-tap-to-zoom that
   was eating every second tap. */
button,select,a,.trow,.entry,.set,.obsrow,.obchb,.obsnd,.obescb{touch-action:manipulation}
.cz{font-family:var(--face-caps)}
.cor{font-family:var(--face-ital)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
/* A screen slides in when you arrive at it. It must NOT slide in again every
   time something on it is tapped -- but every tap redraws the whole view, so
   it did: choose a writing system and the entire screen jumped twelve pixels
   and faded back, which on a phone reads as a shudder. The animation is now
   attached to the arrival, not to the redraw: render() marks the app fresh
   only when the screen it is drawing is a different one. */
/* Opacity only, and no transform -- this is not taste, it is the fix for a
   bug that has been in the app since the animation was written. A transform
   on an element makes it the containing block for every position:fixed thing
   inside it. The bottom button bar is position:fixed and lives inside .view,
   so for the third of a second the slide was running, the bar was positioned
   against the whole page instead of against the screen: it sat wherever the
   content ended, and then snapped to the bottom of the screen when the
   animation finished. That snap is the "the button is somewhere else and then
   drops down the moment it opens" that has been reported three times. */
#app[data-fresh="1"] .view{animation:vin .26s ease-out}
@keyframes vin{from{opacity:0}to{opacity:1}}
button{font-family:inherit;cursor:pointer}

/* ---------- shared parts ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0) + 16px) 24px 0}
.brand{font-family:var(--face-caps);letter-spacing:.22em;font-size:.86rem;color:var(--txs)}
.brand .st{color:var(--gold)}
.iconb{margin-left:auto;width:44px;height:44px;border-radius:0;border:0;background:none;
       color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.iconb:active{opacity:.5}
.gtile .bch{font-size:1.5rem;color:var(--gold);line-height:1}
.gtile .nol{font-size:1.2rem;color:var(--txm);line-height:1}
/* --- a word being built out of its sounds ----------------------------- */
.seqbox{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;
        border:1px solid var(--line);background:var(--pane);border-radius:12px}
.seqbox .seq{flex:1;font-size:1.5rem;letter-spacing:.02em;min-height:1.5rem;color:var(--tx)}
.seqdel{min-width:44px;min-height:44px;background:none;border:0;color:var(--txs);
        display:inline-flex;align-items:center;justify-content:center}
.seqdel:disabled{opacity:.25}
/* The gap has to be wider than the speaker's overhang or the speaker of one
   tile sits on top of the next tile: 44pt of button hanging 11pt past a
   corner, over a 6pt gap, means five points of every tile answered to its
   neighbour's speaker. 「これつまりすぎて誤作動多いな」 Fourteen out, ten
   over -- and the top margin is for the first row's, which hang above it. */
.phkeys{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 16px}
/* A group of the chart, and whether it is open. */
.ipah{display:flex;align-items:center;flex:0 1 auto;min-height:44px;min-width:96px;
  padding:11px 2px;background:none;border:0;
  text-align:left;color:var(--txm);font-size:.86rem;letter-spacing:.06em}
.ipah:active{color:var(--gold)}
.ipah.on{color:var(--tx)}
.ipah::before{content:'\203a';margin-right:.5em;display:inline-block;transition:transform .12s}
.ipah.on::before{transform:rotate(90deg)}
.ipan{margin-left:auto;padding-right:2px;font-size:.76rem;color:var(--txm);opacity:.7}
/* The way to hear one, at the corner of the tile. The BUTTON is 44pt because
   a thumb is; the circle drawn inside it is not, which is the whole point of
   putting it in a corner. */
.phkp{position:relative;display:inline-block}
.phks{position:absolute;top:-10px;right:-10px;width:44px;height:44px;padding:0;
  background:none;border:0;display:flex;align-items:flex-start;justify-content:flex-end}
/* A group's heading, and the way to ask what that group IS. The ? is the
   same badge as the speaker on a tile -- `.phks` again, not a second shape --
   put back in the flow instead of at a tile's corner. */
.ipahr{display:flex;align-items:center;border-bottom:1px solid var(--line)}
/* 44 across and 44 down, whatever the circle inside it looks like: the
   target is what a thumb needs and the ink is not. */
.ipaq{position:static;flex:0 0 44px;width:44px;height:44px;
  justify-content:center;align-items:center}
/* One sound, said in words. */
.ipads{flex:0 0 auto;width:44px;height:44px;background:none;border:0;color:var(--tx);
  font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.ipadw{font-size:1.02rem;line-height:1.7;color:var(--tx);margin:6px 2px 22px}
.ipadl{margin-top:2px}
.ipadr{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 2px;
  border-bottom:1px solid var(--line)}
.ipadn{flex:0 0 auto;font-size:.86rem;color:var(--txm)}
.ipadx{flex:1 1 auto;text-align:right;font-size:1.05rem;color:var(--tx)}
.phkd{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg);color:var(--txm);display:flex;align-items:center;justify-content:center}
.phkd .ic{width:11px;height:11px}
.phks:active .phkd{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.phk{min-width:62px;min-height:70px;border:1px solid var(--line);background:var(--sf);
     border-radius:9px;color:var(--tx);font-size:1.05rem;padding:8px 10px}
.phk:active{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
/* A key with a letter on it. The letter you drew is the face of the key --
   large, and the only thing on it that is yours -- and the sound symbol sits
   small underneath so two letters that look alike can still be told apart.
   The other way round, with the symbol large, the keyboard was a chart of the
   IPA and your own letters were a footnote on it, which is backwards for
   somebody who has just spent an hour drawing them. */
.phk.hasg{display:flex;flex-direction:column;align-items:center;justify-content:center;
          gap:3px;padding:6px 8px}
canvas.pkc{width:34px;height:34px;display:block}
.phk .pkb{font-size:1.5rem;line-height:34px;height:34px;display:block;color:var(--tx)}
/* A sound with no letter yet has nothing else to show, so the symbol is the
   face of the key at full size. Once a letter exists the symbol steps back
   and becomes the small line under it. */
.phk .pks{font-size:1.05rem;color:var(--tx);line-height:1}
.phk.hasg .pks{font-size:.82rem;color:var(--txm);letter-spacing:.02em}
.phk.hasg:active .pks{color:var(--gold)}
/* --- the keyboard, which the language owns ------------------------------
   Rows of keys, and a key is as wide as it was made. Nothing here decides how
   many keys or how big: that is the whole point of the screen that builds it.
   Full width of the screen rather than of the page, because a keyboard that
   stops short of the edge is a picture of a keyboard. */
/* How tall a key is, in one place and in two halves: the whole keyboard's
   height, and this row's share of it. 「マス目の大きさもカスタマイズできる
   ように」 52px is what every key was, so a keyboard nobody has touched is
   the keyboard it was. */
.kb{display:flex;flex-direction:column;gap:6px;margin:2px -20px 0;--kh:52px}
/* THE EDITOR'S board, which is a different thing from the one above and is
   why this is a second class rather than a change to the first. The one
   above is the keyboard AS IT WILL BE -- free's face, board 0's, the row on
   the list -- and it runs to both edges because a keyboard that stops short
   of the edge is a picture of a keyboard.

   The editor is not that picture. It is a sheet you point AT: rows numbered
   down the side, keys lettered across, a key held with a mark hanging off
   its corner. All three of those need room outside the keys, and at full
   bleed there is none -- the ⊖ on the last key of a row hung off the screen,
   which is why it used to sit inside the key.
   「この画面全体に広がるのやめない？8割くらいの大きさで」

   80vw of the phone, centred, so the 10 down each side is where the row's
   number and the ⊖ live. 「エクセルと同じ仕様で作るのよ」

   And the rows are a GRID rather than a row of things that stretch. That is
   the whole of what makes the letters across the top true: every row has the
   same columns, a key one unit wide is one cell, and a key three wide is
   three cells joined -- which is what a wide key already was in the data and
   had no way of looking like. 「別に隣のセルともくっつけるでしょ？」

   The column count is the widest row's, asked of the layout each time and
   stored nowhere. A row that comes to less than that ends in empty cells, and
   that is the one place this drawing and the phone differ: the extension
   divides a row's width by the keys' w (KeyBoardView.swift), so a short row
   stretches there and is short here. Short here is the more useful of the
   two -- it is the row saying it is not full. */
/* Smaller, and ONLY smaller: blow this up and it is the keyboard, which it
   stops being the moment a key is 80% as wide and 100% as tall.
   「比率を変えるだけだって。拡大すれば本物と同じ見た目になればいいんだよ」

   The scale is set by the height and the width follows, rather than the other
   way round, because 44 is the floor for anything a thumb has to hit and a key
   is measured on its height (tools/press.mjs). So: 44/52 of the real key, and
   a width that keeps the shape.

   That comes out at 83vw and it comes out there on every phone, which is the
   only reason a bare vw is honest here. The real key is (100vw - 9 gaps)/10
   wide and 52 tall; this one is 44 tall, so it wants 44/52 of that width, and
   both sides of the sum carry the same vw -- the ratio cancels the screen out.
   The gap goes with it: 5 * 44/52 is 4.2, which is --kbgap, half on each key.

   8割くらい, asked for; 83 is where the shape lands.

   The two numbers are variables because the row of widths UNDER the sheet has
   to be drawn to the same cell as the sheet itself -- a tile that is not the
   size of the thing it makes says nothing about what it makes.
   「1マスとキーボードの1マスのサイズが一緒じゃないから分かりにくいよ」
   kbNewHTML() writes calc() over these two, so the number lives here only. */
:root{--kbw:83vw;--kbgap:4.2px}
.kb.kbsheet{width:var(--kbw);margin:2px auto 0;--kh:44px;gap:5px}
/* No gap between COLUMNS -- a column is half a key, so a gap there would be
   counted twice on a whole key and twelve times on a space bar. The space
   between two keys is the keys' own margin, which is the same 4 whatever they
   span. */
.kb.kbsheet .kbrow, .kbhdr{display:grid;gap:0;position:relative;
     grid-template-columns:repeat(var(--kc, 20), 1fr)}
.kb.kbsheet .kbk{min-width:0;margin:0 calc(var(--kbgap) / 2)}
.kb.kbsheet .kbk.addrow{grid-column:1/-1}
/* The letters across the top and the numbers down the side, and both of them
   are how a whole column and a whole row go. They are 44 tall for that
   reason -- they are targets now, not labels. Neither can be 44 WIDE: a
   column's letter is the width of the column it names, and the row's number
   sits in the margin the board leaves. tools/press.mjs measures both on their
   height for that reason, the same sentence it already says about a key. */
.kbhdr{margin-bottom:1px}
.kbcl{font-size:.55rem;line-height:1;color:var(--txm);opacity:.5;text-align:center;
      min-height:44px;background:none;border:0;padding:0;font-family:inherit;
      display:flex;align-items:center;justify-content:center}
.kbcl:active{color:var(--gold);opacity:1}
.kbcl.on{color:var(--pur);opacity:1;font-weight:700}
/* The row's number, in the margin to the left of the keys -- absolute, so it
   is not a cell: kbReadRows() walks the row's children and this one carries no
   data-r, and it must not take a column from the grid. */
.kbn{position:absolute;left:-28px;top:0;bottom:0;width:26px;display:flex;
     align-items:center;justify-content:flex-end;font-size:.6rem;line-height:1;
     color:var(--txm);opacity:.55;background:none;border:0;padding:0;
     font-family:inherit}
.kbn:active{color:var(--gold);opacity:1}
.kbn.on{color:var(--pur);opacity:1;font-weight:700}
/* What is being worked on, lit BEHIND the keys rather than on them.
   「行とか列選択したらそこが光ってそこを作業してるってわかるようになってる」
   「行とか列選択してるときに後ろ側違う色で光らせないと選択がわかりにくい」

   A band, and a different colour from the gold, because the two mean
   different things and were saying the same one: gold is what is pressable
   and which key you have OPEN, and this is what the buttons above are about.
   The band runs out past the keys on both sides so the row's number stands on
   it -- the number is what was pressed, so it has to be inside what lit up. */
.kb.kbsheet{position:relative}
.kb.kbsheet .kbrow.sel::before{content:"";position:absolute;
     top:-3px;bottom:-3px;left:-32px;right:-6px;background:var(--pursf);
     border-top:1px solid var(--purln);border-bottom:1px solid var(--purln);
     pointer-events:none}
/* A column cannot be a band on one row, so it is one band down the whole
   sheet, put where the column is by kbHTML() -- the columns are 1fr each, so
   where that is is arithmetic and not a measurement. */
.kbband{position:absolute;top:0;bottom:0;background:var(--pursf);
     border-left:1px solid var(--purln);border-right:1px solid var(--purln);
     pointer-events:none;z-index:0}
/* and the keys standing in it are outlined, so a key spanning three columns
   says which of the three it is being counted in */
.kb.kbsheet .kbk.sel{border-color:var(--purln)}
/* A cell of the sheet with no key on it. Not a key and not pressable -- it is
   the part of the row that is not filled, drawn so it can be seen to be
   there. It is a .kbk so that a key being carried can be dropped on it. */
.kbk.cell{background:none;opacity:.35}
/* --kh is this screen's own drawing of a key and is not what goes to the
   phone: the extension decides that, and nothing in the app sets it now. */
.kbrow{display:flex;gap:5px;--rh:1}
/* A KEY keeps its corners, on both boards. 「キーボードは角丸でしょ？そこは
   いいのよ」 The rule against rounded boxes is about a box drawn round a
   word -- a button, a banner, a notice -- and a key is not one of those: it
   is the shape of the thing itself, and every key on every phone has them. */
.kbk{position:relative;min-height:calc(var(--kh) * var(--rh));min-width:0;
     border:1px solid var(--line);
     border-radius:9px;background:var(--sf);color:var(--tx);font-family:inherit;padding:0;
     display:flex;align-items:center;justify-content:center;overflow:hidden}
.kbk:active{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
/* The letter a key types, small in its corner, under the switch in the
   chapter. The four flick faces sit at the middles of the edges, so the corner
   is free even on a key that has all four -- the same reason the system
   keyboard puts it there. */
.kbrm{position:absolute;right:3px;bottom:1px;font-size:.56rem;line-height:1;
      color:var(--txm);opacity:.65;pointer-events:none}
/* A key on the free plan is a span, not a button: there is no editor behind
   it. Lighting up under a thumb would promise one. */
.kbk.ro:active{border-color:var(--line);background:var(--sf);color:var(--tx)}
.kbk.ro.fn:active{background:var(--pane);color:var(--txs)}
.kbk.fn{background:var(--pane);color:var(--txs)}
/* The half key that insets a row. It holds space and shows nothing -- every
   row of the fixed QWERTY comes to ten units so the columns line up, and the
   only way to inset a row is a key that is not one. */
.kbk.gap{background:none;border-color:transparent}
/* A flick direction with nothing on it yet, while the keyboard is being
   built. It is a place, not a letter, so it is a dot rather than a shape. */
.kbf.kbfx{color:var(--txm);opacity:.45}
.kbk.gap:active{background:none;border-color:transparent}
.kbk.on{border-color:var(--gold);background:var(--goldsf)}
.kbc{display:flex;align-items:center;justify-content:center;line-height:1}
.kbc canvas.tc{width:28px;height:28px;display:block}
.kbc .bch{font-size:1.35rem;line-height:1}
.kbl{font-size:1.05rem;color:inherit}
/* What each corner of a key holds, in the corner it comes from -- so a key
   says what it can do without being pressed. */
.kbf{position:absolute;font-size:.62rem;color:var(--txm);line-height:1;pointer-events:none}
.kbf canvas.tc{width:13px;height:13px;display:block}
.kbf .bch{font-size:.7rem;line-height:1}
.kbfup{top:3px;left:50%;transform:translateX(-50%)}
.kbfdown{bottom:3px;left:50%;transform:translateX(-50%)}
.kbfleft{left:3px;top:50%;transform:translateY(-50%)}
.kbfright{right:3px;top:50%;transform:translateY(-50%)}
/* Back a step and forward again, over the sheet. No box round either of them
   -- what is there is the mark, in the colour everything pressable is.
   「角丸きんし」 Down when there is nowhere to go. */
.kbtool{display:flex;gap:2px;align-items:center;margin:2px 0 2px}
/* the two steps at one end, what acts on the selection at the other */
.kbtgap{flex:1 1 auto}
.kbtb{min-width:44px;min-height:44px;background:none;border:0;padding:0;
      color:var(--gold);display:flex;align-items:center;justify-content:center}
.kbtb[disabled]{color:var(--txm);opacity:.28}
.kbtb.on{color:var(--gold);background:var(--goldsf)}
.kbtb.bad{color:var(--bad)}
.kbtb.bad[disabled]{color:var(--txm)}
.kbadd{display:flex;gap:8px;margin-top:12px}
/* THE KEY, on the sheet that edits it: the middle is what it types and the
   four edges are what it flicks to, which is where they are on the key
   itself. A form of five labelled rows said the same five things and showed
   none of them. */
.kbedit{display:grid;grid-template-columns:1fr 1.5fr 1fr;grid-template-rows:1fr 1.5fr 1fr;
        gap:6px;width:100%;max-width:300px;aspect-ratio:1;margin:6px auto 18px}
.kbe{border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--tx);
     font-family:inherit;padding:0;display:flex;align-items:center;justify-content:center;
     overflow:hidden}
.kbe:active{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.kbeu{grid-area:1/2}
.kbel{grid-area:2/1}
.kbec{grid-area:2/2;border-color:var(--goldln);background:var(--goldsf)}
.kber{grid-area:2/3}
.kbed{grid-area:3/2}
/* A slot's shape needs a size, and this was the one place a .tc was shown
   without one. A canvas with no CSS size lays out at its own default width,
   inkCanvases() then makes the bitmap that big, and a glyph drawn to fill a
   900px square inside an 82px button that hides its overflow is a solid block
   of ink. 「文字設定したらこうなるけど？」 */
.kbe canvas.tc{width:42px;height:42px;display:block}
.kbec canvas.tc{width:62px;height:62px}
.kbe .bch{font-size:1.7rem;line-height:1}
.kbec .bch{font-size:2.4rem}
/* A slot with nothing in it is a place, not a thing: dashed and unfilled, so
   the four that are empty do not read as four keys somebody has made. */
.kbsx{color:var(--txm);display:flex;opacity:.65}
.kbe.non{background:none;border-style:dashed}
/* A key that is not a letter has nothing to choose and nothing to flick, so
   it is one square rather than five. */
.kbedit.fn{grid-template-columns:1fr;grid-template-rows:1fr;max-width:150px;aspect-ratio:1}
.kbedit.fn .kbec{grid-area:1/1}
/* How tall the keys are, directly under them. No number and no label: the
   keyboard above is the readout, and it moves as the thumb moves. */
.kbh{padding:10px 0 2px;display:flex}
.kbrng{flex:1 1 auto;min-height:44px;background:none;-webkit-appearance:none;appearance:none}
.kbrng::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:var(--line)}
.kbrng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
     width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--gold)}
.kbrng::-moz-range-track{height:3px;border-radius:3px;background:var(--line)}
.kbrng::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--gold)}
/* A row is added where a row would be. It is drawn as the empty row it is
   about to become, not as a button somewhere else on the screen. */
.kbk.addrow{flex:1 1 auto;color:var(--txm);background:none;
            border:1px dashed var(--line);opacity:.8}
/* A line of the language, typed on the language's own keyboard. `readonly`
   keeps the phone's keyboard from coming up over it -- the keys are on the
   page, and two keyboards at once is one too many. */
/* A textarea now, so a long line wraps instead of leaving the screen. It is
   never dragged bigger by its corner and never scrolls: lnGrow() sets the
   height to the text, so overflow has nothing to hide. */
.lnin{display:block;width:100%;min-height:44px;background:none;
      border:0;border-bottom:1px solid var(--line);resize:none;overflow:hidden;
      border-radius:0;color:var(--tx);padding:11px 2px;font-family:inherit;
      font-size:.98rem;line-height:1.5;outline:none;margin-bottom:6px}
.lnin:focus{border-bottom-color:var(--goldln)}
/* One slot of a key -- the key itself, or one of its four corners -- and what
   is in it. The same row shape either way, because they hold the same thing. */
.kbslot{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;
        background:none;border:0;border-bottom:1px solid var(--line);
        color:var(--tx);font-family:inherit;padding:6px 2px;text-align:left}
.kbslot .sl{flex:0 0 auto;color:var(--txs);font-size:.9rem;min-width:76px}
.kbsv{flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:var(--tx)}
.kbsv canvas.tc{width:30px;height:30px;display:block}
.kbsv .bch{font-size:1.2rem;line-height:1}
/* --- the IPA chart ---------------------------------------------------- */
.ipascroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
.ipascroll table{width:734px}
.ipatab{border-collapse:collapse;width:100%;table-layout:fixed}
/* The row heading is the name of a manner or a height, and some of those are
   long words in some of the ten. Fixed at 44px and told not to wrap, they were
   cut off mid-word. Widening to 58px and adding word-break:break-word stopped
   the cutting and started the breaking -- "approximant" came out as approxi /
   mant, and Russian broke ten of its labels that way. English broke two, which
   is why it read as fixed.
   108px is the widest single word any of the ten has, measured rather than
   guessed: полуоткрытый at 102px plus the padding. Nothing may break inside a
   word now; the chart is wider and it was already a horizontal scroller. */
.ipatab th{font-size:.82rem;color:var(--txm);font-weight:400;text-align:left;
           padding:2px 6px 4px 0;white-space:normal;line-height:1.25;width:108px;
           word-break:normal;overflow-wrap:normal}
.ipatab td{padding:1px;vertical-align:top}
.ph2{width:100%;min-height:44px;border:1px solid var(--line);background:var(--sf);
     border-radius:8px;color:var(--txs);font-size:.95rem;padding:6px 0;margin-bottom:2px;display:block}
.ph2.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
.ph2:active{opacity:.55}
.ipafree{display:flex;flex-wrap:wrap;gap:6px}
.ipafree .ph2{width:auto;min-width:48px;padding:8px 11px}
.ipamine{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px;min-height:44px}
.ipamine b{border:1px solid var(--goldln);background:var(--goldsf);color:var(--gold);
           border-radius:8px;padding:8px 12px;font-weight:400;font-size:1rem}
.ipamine .none{color:var(--txm);font-size:.88rem;align-self:center}
/* Buttons whose mark is drawn rather than typed line it up with the word. */
.back.nb,.play,.rr2,.wctl button,.pvbox button{display:inline-flex;align-items:center;gap:6px}
.back.nb svg,.play svg,.rr2 svg,.wctl button svg,.pvbox button svg{flex:0 0 auto}
.set.signin .sl{display:flex;align-items:center;gap:10px}
.set.signin .sl svg{width:18px;height:18px;flex:0 0 auto}
.back{background:none;border:none;color:var(--txs);font-size:.88rem;
      min-width:44px;min-height:44px;margin-left:-10px;
      display:inline-flex;align-items:center;justify-content:center}
.back:active{opacity:.5}
/* The back button is a bar of its own, directly under .view, so it can stick
   to the top of the screen for the whole of the scroll instead of leaving with
   the first swipe. Its parent has to be the tall element -- a sticky thing
   only sticks inside its own parent's box -- which is why it is no longer
   inside .chead. */
/* Back, and where you are, on one line: 「←目次　Ⅰ 単語」. The chapter used to
   be a second heading below this bar, which meant the name of the page you
   were on was the third thing down and the bar itself said only where you
   would go if you left. */
.navtop{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:baseline;
        gap:9px;padding:calc(env(safe-area-inset-top,0) + 8px) 24px 8px}
.navtop .back{flex:0 0 auto;margin-right:3px}
.navn{font-family:var(--face-ital);font-style:italic;color:var(--gold);font-size:1.06rem}
.navt{font-family:var(--face-caps);font-size:1.12rem;font-weight:600;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navc{margin-left:auto;flex:0 0 auto;font-family:var(--face-ital);
      font-style:italic;color:var(--txm);font-size:.98rem}
/* Where an explanation lives: a mark, not a paragraph on the screen it is
   about. Same weight as the back arrow, at the other end of the same bar. */
.navq{margin-left:auto;flex:0 0 auto;align-self:center;min-height:44px;min-width:44px;
      border:0;background:none;color:var(--txm);font-family:var(--face-caps);
      font-size:1.05rem;font-weight:600}
.navq:active{opacity:.55}
/* Two auto margins would split the free space and stand the count in the
   middle of the bar. The one in front does the pushing. */
.navc + .navq{margin-left:6px}
.navtop:after{content:"";position:absolute;left:0;right:0;top:100%;height:8px;
              background:linear-gradient(180deg,var(--bg),transparent)}
.chead{padding:0 24px 6px}
.chap{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.chap .rn{font-family:var(--face-ital);font-style:italic;color:var(--gold);font-size:1.3rem}
.chap .ct{font-family:var(--face-caps);font-size:1.6rem;font-weight:600}
.chap .cn{margin-left:auto;font-family:var(--face-ital);font-style:italic;color:var(--txm);font-size:1.02rem}
.body{padding:10px 24px calc(var(--tabh) + 90px)}
/* As tall as what is left of the screen, so something can be put at the FOOT
   of it -- against the tab bar, not under the last row and not floating in
   the middle of the space between. The bottom padding goes with it: what is
   pinned down there IS the padding. One screen asks for this. */
.body.tall{display:flex;flex-direction:column;
           padding-bottom:calc(var(--tabh) + 22px);
           min-height:calc(100vh - var(--tabh) - 22px)}
/* ---------- a post ----------
   The row everybody's thumb already knows: face, a bold name with the handle
   and the time in grey beside it, the post, four things spread along the
   bottom, dividers running the whole width. Deliberately NOT the app's serif
   and gold -- those belong to the book side, and a feed that looks like a
   book looks like something you have to learn.

   What is inside it is this app's: three layers, and a word the dictionary
   has never heard of standing in the colour of a problem. */
.post{display:flex;gap:12px;margin:0 -24px;padding:12px 16px;
      border-bottom:1px solid var(--line)}
.pav{flex:0 0 auto;width:40px;height:40px;border-radius:50%;overflow:hidden;
     background:var(--sf);display:flex;align-items:center;justify-content:center}
.pav canvas{width:26px;height:26px}
.pav .bch{font-size:1.05rem;color:var(--txs);line-height:1}
.pbody{flex:1 1 auto;min-width:0}
.phead{display:flex;align-items:center;gap:5px;line-height:1.3}
.pname{font-weight:700;font-size:.95rem;color:var(--tx);
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* What it is written in, beside who wrote it -- the place a timeline puts an
   affiliation, small and quiet, because it is not the name. */
.plangtag{flex:0 0 auto;font-size:.72rem;letter-spacing:.08em;color:var(--gold);
          border:1px solid var(--goldln);border-radius:5px;padding:1px 6px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.phandle,.pdot,.pwhen{flex:0 0 auto;font-size:.9rem;color:var(--txm)}
/* Who you are, at the top of your own page. The block itself is further down,
   under "the profile, above the three lists" -- it was written out twice here,
   and the second one set no `display`, so it inherited `flex` from this one
   and every word on the page stayed in a column beside the face. */
.meedit{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:999px;
        border:1px solid var(--line);background:none;color:var(--tx);
        font-family:inherit;font-size:.88rem}
.meedit:active{border-color:var(--goldln);color:var(--gold)}
/* Following somebody, and the same button once you do. Filled while you are
   not -- it is the thing to press -- and an outline once you are, because
   then it is a state and the press is the undo. */
.meedit.on{background:var(--gold);color:var(--onGold);border-color:var(--gold)}
.phandle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
/* The ... and the menu that hangs off it. The wrapper is what the menu is
   positioned against, so nothing is measured or placed by hand -- it moves
   with the post it belongs to. 「画面遷移じゃなくて投稿の横にメニュー出てきて欲しい」 */
.pmw{margin-left:auto;flex:0 0 auto;position:relative;display:inline-flex}
.pmore{flex:0 0 auto;min-width:44px;min-height:44px;margin-right:-12px;
       background:none;border:0;color:var(--txm);
       display:inline-flex;align-items:center;justify-content:center}
.pmore:active{color:var(--bad)}
/* Under the ... and hard against the right edge of the post. Three rows, and
   the one that cannot be undone is last and red -- where every phone puts it. */
.pmenu{position:absolute;top:100%;right:-12px;z-index:40;min-width:172px;
       padding:6px;border-radius:14px;
       background:var(--bg);border:1px solid var(--line);
       box-shadow:0 10px 30px var(--glassdrop);
       display:flex;flex-direction:column}
.pmi{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;
     color:var(--tx);font-family:inherit;font-size:.92rem;text-align:left;
     display:flex;align-items:center;gap:10px;white-space:nowrap}
.pmi svg{flex:0 0 auto;color:var(--txm)}
.pmi:active{background:var(--sf)}
.pmi.bad,.pmi.bad svg{color:var(--bad)}
/* Who a reply answers. Grey, small, above the line -- it is a label on the
   post, not part of what was said. */
.pto{font-size:.84rem;color:var(--txm);margin-top:1px;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The composer, for somebody who has been ejected. At the top, before the
   field, because finding out after typing is finding out too late. */
.pwout{font-size:.9rem;color:var(--bad);border:1px solid var(--bad);
       border-radius:10px;padding:8px 10px;margin-bottom:10px}
/* ---------- a report, read ----------
   One card per report, and the reason is the small grey line: what a person
   reading these is looking at is what was SAID, not the five words the app
   offered whoever pressed the button. A post already taken down keeps its
   card and loses its weight. */
.mrep{border:1px solid var(--line);border-radius:12px;padding:12px;
      margin-bottom:10px;background:var(--pane)}
.mrep.mdown{opacity:.55}
.mhead{display:flex;justify-content:space-between;gap:8px;
       font-size:.8rem;color:var(--txm);margin-bottom:6px}
.mline{font-size:1.02rem;line-height:1.45;color:var(--tx);
       overflow-wrap:anywhere}
.mnote{font-size:.88rem;color:var(--txs);margin-top:6px;
       overflow-wrap:anywhere}
.mrep .btn{margin-top:10px}
.mnone{color:var(--txm);text-align:center;padding:24px 0}
.mnone.bad{color:var(--bad)}
/* ---------- one conversation ----------
   The post a thread was opened on. It does not go anywhere, so it does not
   look pressable; what marks it is a hairline down its left edge, which is
   the same mark the indent below it uses. Nothing is coloured in: a filled
   row would read as selected, and there is nothing to select here. */
.pfoc{background:var(--sf)}
/* And how deep an answer is. Three steps and then it stops -- past that a
   phone is drawing a column of margin and no room for the words.
   THREAD_IN in post.js is the same number and is the one that decides.

   The wrapper takes over the post's bleed to the edge of the screen, so the
   indent is one number in one place: the post no longer pushes itself left,
   the wrapper does, and what is left is how far in this row starts. */
.pind{margin:0 -24px}
.pind .post{margin:0}
/* Not pind0: a direct answer is the next row down, not a row inside
   anything, and a rail beside it would be a rail beside every reply. */
.pind1 .post,.pind2 .post,.pind3 .post{border-left:1px solid var(--line)}
.pind1{padding-left:14px}
.pind2{padding-left:28px}
.pind3{padding-left:42px}
/* Drawn letters stand at their full height on this line, so 1.45 put the
   rows of a two-line post against each other. 「ここつまりすぎてる」 */
.pline{font-size:1.3rem;line-height:1.7;color:var(--tx);
       margin-top:6px;word-break:break-word}
/* ---------- which way a line runs ----------
   Four of them, and the class is the only place any of it is written down --
   dirClass() in wsys.js names one and nothing else sets `direction` or
   `writing-mode` by hand.

   The two horizontal ones are `direction`, which is what it is for. The two
   vertical ones are `writing-mode`, and -rl / -lr is which side the FIRST
   column is on -- so vertical-rl starts at the right and adds columns
   leftwards, the way Japanese does.

   In a vertical writing mode the inline axis is the vertical one, so
   `max-height` is what says where a line wraps into a second column, and
   `height:auto` lets a short post be a short column instead of a tall empty
   box. `vertical-align` is on the other axis there too: it centres each
   letter across the column, which is what stops a narrow letter from hanging
   off the left of a wide one. */
.dir-ltr{direction:ltr}
.dir-rtl{direction:rtl}
.dir-ttb-rl{-webkit-writing-mode:vertical-rl;writing-mode:vertical-rl}
.dir-ttb-lr{-webkit-writing-mode:vertical-lr;writing-mode:vertical-lr}
/* `width:100%` is what puts the first column on the right for vertical-rl and
   on the left for vertical-lr. Left to itself the box shrinks to its columns
   and is then placed at the LEFT by the horizontal parent it sits in, so a
   right-to-left language began at the left of the phone -- which is the one
   thing choosing right-to-left is asking not to happen.

   And then the padding, because 100% put the first column hard against the
   edge of the post: a column of letters with the whole width of a phone empty
   beside it and nothing between it and the screen.
   「めちゃくちゃ右端すぎませんか」「余白欲しい。横書きのツイートの1番右のところ
   から始めるイメージ」 -- so it begins where a line of horizontal text would
   END, which is one gutter in from the edge, on whichever side the language
   starts from. */
.dir-ttb-rl,.dir-ttb-lr{-webkit-text-orientation:upright;text-orientation:upright;
                        width:100%;height:auto;max-height:340px}
/* A field somebody types a column into. The height is the page's to give --
   a column has to be told how long it is, the way a horizontal one is told
   how wide -- and lnFit() measures the width, which is the way it grows. */
/* A FIELD is not a post's line, and the two rules above are the line's: a
   width of 100% and a max-height of 340 are how a column of somebody else's
   post wraps and where it sits. On a field they are wrong in both directions
   -- the height is the layout's to give, and 340 is a cap the flex line then
   could not grow past, which is why the meaning and the pictures sat below
   the fold with empty space above them. */
.lnin.dir-ttb-rl,.lnin.dir-ttb-lr{display:block;min-width:1.6em;max-width:100%;
   width:auto;height:auto;max-height:none;
   resize:none;border-bottom:0;padding:2px 12px;overflow:auto}
/* The rule goes on the side the columns come FROM, and the field is pushed to
   that side -- a right-to-left column starts at the right edge of the page,
   which is where somebody writing one looks first. */
.lnin.dir-ttb-rl{margin-left:auto;border-right:1px solid var(--line)}
.lnin.dir-ttb-lr{margin-right:auto;border-left:1px solid var(--line)}
.lnin.dir-ttb-rl:focus{border-right-color:var(--gold)}
.lnin.dir-ttb-lr:focus{border-left-color:var(--gold)}
.dir-ttb-rl{padding-right:14px}
.dir-ttb-lr{padding-left:14px}
.dir-ttb-rl .tcln,.dir-ttb-lr .tcln{vertical-align:middle}
/* One letter of somebody's line. Square, because a drawn letter is drawn in a
   square, and sized off the line rather than in pixels so it sits on the same
   baseline as the spaces and full stops around it. */
/* A letter on a line of a post. The height is the font's: otf5's cell is 800
   of a 1000 em and its base is 800, so the drawing is eight tenths of the
   size and its foot IS the baseline -- which is why this sits on the baseline
   rather than being nudged under it. The width is left to the canvas: inkLine
   gives each one its own advance, and a canvas with a height and no width is
   as wide as its own ratio says. */
.tcln{display:inline-block;vertical-align:baseline;width:auto;height:1em}
/* The widgets, as they come out, in the room that makes the signs they are
   made of. No frame and no corner: iOS draws a widget's own ground, and this
   is not the app drawing a box. */
.numwrow{display:flex;gap:22px;align-items:center;margin:10px 0 2px}
.numwf,.numwd{position:relative;width:118px;height:118px;flex:0 0 auto}
.numwn{position:absolute;transform:translate(-50%,-50%);line-height:1;
       white-space:nowrap;color:var(--tx)}
.numwh{position:absolute;inset:0;width:100%;height:100%}
.numwh line{stroke:var(--tx);stroke-linecap:butt}
.numwc{fill:var(--tx)}
.numwt{fill:var(--tx);opacity:.28}
.numwd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.numwbig{line-height:1;white-space:nowrap;color:var(--tx)}
.numwsm{line-height:1;white-space:nowrap;color:var(--tx);opacity:.55}
.numrm{display:inline-block;font-size:.62em;line-height:1}
.numwhow{margin-top:2px}
.pmn{font-size:1.0rem;line-height:1.5;color:var(--txs);margin-top:8px}
.pgl,.pwgl{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:6px}
.pwg{font-size:.76rem;color:var(--txm)}
.pwg.none{color:var(--bad)}
/* Spread edge to edge under the post, the way a thumb expects to find them. */
/* Edge to edge under the post, the way a thumb expects to find them. */
.pacts{display:flex;justify-content:space-between;margin:2px -8px -10px -10px}
.pact{min-width:44px;min-height:44px;padding:0 6px;background:none;border:0;
      color:var(--txm);display:inline-flex;align-items:center;gap:5px}
.pact .pn{font-size:.8rem;min-width:8px;text-align:left}
.pact:active{color:var(--gold)}
.pact.on{color:var(--gold)}
/* Writing one wears the same face and the same type as the things around it. */
/* The button that finishes it, filled, at the end of the bar. */
.navdo{margin-left:auto;align-self:center;flex:0 0 auto;min-height:44px;min-width:44px;
       padding:0 20px;border:0;border-radius:999px;background:var(--gold);
       color:var(--onGold);font-family:inherit;font-size:.92rem;font-weight:700}
.navdo:active{opacity:.75}
.pwto{font-size:.86rem;color:var(--txm);margin-bottom:8px}
.pwtop{display:flex;gap:12px;margin-bottom:6px}
.pwfield{flex:1 1 auto;min-width:0}
.pwfield input, .pwfield textarea{width:100%;background:none;border:0;color:var(--tx);
               font-family:inherit;font-size:1.2rem;line-height:1.5;min-height:44px;padding:0;
               resize:none;overflow:hidden}
.pwfield input:focus, .pwfield textarea:focus{outline:none}
/* How much of the post is left, and only once it is worth knowing. It is a
   number and nothing else, so there is no sentence in it to translate. */
.pwleft{font-size:.8rem;color:var(--txm);text-align:right;margin-top:2px}
.pwleft.bad{color:var(--bad)}
.pwmn{margin-top:10px;font-size:1.02rem !important;color:var(--txs) !important}
/* Over the feed, above the bar, under the thumb already holding the phone. */
.fab{position:fixed;right:20px;bottom:calc(var(--tabh) + 20px);
     z-index:26;width:56px;height:56px;border-radius:50%;border:0;
     background:var(--gold);color:var(--onGold);
     box-shadow:0 10px 26px var(--glassdrop);
     display:flex;align-items:center;justify-content:center}
.fab:active{opacity:.75}
.fab .ic{width:22px;height:22px}
/* ---------- a list being read in ----------
   The table scrolls sideways rather than the page: a spreadsheet has as many
   columns as it has, and a phone has one width. */
/* A shadow at whichever edge has more table behind it, and none when the
   whole sheet already fits. A spreadsheet's fourth column sitting silently
   off the right of a phone is how a column nobody looked at gets imported.
   The `local` layers scroll with the content and cover the `scroll` ones at
   the ends, so this needs no measuring and no JavaScript. */
.imptab{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
        border-radius:12px;margin-bottom:12px;
        background:
          linear-gradient(to right, var(--pane) 40%, transparent) left/34px 100% no-repeat local,
          linear-gradient(to left,  var(--pane) 40%, transparent) right/34px 100% no-repeat local,
          radial-gradient(farthest-side at 0 50%,   var(--glassdrop), transparent) left/13px 100% no-repeat scroll,
          radial-gradient(farthest-side at 100% 50%, var(--glassdrop), transparent) right/13px 100% no-repeat scroll,
          var(--pane)}
.imptab table{border-collapse:collapse;font-size:.88rem;white-space:nowrap}
.imptab th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.imptab th select{min-height:44px;background:none;border:0;border-bottom:1px solid var(--goldln);
                  border-radius:0;color:var(--gold);font-family:inherit;font-size:.88rem;padding:0 2px}
.imptab .impcap{font-size:.76rem;color:var(--txm);margin-top:4px;max-width:150px;
                overflow:hidden;text-overflow:ellipsis}
.imptab td{padding:7px 10px;color:var(--txs);border-bottom:1px solid var(--line2);
           max-width:190px;overflow:hidden;text-overflow:ellipsis}
/* A page's signs side by side, at a size you can judge. */
.numsm{flex:0 0 auto;width:26px;height:26px;margin-right:2px}
span.numsm{font-size:1.1rem;line-height:26px;text-align:center;color:var(--tx)}
.impsum{display:flex;flex-wrap:wrap;gap:16px;margin:2px 2px 12px}
/* What to do about the words that are already here, beside how many there
   are, because the choice is about those and about nothing else. */
.impdup{display:flex;align-items:center;gap:14px;margin:0 2px 4px}
.impdup .impn{flex:0 0 auto;font-size:.92rem;color:var(--txs)}
.impdup .segs{margin:0;flex:1 1 auto;justify-content:flex-end}
.impsum span{font-size:.92rem;color:var(--txs)}
.impsum b, .impdup b{font-family:var(--face-ital);font-size:1.3rem;
          color:var(--gold);font-weight:600;margin-right:6px}
/* The file button holds the input on top of itself, invisible and the whole
   size of it, because a native file control cannot be styled and a hidden one
   cannot be pressed. */
.impfile{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
         width:100%;min-height:52px;margin-top:10px;border:1px solid var(--goldln);
         border-radius:11px;background:var(--goldsf);color:var(--gold);font-size:.94rem}
.impfile input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
.impbig{font-family:var(--face-ital);font-size:1.6rem;text-align:center;
        padding:26px 0 4px;color:var(--tx)}
/* ---------- the card ----------
   The picture is 1080 square whatever the phone is; the preview is however
   wide the sheet is. Nothing here says what is drawn on it -- that is
   www/card.js -- and nothing there says how big it looks. */
/* No border and no ground of its own: the picture already has both, and a
   box drawn round it was a fourth frame inside three. */
.cardbox{border-radius:14px;overflow:hidden}
.cardc{display:block;width:auto;height:auto;max-width:100%;max-height:52vh;margin:0 auto}
/* ---------- the door ----------
   The name, a rule under it, and then the app. Nothing moves except the
   rule drawing itself, because a spinner says "this is slow" and this is
   not slow -- it is a moment on purpose. */
#splash{position:fixed;inset:0;z-index:900;background:var(--bg);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
        transition:opacity .38s ease}
#splash.off{opacity:0;pointer-events:none}
.splbrand{font-family:var(--face-caps);font-size:1.5rem;letter-spacing:.42em;
          text-indent:.42em;color:var(--tx)}
.splbrand .st{color:var(--gold)}
.splrule{width:0;height:1px;background:var(--goldln);animation:splr .85s ease-out forwards}
@keyframes splr{from{width:0}to{width:132px}}
/* ---------- the three tabs ----------
   Only the three roots carry this. On an inner page the thing at the bottom
   of the screen is that page's own button, and a tab bar under it would be
   two bars competing for the same thumb.

   It floats clear of the bottom edge rather than sitting on it, because the
   page has to run underneath for the glass to have anything to refract. The
   blur is behind an @supports: a webview that cannot blur gets --glassop, a
   solid surface, instead of a transparent bar with the text showing through. */
.tabbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0) + 10px);
        z-index:25;max-width:420px;margin:0 auto;display:flex;gap:4px;padding:5px;
        border-radius:999px;background:var(--glassop);border:1px solid var(--glassrim);
        box-shadow:inset 0 1px 0 var(--glassspec), 0 12px 32px var(--glassdrop)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  /* Thin enough to see the page through, and blurred hard enough that what
     shows through is a colour rather than a word. It was .58 over a 22px
     blur, which is a tinted panel: nothing came through it, so it was glass
     by name only. 「リキッドグラスって下に透ける形なのにそれがなってない」
     The saturate is what keeps the colour underneath alive at that alpha. */
  .tabbar{background:var(--glass);
          -webkit-backdrop-filter:blur(16px) saturate(190%);
          backdrop-filter:blur(16px) saturate(190%)}
}
/* The mark alone. 「下タブにホームとかつけるのやめない？」 The label went
   beside the icon first, which pushed it off centre, then under it, which is
   what a phone's bottom bar is -- and it is still five words across a bar
   whose five drawings already say it. The name is on the button as its
   aria-label, so nothing is lost to somebody who cannot see the drawing.

   The pill comes down with them -- 52 to 46 -- because 52 was two lines of
   content and one of them has gone; a bar of glass six times the height of
   the mark inside it reads as a bar with something missing. 46 is still
   clear of the 44pt floor `press` holds every target to. --tabh moves with
   it, 72 to 66, because every screen's foot is measured from that. */
.tab{flex:1 1 0;min-width:0;min-height:46px;background:none;border:0;color:var(--txm);
     border-radius:999px;display:flex;align-items:center;justify-content:center;
     font-family:inherit;padding:5px 2px;transition:color .18s,background .18s}
/* the lens: the one tab you are on is a solid pill inside the glass */
.tab.on{color:var(--gold);background:var(--goldsf);
        box-shadow:inset 0 0 0 1px var(--goldln), inset 0 1px 0 var(--glassspec)}
/* A form that is one screen. The composer asks for it: a column of text was
   pushing the meaning and the row of pictures off the bottom, so the button
   you were about to press was somewhere you had to go and find.
   「この中に1画面収めてうごかないようにしてほしい」

   The field takes what is left after everything under it has had its height,
   and scrolls inside itself rather than growing -- which is why lnFit()
   leaves a `fitin` field alone. Same shape as .view.fixed below; it is not
   the same rule, because that one is about a page and this one is about
   which child gets the slack. */
/* Pinned to the part of the page that can actually be SEEN, not to the
   document. iOS does not shrink the page for the keyboard -- it slides the
   keyboard over it and then scrolls the layout viewport up to put the focused
   field above it, which carries the bar with Post on it off the top of the
   screen. --vvtop is visualViewport.offsetTop, so the screen stays where it
   is whether the keyboard is up or down, and the bar does not move when it
   goes down. 「上のポストと戻るボタンは画面上部に固定で動かない」 */
/* The height is --vvmin -- the smallest the visible part has been, which is
   what it is with the keyboard UP -- and not --vvh. A screen laid out to
   --vvh is re-laid-out every time the keyboard goes down: the field takes the
   room the keyboard gave back, and the meaning and the row of pictures slide
   to the foot of the phone. 「キーボードをおろしても位置は動かない」 With
   --vvmin the screen is the same screen either way; with the keyboard down
   there is simply black under it. */
.view.fit{position:fixed;left:0;right:0;top:var(--vvtop,0px);
   height:var(--vvmin,55vh);
   display:flex;flex-direction:column;overflow:hidden}
/* No room left at the foot for the bar of tabs, because there is no bar of
   tabs: a screen that is one screen has nowhere else to be, and where you
   are is not a question anybody is asking while they write a post.
   「投稿画面にはホーム画面とかの下タブは要らない」 */
/* The body holds two children and gives all the slack to the first: what is
   being written scrolls, and the bar under it does not. */
.view.fit .body{flex:1;min-height:0;display:flex;flex-direction:column;
   padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);overflow:hidden}
/* Everything you are writing, and it is the part that scrolls -- so the line
   can be as long as it likes and the photographs under it move down with it,
   the way they do on Twitter. 「文字が増えたら画像が下にいく仕様にして」
   Before this the field was the only thing that could stretch, so it took the
   whole screen and the strip of photographs sat under the fold. */
.view.fit .pwscroll{flex:1;min-width:0;min-height:0;overflow:auto}
.view.fit .pwtop{min-height:0}
.view.fit .pwfield{display:flex;flex-direction:column;min-width:0}
/* As tall as its text -- lnFit says how tall; this only stops it widening
   past the column it is in. */
.view.fit .pwfield .lnin{max-width:100%;min-height:44px}
/* A column grows the other way: its height is the page's to give and its
   WIDTH is what runs out. Capped at the column and scrolling inside itself --
   without the cap a long line walked off the side of the phone.
   「縦書きの時文字数突破したら画面外にいくけどありえないから」 */
.view.fit .pwfield .lnin.dir-ttb-rl,
.view.fit .pwfield .lnin.dir-ttb-lr{
   height:calc(var(--vvmin,55vh) - 230px);min-height:150px;
   max-width:100%;overflow:auto}
/* The one thing that does not scroll: the row that adds a photograph or a
   voice, and how much of the line is left. It is the last child of the form,
   so it sits on the keyboard whatever is above it.
   「写真と音声とかのボタンはTwitterと同じようにキーボード上に固定して」 */
.pwbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;
   padding:6px 2px 0;border-top:1px solid var(--line);min-height:52px}
.pwbleft{margin-left:auto;padding-right:6px;font-size:.82rem;color:var(--txm)}
/* The cover does not scroll. 「ホームもスクロールさせるな固定させてくれ」 */
.view.fixed{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.cover{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;
       padding:0 30px calc(var(--tabh) + 12px);text-align:center}
/* What the language is for, on the cover, because that is where what a book
   is about belongs. */
.wldrow{display:flex;align-items:center;gap:8px;width:100%;margin-top:14px;
        min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;
        background:none;color:var(--txs);font-family:inherit;font-size:.88rem}
.wldrow:active{border-color:var(--goldln)}
.wldl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wldl.none{color:var(--txm)}
.cvrow{display:flex;gap:8px;margin:16px 0 6px}
.cvst{flex:1;min-height:56px;background:none;border:1px solid var(--line);border-radius:10px;
      padding:9px 4px;color:var(--tx);font-family:inherit;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cvst:active{border-color:var(--goldln);color:var(--gold)}
.cvv{font-family:var(--face-ital);font-style:italic;font-size:1.14rem}
.cvl{font-size:.82rem;color:var(--txm);letter-spacing:.06em}
/* ---------- I. sounds, II. letters ----------
   A sound is a row: the sound itself, the letters that write it, and the two
   ways to add one. A letter is a cell, because there are as many letters as
   somebody decides there are. */
.sndlist{border-top:1px solid var(--line)}
.sndrow{display:flex;align-items:center;gap:9px;padding:9px 0;
        border-bottom:1px solid var(--line)}
.sndp{flex:0 0 auto;min-width:56px;min-height:48px;border:1px solid var(--line);border-radius:9px;
      background:var(--sf);color:var(--tx);font-size:1.06rem}
.sndp:active{border-color:var(--goldln);color:var(--gold)}
.sndls{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* The alphabet: one cell per letter, the shape and what it is called, as many
   across as the screen holds. A row per letter was a thumb high each and read
   as a settings screen at seven letters and as a scroll at forty.
   `moving` is on the grid while a letter is being carried, so the page under
   the finger does not scroll away from it. */
.ltgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px;margin-top:14px}
/* Room for the corner marks while the alphabet is held, and only then. */
.ltgrid.held{margin-top:10px;overflow:visible}
.ltgrid.moving{touch-action:none}
.ltc{position:relative;min-height:100px;display:flex;flex-direction:column;
     align-items:center;justify-content:center;
     gap:6px;padding:10px 4px 8px;background:var(--pane);border:1px solid var(--line);
     border-radius:14px;color:var(--tx);font-family:inherit}
/* Hearing a letter, at its corner -- the same button, in the same place, as
   the speaker on a symbol of the chart, because it is the same question.
   Ten points out over a fourteen point gutter, so it reaches nothing beside
   it: the chart had them six apart and every tile answered to its
   neighbour's speaker. */
.ltsay{position:absolute;top:-10px;right:-10px;width:44px;height:44px;padding:0;
   background:none;border:0;display:flex;align-items:flex-start;justify-content:flex-end;
   z-index:4;color:var(--txm)}
.ltsay .phkd{pointer-events:none}
.ltc:active{border-color:var(--goldln)}
.ltcf{height:38px;display:flex;align-items:center;justify-content:center}
.ltc canvas.tc{width:38px;height:38px;display:block}
.ltc .bch{font-size:1.6rem;line-height:1}
.ltc .nol{color:var(--txm);display:inline-flex}
.ltcn{display:block;font-family:var(--face-caps);font-size:.95rem;color:var(--txs);
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltc.dup .ltcn{color:var(--bad)}
/* What it reads, under what it is called. Empty for a letter that reads
   nothing, and it keeps its line either way so a grid of cells does not go
   ragged as sounds are given out. */
.ltcr{display:block;min-height:1em;font-size:.72rem;color:var(--txm);
      max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The same cell, as something to pick rather than to browse. A word is
   spelled by pressing letters one after another, so what matters is how many
   fit on a screen and how far the thumb travels -- not how well each one is
   presented. 44pt is the floor and this is 52.

   A letter with nothing drawn on it shows only its name here. The pen on the
   alphabet page means "this one is waiting for you"; in the middle of
   spelling a word it means nothing, and twenty-eight of them mean less. */
.ltgrid.ltpick{grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px}
.ltgrid.ltpick .ltc{min-height:52px;padding:5px 2px 4px;gap:2px;border-radius:10px}
.ltgrid.ltpick .ltcf{height:24px}
.ltgrid.ltpick .ltc canvas.tc{width:24px;height:24px}
.ltgrid.ltpick .ltc .bch{font-size:1.05rem}
.ltgrid.ltpick .ltcn{font-size:.8rem}
.ltgrid.ltpick .nol{display:none}
/* Picked up: it rides over the others and follows the finger. */
.ltc.lift{position:relative;z-index:3;border-color:var(--gold);box-shadow:var(--shadow)}
/* Held, the way a phone's home screen is held. The keyframes are the
   keyboard's -- one wobble, both grids -- and only the selector is new,
   because a `.kbk` rule cannot reach a `.ltc`. */
.ltc.wob{animation:kbwob .28s linear infinite}
.ltc.wob:nth-child(2n){animation-delay:.09s}
.ltc.wob:nth-child(3n){animation-delay:.05s}
@media (prefers-reduced-motion:reduce){.ltc.wob{animation:none}}
/* A little outside the corner, the way a home screen's is. 「内側じゃなくて
   ちょい外側がいい」 The keyboard's sits INSIDE its key and that is not the
   same choice made twice: the keyboard runs to both edges of the phone, so a
   mark hanging off the last key of a row hangs off the screen. This grid has
   a gutter on every side, so there is somewhere for it to hang. Six points
   out, and the grid is given the same six at the top so the first row's marks
   do not sit on the row above them. */
.ltx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;
     background:var(--tx);color:var(--bg);display:flex;align-items:center;
     justify-content:center;z-index:4}
.ltx svg{width:13px;height:13px}
.sndadd{width:44px;height:44px;flex:0 0 auto;border:1px dashed var(--line);border-radius:9px;
        background:none;color:var(--txm);
        display:inline-flex;align-items:center;justify-content:center}
.sndadd:active{border-color:var(--goldln);color:var(--gold)}
.sndx{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
      display:inline-flex;align-items:center;justify-content:center}
.sndx:active{color:var(--gold)}
/* A clash, said where it happens. Two letters reading the same unit is not an
   error -- the font takes the first and the second is simply never drawn --
   but nothing on the screen said which was which. */
.ltdup{display:block;font-size:.84rem;color:var(--bad);margin-top:2px}
/* What the server said, where it was asked. */
.obmsg{color:var(--bad);font-size:.9rem;margin-top:10px}
/* What this letter is in the alphabet, when another letter already says
   the same. Shown, not refused. */
.field input.dup{color:var(--bad);border-color:var(--bad)}
.ltck{flex:0 0 auto;width:40px;text-align:center;color:var(--gold)}
.phk.on{border-color:var(--goldln);background:var(--goldsf);color:var(--gold)}
/* ---------- a word, spelled ----------
   Each position is the letter and, under it, what it says here. A position
   saying something other than the letter's own reading is marked, because a
   sound change is the one thing on this row worth noticing. */
.spellrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:60px;
          padding:8px 10px;border:1px solid var(--line);background:var(--pane);border-radius:12px}
.spc{min-width:48px;min-height:52px;border:1px solid var(--line);border-radius:9px;
     background:var(--sf);color:var(--tx);padding:5px 6px;
     display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.spc.odd{border-color:var(--purln);background:var(--pursf)}
.spf{display:inline-flex;align-items:center;justify-content:center;height:26px;font-size:1.2rem}
.spf canvas.tc{width:26px;height:26px;display:block}
.spf .bch{font-size:1.2rem;line-height:1}
.spu{font-size:.82rem;color:var(--txm);line-height:1}
.spc.odd .spu{color:var(--pur)}
.spnone{flex:1;color:var(--txm);font-size:.88rem}
.spellrow .seqdel{margin-left:auto}
.spbig{display:flex;align-items:center;justify-content:center;height:96px;font-size:2.4rem;
       margin-bottom:14px;color:var(--tx)}
.spbig canvas.tc{width:80px;height:80px;display:block}
.phk.own{border-color:var(--goldln)}
/* A label on an example, so a pair reads as a comparison. */
.exlb{display:inline-block;font-size:.82rem;letter-spacing:.08em;color:var(--gold);
      border:1px solid var(--goldln);border-radius:5px;padding:2px 6px;margin-bottom:5px}
.exadd .exsm{flex:0 0 96px;min-height:44px}
/* ---------- what an entry still had not got ----------
   A synonym or an opposite, as a word you can walk to. An example, as a line
   with its meaning under it. */
.rels{display:flex;flex-wrap:wrap;gap:7px}
.rel{border:1px solid var(--line);border-radius:9px;background:var(--pane);
     padding:8px 11px;min-height:44px;color:var(--tx);text-align:left;font-family:inherit}
.rel:active{border-color:var(--goldln)}
.relw{display:block;font-family:var(--face-caps);font-size:.96rem}
.relm{display:block;font-family:var(--face-ital);font-style:italic;
      font-size:.88rem;color:var(--txm);margin-top:1px}
.exlist{border-top:1px solid var(--line);margin-bottom:10px}
.exrow{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line)}
.exb{flex:1;min-width:0}
.exl{display:block;font-family:var(--face-caps);font-size:1rem}
.exg{display:block;font-family:var(--face-ital);font-style:italic;
     font-size:.88rem;color:var(--txs);margin-top:2px}
.exadd{display:flex;flex-wrap:wrap;gap:7px}
.exadd input{flex:1 1 100%;min-width:0;min-height:44px;background:none;border:0;
             border-bottom:1px solid var(--line);
             border-radius:0;padding:11px 2px;color:var(--tx);font-family:inherit;
             font-size:.92rem;outline:none}
.exadd input:focus{border-bottom-color:var(--goldln)}
.exadd .btn{flex:0 0 auto}
.entry.on{background:var(--goldsf)}
/* ---------- the abugida bench ----------
   Every consonant wearing one vowel, at a size you can judge. Three across
   at 320px and four above it: fewer and you cannot compare, more and each is
   too small to see what the mark is doing. */
.abmark{border:1px solid var(--goldln);background:var(--goldsf);border-radius:12px;
        padding:12px 13px;margin-top:10px}
.abmh{font-size:.84rem;color:var(--gold);letter-spacing:.06em;margin-bottom:9px}
.abctl{display:flex;flex-wrap:wrap;gap:6px}
.abctl button{min-width:46px;min-height:44px;border:1px solid var(--line);border-radius:9px;
              background:var(--pane);color:var(--txs);font-family:inherit;font-size:.86rem;
              display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 10px}
.abctl button:active{border-color:var(--goldln);color:var(--gold)}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.abcell{border:1px solid var(--line);border-radius:10px;background:var(--pane);
        padding:8px 4px 6px;color:var(--tx);
        display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.abcell.own{border-color:var(--goldln)}
.abcell canvas.tc{width:60px;height:60px;display:block}
.abu{font-size:.82rem;color:var(--txm);letter-spacing:.03em}
.abcell.own .abu{color:var(--gold)}
/* ---------- search, the tab ---------- */
.fcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.fcard.soon{border-style:dashed;opacity:.62}
.fch{font-family:var(--face-caps);font-size:1rem;margin-bottom:6px}
.note{color:var(--txm);font-size:.86rem;line-height:1.75}
/* A photograph of the settings screen a step lands on, at the width of the
   page, with the corners of a screenshot. */
/* One sound of the language: the symbol, the letters that say it, and the way
   to take it out. A sound nothing reads is not an error -- it is a phonology
   somebody is partway through -- so the empty case is a quiet line and not a
   warning. */
.sndrow{display:flex;align-items:center;gap:12px;padding:10px 2px;
        border-bottom:1px solid var(--line)}
.sndsym{min-width:44px;min-height:44px;border:0;background:none;color:var(--tx);
        font-family:var(--face-ital);font-size:1.3rem}
.sndlts{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
/* Shown, not pressed. Joining a sound to a letter is the letter's, in one
   place -- two directions for one fact is what closed the old sound chapter. */
.sndlt{min-height:36px;min-width:36px;border:1px solid var(--line);border-radius:9px;
       background:var(--sf);color:var(--tx);font-family:inherit;padding:0 8px;
       display:inline-flex;align-items:center;justify-content:center}
/* ltInk() returns a canvas with no size of its own -- every place that shows
   a letter says how big. 26 is the size of a letter standing in a row of
   text, which is what this is. */
.sndlt .tc{width:26px;height:26px;display:block}
.sndlt .bch{font-size:1.05rem;line-height:1}
.sndnone{color:var(--txm);font-size:.86rem}
.sndx{flex:0 0 auto;min-width:44px;min-height:44px;border:0;background:none;color:var(--txm)}
/* Which part of speech the dictionary is filtered to: one row that says the
   answer and opens the list, where twelve tabs used to scroll sideways. */
/* The filter and the order, side by side. */
.wfilrow{display:flex;align-items:stretch;gap:10px}
.wfilrow .wfil{flex:1 1 auto;min-width:0}
.wsrt{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;
  padding:0 14px;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--txm);font-size:.9rem;font-family:inherit}
.wsrt:active{color:var(--gold)}
.wfil{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;
      padding:8px 2px;border:0;border-bottom:1px solid var(--line);
      background:none;color:var(--tx);font-family:inherit;text-align:left}
.wfilv{font-size:.95rem}
.wfil .ic{margin-left:auto;color:var(--txm)}
.set .sl.on{color:var(--gold);font-weight:600}
/* A photograph of iOS's own screen with the row to press ringed on it. The
   ring is the whole of what makes it an instruction rather than a picture,
   so it is drawn over the image rather than baked into the file -- the
   numbers are kbShot()'s and a photograph taken again is one line to move. */
.kbshot{position:relative;display:block;margin-top:10px;line-height:0}
.kbshot img{display:block;width:100%;height:auto}
.kbring{position:absolute;left:3.5%;right:3.5%;border:2px solid var(--gold);
        border-radius:12px;pointer-events:none}
/* One step of putting the keyboard on the phone: a number, what to do, and
   either the path or the button that gets there. */
.kbstep{margin:0 0 22px}
.kbstepn{font-family:var(--face-ital);font-style:italic;
         color:var(--gold);font-size:1.1rem}
.kbstept{font-size:1rem;color:var(--tx);margin:2px 0 6px}
/* Whether what this chapter builds ever reached the phone. In the `?` sheet
   now, with the steps it belongs to. */
.kbout{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
       background:var(--pane)}
.kbout.bad{border-color:var(--bad);color:var(--bad)}
.sec{font-size:.82rem;letter-spacing:.28em;color:var(--txm);text-transform:uppercase;margin:28px 0 10px}
.sec.secadd{display:flex;align-items:center;margin-right:-8px}
.secplus{margin-left:auto;min-width:44px;min-height:44px;background:none;border:0;padding:0;
  color:var(--gold);display:flex;align-items:center;justify-content:center}
.secplus:active{opacity:.55}
/* The wide tracking is what makes a Latin small-caps heading read as a
   heading. Han and hangul are already square and evenly set; tracking them
   just pulls the word apart, so those three languages get none, and a size
   that carries without the capitals trick. */
html[lang="ja"] .sec, html[lang="zh"] .sec, html[lang="ko"] .sec{letter-spacing:.02em;font-size:.86rem}
.card{background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:18px auto 0}

/* ---------- the title page (home) ---------- */
.title{padding:34px 30px 20px;text-align:center}
.tkick{font-size:.82rem;letter-spacing:.34em;color:var(--txm);text-transform:uppercase;margin-bottom:14px}
/* An inline-flex button inside a centred column is only as wide as its own
   text and sits at the left edge of it. 「作成中の言語（左寄せになってるから真ん中
   寄せに。）」 -- it is the one thing on this screen the eye lands on first. */
.tname{font-family:var(--face-caps);font-weight:600;font-size:2.2rem;line-height:1.15;
       display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
       background:none;border:none;color:var(--tx);min-height:44px}
.tname .pen{font-size:.84rem;color:var(--txm);display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px}
/* The reading under the language name was purple, and purple means two
   other things here -- the PLUS tag, and a sound that changed in one word.
   It means neither on the cover, so it was a colour saying something untrue
   on the first screen you see. */
.tsub{font-family:var(--face-ital);font-style:italic;font-size:1.1rem;color:var(--txs);margin-top:6px}
.toc{margin-top:14px}
.trow{display:flex;align-items:baseline;gap:12px;padding:16px 2px;width:100%;background:none;border:none;color:var(--tx);text-align:left}
.trow:active{opacity:.55}
.trow .rn{font-family:var(--face-ital);font-style:italic;color:var(--gold);font-size:1rem;width:26px;flex:0 0 auto}
.trow .rt{font-size:1.1rem;font-weight:500}
.trow .lead{flex:1;border-bottom:1px dotted var(--dot);transform:translateY(-3px)}
.trow .rv{font-family:var(--face-ital);font-size:1.02rem;color:var(--txs);flex:0 0 auto}
.recent{margin-top:24px;background:var(--pane);border:1px solid var(--line);border-radius:16px;padding:18px 20px;width:100%;text-align:left;color:var(--tx)}
.recent .rh{font-size:.82rem;letter-spacing:.24em;color:var(--txm);text-transform:uppercase;margin-bottom:10px}
.recent .line{font-family:var(--face-caps);font-size:1.25rem;letter-spacing:.02em}
.recent .tr{font-family:var(--face-ital);font-style:italic;font-size:1.02rem;color:var(--txs);margin-top:2px}

/* ---------- the empty state ---------- */
.empty{padding:54px 30px;text-align:center}
.empty .eb{font-family:var(--face-caps);font-size:1.3rem;margin-bottom:8px}
.empty .es{color:var(--txm);font-size:.86rem;line-height:1.9}
/* The one link in the app that leaves it. A button in every way but the tag:
   a mailto cannot be a <button>, because what opens Mail is the href. */
.outapp{display:inline-block;margin-top:18px;text-decoration:none}

/* ---------- the dictionary ---------- */
/* The box is as tall as the field inside it and no taller. It carried ten
   pixels of padding above and below a 44px input, which made a 66px bar
   across the top of two screens. 「検索バー縦長すぎる」 */
.search{display:flex;align-items:center;gap:9px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 2px;margin:8px 0 2px}
.search input{flex:1;min-height:44px;background:none;border:none;color:var(--tx);font-family:inherit;font-size:.92rem;outline:none}
.gl{font-family:var(--face-ital);font-style:italic;color:var(--gold);font-size:1.1rem;margin:20px 0 2px;opacity:.9}
/* An entry is two controls now -- the word, which says itself, and the
   chevron, which opens it -- so the row is a container and the padding and
   the rule under it stay on the row while the touch targets sit inside. */
.entry{display:flex;align-items:center;gap:4px;padding:13px 2px;
       border-bottom:1px solid var(--line);width:100%;color:var(--tx)}
.ebody{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font-family:inherit}
.ebody:active{opacity:.55}
.entry.one .ebody{min-height:44px;display:flex;align-items:center}
.rowq{flex:0 0 auto;width:44px;height:44px;background:none;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;font-family:inherit}
.rowq .qo{width:19px;height:19px;border-radius:50%;border:1px solid var(--goldln);
  display:flex;align-items:center;justify-content:center;color:var(--txm);font-size:.68rem}
.rowq:active{opacity:.55}
/* The label does not stretch: the mark belongs next to the word it is about,
   not at the far side of the row. */
.entry.one .ebody{flex:0 0 auto;min-width:44px}
/* A word says itself, on its own row -- 44 down as well as across, because a
   row is as tall as its text and its text is two lines of small type. */
.esay{flex:0 0 44px;width:44px;min-height:44px;background:none;border:0;color:var(--txm);
  display:flex;align-items:center;justify-content:center}
.esay:active{color:var(--gold)}
.eopen{flex:0 0 auto;min-width:44px;min-height:44px;background:none;border:0;color:var(--txm);
       display:inline-flex;align-items:center;justify-content:center}
.eopen:active{color:var(--gold)}
/* How many are on screen, what order they are in, and the way to hear them
   all. One row, because they are all answers to "what am I looking at". */
.wmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
.wct{font-size:.86rem;color:var(--txm);letter-spacing:.04em;margin-right:auto}
/* This said .wsrt a second time, three hundred lines under the first, as a
   bordered pill with a 10pt radius -- and being second it won. So the sort
   button was a rounded box beside a control that is a line, which is the one
   shape this app does not have: everything a thumb chooses from sits on a
   rule. 「基本的に下直線なんだから角丸禁止」 The rule that means it is the
   one beside the filter, and there is only one of it now.
   `.wsay` went with it: nothing in www/ has carried that class since the
   dictionary stopped playing a whole list. */
/* Six ways to narrow the list will not fit across 320px, so the rail slides
   sideways rather than wrapping into a second row that pushes the words off
   the screen. */
