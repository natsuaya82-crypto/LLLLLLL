# Every push runs the translation net. A screen that is not fully translated
# in all ten languages fails here, before it can reach a build tag.
name: i18n

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Check every screen in every language
        run: node tools/i18n-check.mjs
