name: iOS → TestFlight

on:
  push:
    branches: [ main ]      # main へ push したら自動でビルド&アップロード
  workflow_dispatch: {}      # 手動実行もできる（Actionsタブの Run workflow）

jobs:
  testflight:
    runs-on: macos-14        # Apple の macOS ランナー（Xcode入り）でビルド
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web依存を入れて Capacitor を同期
        run: |
          npm ci
          npx cap sync ios

      - name: Ruby / Fastlane をセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: TestFlight へビルド&アップロード
        env:
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:  ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8:     ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER:   ${{ github.run_number }}
        run: bundle exec fastlane beta

      - name: 生成物(ipa)を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lingua-ipa
          path: build/*.ipa
          if-no-files-found: ignore
