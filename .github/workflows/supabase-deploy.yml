# Supabase の Edge Function を置く。オーナーにはターミナルが無く、全部 GitHub で
# やる（OWNER 2026-09-13「パソコンのターミナルないよ。全部ギットハブでなってる」）
# ので、supabase/setup.md § 8b-2 と § 8b-3 の三行をここが代わりに打つ。
#
# 要る鍵は一つ：repo の Secrets に SUPABASE_ACCESS_TOKEN
# （https://supabase.com/dashboard/account/tokens で作る）。
# APPLE_ROOT_CA_G3 は Apple の公開証明書なので、ここで落として base64 にして
# Supabase の Secrets に入れる。値を人が打たないので、写し間違いが起きない。
#
# 最後に関数を叩いて、401 {"why":"no session"} が返ることを印字する。
# それが「置かれていて、サインインしていない人を断る」の確かめ。
name: Supabase Deploy

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'どの関数を置くか'
        required: true
        default: verify-plan
        type: choice
        options:
          - verify-plan
          - daily-prompt
          - push-send

env:
  PROJECT_REF: iimwukyyasbybfrirhsf
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apple Root CA - G3 を Supabase の Secrets に入れる（verify-plan のみ）
        if: inputs.function == 'verify-plan'
        run: |
          curl -sSfL -o AppleRootCA-G3.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
          B64=$(base64 -w0 AppleRootCA-G3.cer)
          test -n "$B64"
          supabase secrets set "APPLE_ROOT_CA_G3=$B64" --project-ref "$PROJECT_REF"
          echo "APPLE_ROOT_CA_G3: set ($(wc -c < AppleRootCA-G3.cer) bytes)"

      # Google Play の購入を確かめる鍵（docs/ANDROID.md § オーナーがすること）。
      # サービスアカウントの JSON 鍵をまるごと、GitHub の Secrets の
      # GOOGLE_PLAY_SERVICE_ACCOUNT に。**空なら落とさない** ── オーナーが
      # Play Console を作るまでは無いのが事実で、その間も Apple の道は置かれる
      # べきだから。無いまま置かれた函数は Google の購入を一つも数えず、
      # `left` に「GOOGLE_PLAY_SERVICE_ACCOUNT is not set」と言う。
      - name: Google Play のサービスアカウント鍵を Supabase の Secrets に入れる（verify-plan のみ）
        if: inputs.function == 'verify-plan'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT: GitHub の Secrets に無い ── Android の購入はまだ数えられません（Apple はそのまま）"
            exit 0
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT" | node -e 'const k=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!k.client_email||!k.private_key){console.error("JSON 鍵に client_email か private_key がありません"); process.exit(1)} console.log("鍵: "+k.client_email)'
          supabase secrets set "GOOGLE_PLAY_SERVICE_ACCOUNT=$GOOGLE_PLAY_SERVICE_ACCOUNT" --project-ref "$PROJECT_REF"
          echo "GOOGLE_PLAY_SERVICE_ACCOUNT: set"

      - name: APNs の鍵を Supabase の Secrets に入れる（push-send のみ）
        if: inputs.function == 'push-send'
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_P8: ${{ secrets.APNS_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 三つとも人が打つ値なので、どれが空かをここで言う。空のまま置くと
          # 函数は 500 で止まって何も送らない（それが正しい側）が、その 500 を
          # 後で読むより、ここで名前が出るほうが早い。
          MISSING=
          for n in APNS_KEY_ID APNS_P8 APPLE_TEAM_ID; do
            eval "v=\$$n"; test -n "$v" || MISSING="$MISSING $n"
          done
          if [ -n "$MISSING" ]; then
            echo "GitHub の Secrets に入っていません:$MISSING"
            echo "docs/apple.md § 8 の手順で入れてから、もう一度この Actions を回してください。"
            exit 1
          fi
          # APNS_P8 は改行のある PEM。値をそのまま渡します ── 行が潰れると
          # importKey が落ち、函数は 500 を返して何も送りません。
          supabase secrets set "APNS_KEY_ID=$APNS_KEY_ID" \
                               "APPLE_TEAM_ID=$APPLE_TEAM_ID" \
                               "APNS_P8=$APNS_P8" \
                               --project-ref "$PROJECT_REF"
          echo "APNS_KEY_ID / APPLE_TEAM_ID / APNS_P8: set"

      # Android の通知（Firebase Cloud Messaging）の鍵。Firebase の「サービス
      # アカウント」→「新しい秘密鍵を生成」で出る JSON を、そのまま GitHub の
      # Secrets の FCM_SERVICE_ACCOUNT に入れる（docs/ANDROID.md § 通知）。
      # **無くても止めない** ── Firebase はオーナーの手で後から入るもので、
      # それまで iPhone の通知を置けない理由は無い。無い間の push-send は
      # Android の行にだけ送らず、答えの left に「not set」と言う。
      - name: FCM の鍵を Supabase の Secrets に入れる（push-send のみ、あれば）
        if: inputs.function == 'push-send'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "FCM_SERVICE_ACCOUNT: GitHub の Secrets に無い ── Android には送らない（iPhone はそのまま）"
            exit 0
          fi
          # JSON として読めて、要る三つがあるかをここで見る。壊れたまま置くと
          # 函数は Android の行ごとに「not set」を返すだけで、ここより遅く分かる。
          printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -e '.project_id and .client_email and .private_key' > /dev/null \
            || { echo "FCM_SERVICE_ACCOUNT が JSON でないか、project_id / client_email / private_key が無い"; exit 1; }
          supabase secrets set "FCM_SERVICE_ACCOUNT=$FCM_SERVICE_ACCOUNT" --project-ref "$PROJECT_REF"
          echo "FCM_SERVICE_ACCOUNT: set ($(printf '%s' "$FCM_SERVICE_ACCOUNT" | jq -r .project_id))"

      # 三つとも同じ置き方です。**--no-verify-jwt はどれにも付けません** ──
      # 「サインインなしで勧めるものないけど」 OWNER 2026-09-22。push-send を
      # 叩くのはデータベースのトリガーで、トリガーは**行を入れた人の
      # Authorization をそのまま持って行きます**（push_ping()、
      # supabase/schema.sql 末尾）。署名の無い呼び出しは、函数の一行目が走る
      # 前に Supabase が断ります。
      - name: 関数を置く
        run: supabase functions deploy "${{ inputs.function }}" --project-ref "$PROJECT_REF" --use-api

      # 置かれていて、サインインしていない人を断ること。三つとも 401 です。
      # 「通した」ではなく「そこで終わった」の確かめ。
      - name: 確かめる（サインインしていない人は 401 で断られる）
        run: |
          CODE=$(curl -s -o body.json -w '%{http_code}' -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/${{ inputs.function }}" \
            -H "Content-Type: application/json" -d '{"jws":[]}')
          echo "HTTP $CODE"; cat body.json; echo
          test "$CODE" = "401"
