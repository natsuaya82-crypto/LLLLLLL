name: iOS Deploy to App Store

on:
  workflow_dispatch: {}          # 手動実行も可能
  push:
    tags:
      - 'build-*'                # build-1, build-2 ... のタグ push で起動

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE"
          echo "Using: $XCODE"; xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync iOS (Web → iOS)
        run: npx cap sync ios

      # ビルド番号(CURRENT_PROJECT_VERSION)を CIのrun番号で毎回ユニークに上書き
      # （pbxproj側に書くので、手順書の「署名/番号はpbxprojに持たせCLIに渡さない」方針と一致）
      # 版(MARKETING_VERSION)は package.json の "version" 一箇所から。人が pbxproj の
      # 五箇所を手で上げる約束は 2026-09-22 に破れた（1.0.0 のまま 164 を上げ、
      # Apple に ITMS-90186 で断られた）。assets-check が repo の pbxproj も同じ値で
      # あることを持つので、Xcode で手元に開いても同じ版になる。
      - name: Set build number and version
        run: |
          BN=${{ github.run_number }}
          MV=$(node -p "require('./package.json').version")
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BN};/g" \
            ios/App/App.xcodeproj/project.pbxproj || \
          sed -i "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BN};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${MV};/g" \
            ios/App/App.xcodeproj/project.pbxproj || \
          sed -i "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${MV};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "build number = ${BN}, version = ${MV}"

      # Apple が閉じた版（公開済みなど）にはビルドを受け取らない。断りはメールで
      # 一時間後に来て、ここの印は緑のまま ── だから archive の前に同じ問いを訊く。
      - name: 版が公開中より上か（App Store Connect に訊く）
        env:
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.IOS_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.IOS_API_KEY }}
        run: node tools/version-check.mjs

      # Team ID をSecretからpbxprojへ差し込む（プレースホルダ __APPLE_TEAM_ID__ を置換）
      - name: Inject Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ios/App/App.xcodeproj/project.pbxproj || \
          sed -i "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ios/App/App.xcodeproj/project.pbxproj

      # AdMob のアプリ ID と広告ユニット ID を Secret から Info.plist へ
      # （__ADMOB_APP_ID__ と __ADMOB_NATIVE_UNIT__）。Secret が無い間は Google の
      # テスト用 ID を入れる ── プレースホルダのまま出すと、アプリは起動した瞬間に
      # SDK が落とし、ビルド 86 と同じく Apple にも断られる。docs/apple.md § 9。
      - name: Inject AdMob IDs
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_UNIT: ${{ secrets.ADMOB_NATIVE_UNIT }}
        run: |
          APP="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~1458002511}"
          UNIT="${ADMOB_NATIVE_UNIT:-ca-app-pub-3940256099942544/3986624511}"
          P=ios/App/App/Info.plist
          sed -i '' "s#__ADMOB_APP_ID__#${APP}#g; s#__ADMOB_NATIVE_UNIT__#${UNIT}#g" "$P" || \
          sed -i "s#__ADMOB_APP_ID__#${APP}#g; s#__ADMOB_NATIVE_UNIT__#${UNIT}#g" "$P"
          if grep -q '__ADMOB_' "$P"; then echo "AdMob の ID が入っていません"; exit 1; fi

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # 2枚。本体と、システムキーボードの拡張。
      # どちらも group.com.tokinets.lingua を持っていないと Archive が落ちる。
      # 拡張の分が欠けると落ちるのは「本体は署名できたのに appex で止まる」形で、
      # エラーが本体の名前で出るので分かりにくい。
      - name: Install Provisioning Profiles
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KB_PROFILE_BASE64: ${{ secrets.KEYBOARD_PROVISIONING_PROFILE_BASE64 }}
          WG_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"    || { echo "::error::PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          test -n "$KB_PROFILE_BASE64" || { echo "::error::KEYBOARD_PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          # ウィジェットは #83 で足したターゲット。Secret がまだ無いうちは
          # 「無い」と言って止まる ── 黙って進んで Archive の途中で
          # 「No profile matching 'Lingua Widget Distribution'」に化けるより、
          # ここで名指しで止まったほうが読める。docs/apple.md § 2b。
          test -n "$WG_PROFILE_BASE64" || { echo "::error::WIDGET_PROVISIONING_PROFILE_BASE64 is empty — docs/apple.md の 2b を読んで、Lingua Widget Distribution を作って入れてください"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64"    | base64 --decode > app.mobileprovision
          echo "$KB_PROFILE_BASE64" | base64 --decode > kb.mobileprovision
          echo "$WG_PROFILE_BASE64" | base64 --decode > wg.mobileprovision
          cp app.mobileprovision kb.mobileprovision wg.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          # 名前と App Group をログに出す。署名が通ったあとに「どっちの
          # プロファイルで通ったのか」を後から読めるようにするため。
          #
          # 訊くのは「キーがあるか」ではなく「group.com.tokinets.lingua が
          # 入っているか」。Identifier 画面で App Groups に *チェックだけ* 入れて
          # Configure を押さないと、キーはあって配列が空のプロファイルが出てくる
          # ── PlistBuddy の Print は空配列でも成功するので、前の書き方はそれを
          # 通していた。通ると Archive も署名も緑で、App Group のファイルだけ
          # 読めないウィジェットが出荷される。それが一番読めない壊れ方なので、
          # ここで名指しで止める。docs/apple.md § 2b。
          for f in app.mobileprovision kb.mobileprovision wg.mobileprovision; do
            security cms -D -i "$f" > "$f.plist"
            echo "$f: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$f.plist")"
            groups=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$f.plist" 2>/dev/null || true)
            echo "$f app groups: $groups"
            case "$groups" in
              *group.com.tokinets.lingua*) ;;
              *) echo "::error::$f が group.com.tokinets.lingua を持っていません。Identifier の App Groups は *Configure* まで押して group を選び、そのあとプロファイルを作り直してください（古いプロファイルは capability を後から拾いません）。docs/apple.md § 2b"; exit 1 ;;
            esac
          done

      - name: Build & Archive iOS
        run: |
          # 署名パラメータは CLI に渡さない（pbxproj側に持たせる）。
          # 渡すと依存ライブラリにも署名が波及して archive が落ちるため。
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            -destination "generic/platform=iOS"

      # Archive は署名の指定を pbxproj から取り、Export はこの plist から取る。
      # 別々なので、ターゲットを増やしたときに Archive だけ通って Export で
      # 落ちる ── #85 がそれで、appex は正しく署名されて .xcarchive の中に
      # 入っているのに、ここに行が無いというだけで
      #   error: exportArchive "LinguaWidget.appex" requires a provisioning
      #          profile with the App Groups feature.
      # になった。拡張を足したら、ここの三つ目も足すこと。
      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tokinets.lingua</key>
              <string>Lingua Distribution</string>
              <key>com.tokinets.lingua.keyboard</key>
              <string>Lingua Keyboard Distribution</string>
              <key>com.tokinets.lingua.widget</key>
              <string>Lingua Widget Distribution</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: build/ipa/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.IOS_KEY_ID }}
          api-private-key: ${{ secrets.IOS_API_KEY }}
          wait-for-processing: false
