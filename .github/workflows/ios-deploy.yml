name: iOS Deploy to App Store

on:
  workflow_dispatch: {}          # 手動実行も可能
  push:
    tags:
      - 'build-*'                # build-1, build-2 ... のタグ push で起動

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(find /Applications -maxdepth 1 -name "Xcode_*.app" | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=/Applications/Xcode.app
          sudo xcode-select -s "$XCODE"
          echo "Using: $XCODE"; xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync iOS (Web → iOS)
        run: npx cap sync ios

      # ビルド番号(CURRENT_PROJECT_VERSION)を CIのrun番号で毎回ユニークに上書き
      # （pbxproj側に書くので、手順書の「署名/番号はpbxprojに持たせCLIに渡さない」方針と一致）
      - name: Set build number
        run: |
          BN=${{ github.run_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BN};/g" \
            ios/App/App.xcodeproj/project.pbxproj || \
          sed -i "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BN};/g" \
            ios/App/App.xcodeproj/project.pbxproj
          echo "build number = ${BN}"

      # Team ID をSecretからpbxprojへ差し込む（プレースホルダ __APPLE_TEAM_ID__ を置換）
      - name: Inject Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ios/App/App.xcodeproj/project.pbxproj || \
          sed -i "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ios/App/App.xcodeproj/project.pbxproj

      - name: Install Apple Distribution Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      # 2枚。本体と、システムキーボードの拡張。
      # どちらも group.com.tokinets.lingua を持っていないと Archive が落ちる。
      # 拡張の分が欠けると落ちるのは「本体は署名できたのに appex で止まる」形で、
      # エラーが本体の名前で出るので分かりにくい。
      - name: Install Provisioning Profiles
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KB_PROFILE_BASE64: ${{ secrets.KEYBOARD_PROVISIONING_PROFILE_BASE64 }}
          WG_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"    || { echo "::error::PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          test -n "$KB_PROFILE_BASE64" || { echo "::error::KEYBOARD_PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          # ウィジェットは #83 で足したターゲット。Secret がまだ無いうちは
          # 「無い」と言って止まる ── 黙って進んで Archive の途中で
          # 「No profile matching 'Lingua Widget Distribution'」に化けるより、
          # ここで名指しで止まったほうが読める。docs/apple.md § 2b。
          test -n "$WG_PROFILE_BASE64" || { echo "::error::WIDGET_PROVISIONING_PROFILE_BASE64 is empty — docs/apple.md の 2b を読んで、Lingua Widget Distribution を作って入れてください"; exit 1; }
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64"    | base64 --decode > app.mobileprovision
          echo "$KB_PROFILE_BASE64" | base64 --decode > kb.mobileprovision
          echo "$WG_PROFILE_BASE64" | base64 --decode > wg.mobileprovision
          cp app.mobileprovision kb.mobileprovision wg.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          # 名前と App Group をログに出す。署名が通ったあとに「どっちの
          # プロファイルで通ったのか」を後から読めるようにするため。
          for f in app.mobileprovision kb.mobileprovision wg.mobileprovision; do
            security cms -D -i "$f" > "$f.plist"
            echo "$f: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$f.plist")"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$f.plist" \
              || { echo "::error::$f has no application-groups entitlement"; exit 1; }
          done

      - name: Build & Archive iOS
        run: |
          # 署名パラメータは CLI に渡さない（pbxproj側に持たせる）。
          # 渡すと依存ライブラリにも署名が波及して archive が落ちるため。
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tokinets.lingua</key>
              <string>Lingua Distribution</string>
              <key>com.tokinets.lingua.keyboard</key>
              <string>Lingua Keyboard Distribution</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: build/ipa/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.IOS_KEY_ID }}
          api-private-key: ${{ secrets.IOS_API_KEY }}
          wait-for-processing: false
