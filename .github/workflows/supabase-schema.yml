# 本番の Supabase に SQL を流す／読む。オーナーが外にいてスマホしか無い時に、
# 大きい supabase/schema.sql を SQL Editor へ貼れない（OWNER 2026-09-26「今熊本
# いるから全て選択できない」「やりましょう」）。貼る代わりに、このボタンが
# Supabase の管理 API（POST /v1/projects/{ref}/database/query）へ送る。
#
# 要る鍵は Supabase Deploy と同じ一つ：repo の Secrets の SUPABASE_ACCESS_TOKEN。
#
#   check  ── 読むだけ。通知の道（Webhooks・トリガー・宛先の数・push-send の
#             答え十件）と、schema の新しさの印を Actions の記録に出す。
#             何も書かない。
#   logs   ── 読むだけ。直近 6 時間の、断られた要求（4xx・5xx）と Postgres の
#             エラーを出す（Supabase のログ API）。何も書かない。
#   apply  ── supabase/schema.sql を丸ごと流す（何度流しても同じになる作り）。
#             流した後に check と同じものを出す。本番を書き換えるので、押すのは
#             オーナーか、オーナーが「押して」と言った時だけ。
#   once   ── supabase/once/ の、file に名前を書いた一つを、一度だけ流す。
#             流した名前は schema_step に `once/<名前>` で残り（schema.sql の
#             「what this file has done once」と同じ表）、同じ名前はもう流れない
#             ── 一度だけの SQL は、二度目に流れた時に過去を今で作り直すから。
#             名前を書くのは押す人で、「一番新しいもの」を選ぶ仕組みは無い。
#             押すのは apply と同じ人だけ。
name: Supabase Schema

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check・logs（読むだけ）、apply（schema.sql を流す）、once（file の一つを一度だけ流す）'
        required: true
        default: check
        type: choice
        options:
          - check
          - logs
          - apply
          - once
      file:
        description: 'once の時だけ: supabase/once/ の中のファイル名（例 2026-09-27-today.sql）'
        required: false
        default: ''
        type: string

env:
  PROJECT_REF: iimwukyyasbybfrirhsf
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 鍵があるか
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "GitHub の Secrets に SUPABASE_ACCESS_TOKEN がありません"; exit 1; }

      - name: schema.sql を流す（apply の時だけ）
        if: inputs.action == 'apply'
        run: |
          jq -Rs '{query: .}' supabase/schema.sql > q.json
          CODE=$(curl -s -o out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @q.json)
          echo "HTTP $CODE"; head -c 2000 out.json; echo
          case "$CODE" in 2*) ;; *) exit 1 ;; esac

      # 名前を記録する一行と SQL は一つの問い合わせで送る。PostgreSQL は一つの
      # 問い合わせの中の文を一つの取引として流すので、SQL が落ちれば記録も
      # 残らず、記録が既にあれば（主キーが断る）SQL は流れない。管理 API が
      # 一つの問い合わせとして渡すことは、本番で確かめていない。
      - name: 一回だけの SQL を流す（once の時だけ。file に名前を書いた一つ）
        if: inputs.action == 'once'
        env:
          FILE: ${{ inputs.file }}
        run: |
          case "$FILE" in
            ''|*/*|*..*) echo "file に supabase/once/ の中の名前を一つ書いてください"; exit 1 ;;
          esac
          F="supabase/once/$FILE"
          test -f "$F" || { echo "$F はありません"; exit 1; }
          echo "$F"
          { printf "insert into schema_step(step) values ('once/%s');\n" "$FILE"; cat "$F"; } > run.sql
          jq -Rs '{query: .}' run.sql > q.json
          CODE=$(curl -s -o out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @q.json)
          echo "HTTP $CODE"
          jq -r '.[] | "\(.what)\t\(.value)"' out.json 2>/dev/null || head -c 2000 out.json
          case "$CODE" in 2*) ;; *) exit 1 ;; esac

      - name: ログを読む（logs の時だけ）
        if: inputs.action == 'logs'
        run: |
          S=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          q(){
            curl -s -G "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --data-urlencode "iso_timestamp_start=$S" --data-urlencode "iso_timestamp_end=$E" \
              --data-urlencode "sql=$1" > out.json
            head -c 6000 out.json; echo
          }
          echo '== 断られた要求'
          q "select datetime(timestamp) as t, request.method as m, request.path as p, request.search as s, response.status_code as c from edge_logs cross join unnest(metadata) as md cross join unnest(md.request) as request cross join unnest(md.response) as response where response.status_code >= 400 order by timestamp desc limit 60"
          echo '== Postgres のエラー'
          q "select datetime(timestamp) as t, parsed.error_severity as sev, event_message as msg from postgres_logs cross join unnest(metadata) as md cross join unnest(md.parsed) as parsed where parsed.error_severity in ('ERROR','FATAL','PANIC') order by timestamp desc limit 40"

      - name: 読む（通知の道と schema の新しさ）
        if: inputs.action != 'logs'
        run: |
          cat > check.sql <<'SQL'
          select 'webhooks' as what,
                 (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                   where n.nspname='net' and p.proname='http_post')::text as value
          union all
          select 'triggers', string_agg(tgname, ',' order by tgname) from pg_trigger where tgname like 'push_on_%'
          union all
          select 'posts_by', (select count(*) from pg_proc where proname='posts_by')::text
          union all
          select 'devices', count(*)::text from device
          union all
          select 'calls_24h', count(*)::text from net._http_response where created > now() - interval '24 hours'
          union all
          select 'push ' || to_char(created, 'MM-DD HH24:MI'), coalesce(status_code::text, 'none') || ' timed_out=' || coalesce(timed_out::text, '-') || ' err=' || left(coalesce(error_msg, ''), 160) || ' ' || left(coalesce(content,''), 200)
            from (select created, status_code, content, timed_out, error_msg from net._http_response
                   order by created desc limit 10) r
          union all
          select 'slice ' || to_char(at, 'MM-DD HH24:MI:SS'), kind || ' no=' || no || ' len=' || length(body) || ' lang=' || left(language::text, 8)
            from (select at, kind, no, body, language from slice order by at desc limit 15) s
          union all
          select 'lang ' || to_char(created_at, 'MM-DD HH24:MI'), left(id::text, 8) || ' ' || coalesce(name, '-') || ' ' || coalesce(wsys, '-')
            from (select created_at, id, name, wsys from language order by created_at desc limit 8) l
          union all
          select 'mine ' || to_char(l.created_at, 'MM-DD HH24:MI') || ' ' || left(l.id::text, 8),
                 coalesce(nullif(l.name, ''), '-') || ' wsys=' || coalesce(nullif(l.wsys, ''), '-') || ' kinds=' ||
                 coalesce((select string_agg(kind || ':' || no || '@' || to_char(s.at, 'MM-DD HH24:MI'), ',' order by kind) from slice s where s.language = l.id), '') || ' owner=' || left(l.owner::text, 8)
            from language l
           where l.owner in (select owner from language where wsys = 'block')
          union all
          select 'face ' || handle, case when av is null then 'none' else 'kind=' || coalesce((select string_agg(k, ',') from jsonb_object_keys(av) k), '?') end
            from profile where handle = 'tytaymcgill'
          union all
          select 'postface ' || to_char(created_at, 'MM-DD'), case when body ? 'av' then 'kind=' || coalesce((select string_agg(k, ',') from jsonb_object_keys(body->'av') k), '?') else 'none' end
            from (select created_at, body from post where author = (select id from profile where handle = 'tytaymcgill') order by created_at desc limit 3) z
          union all
          select 'faceed ' || handle, coalesce(ed::text, '-') from profile where handle = 'tytaymcgill'
          union all
          select 'prompt ' || on_day::text, left(coalesce(text, ''), 80)
            from (select on_day, text from prompt order by on_day desc limit 5) p
          union all
          select 'cronjob ' || jobname, schedule || ' active=' || active::text
                 || ' timeout=' || coalesce(substring(command from 'timeout_milliseconds\s*:=\s*([0-9]+)'), '-')
                 || ' headers=' || case when command ~ 'vault' then 'vault' else 'in the command' end
            from cron.job
          union all
          select 'ran ' || step, to_char(at, 'MM-DD HH24:MI')
            from schema_step
          union all
          select 'cronrun ' || to_char(start_time, 'MM-DD HH24:MI'), status || ' ' || left(coalesce(return_message, ''), 160)
            from (select start_time, status, return_message from cron.job_run_details order by start_time desc limit 8) c
          union all
          select 'slow ' || calls || 'x mean=' || round(mean_exec_time) || 'ms max=' || round(max_exec_time) || 'ms',
                 left(regexp_replace(query, '\s+', ' ', 'g'), 160)
            from (select calls, mean_exec_time, max_exec_time, query from extensions.pg_stat_statements
                   where query ilike '%slice%' or query ilike '%language%'
                   order by max_exec_time desc limit 12) q;
          SQL
          jq -Rs '{query: .}' check.sql > q.json
          CODE=$(curl -s -o out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @q.json)
          echo "HTTP $CODE"
          jq -r '.[] | "\(.what)\t\(.value)"' out.json 2>/dev/null || cat out.json
          case "$CODE" in 2*) ;; *) exit 1 ;; esac
